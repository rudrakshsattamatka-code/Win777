<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WIN777 - Login</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: #0a0a0f; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .app-container { max-width: 420px; width: 100%; background: #0a0a0f; min-height: 100vh; margin: 0 auto; }
        .header { background: #0a0a0f; padding: 40px 20px 20px; text-align: center; }
        .logo { font-size: 36px; font-weight: bold; color: #00b4ff; letter-spacing: 3px; }
        .tagline { font-size: 11px; color: #fff; margin-top: 8px; opacity: 0.7; }
        .screen { padding: 20px; }
        .input-field { background: #1a1a2e; border: 1px solid #00b4ff; border-radius: 12px; padding: 15px; width: 100%; color: white; font-size: 16px; margin-bottom: 20px; outline: none; }
        .input-field:focus { border-color: #fff; }
        .pin-input { font-size: 24px; text-align: center; letter-spacing: 8px; }
        .btn { width: 100%; padding: 14px; background: #00b4ff; border: none; border-radius: 12px; color: #000; font-weight: bold; font-size: 16px; cursor: pointer; }
        .btn-outline { background: transparent; border: 1px solid #00b4ff; color: #00b4ff; margin-top: 10px; }
        .link { text-align: center; margin-top: 15px; color: #00b4ff; font-size: 13px; cursor: pointer; }
        .timer { color: #00b4ff; font-size: 24px; font-weight: bold; margin: 20px 0; text-align: center; }
        .welcome-text { color: #00b4ff; font-size: 14px; margin-bottom: 20px; text-align: center; }
        .error-text { color: #ff4444; font-size: 12px; text-align: center; margin-top: 10px; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 1000; display: none; justify-content: center; align-items: center; }
        .modal-content { background: #1a1a2e; border-radius: 20px; padding: 25px; width: 85%; max-width: 320px; text-align: center; border: 1px solid #00b4ff; }
        .modal-title { color: #00b4ff; font-size: 20px; margin-bottom: 15px; }
        .modal-text { color: #fff; font-size: 14px; margin-bottom: 20px; }
        .modal-buttons { display: flex; gap: 15px; }
        .modal-btn { flex: 1; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .modal-btn-allow { background: #00b4ff; border: none; color: #000; }
        .modal-btn-deny { background: transparent; border: 1px solid #00b4ff; color: #00b4ff; }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header"><div class="logo">WIN777</div><div class="tagline">India's best Satta Matka Application</div></div>

    <div id="modalOverlay" class="modal-overlay"><div class="modal-content"><div class="modal-title">🔔 Allow Notifications</div><div class="modal-text">Stay updated with your bets, results, and offers!</div><div class="modal-buttons"><button class="modal-btn modal-btn-deny" id="modalDenyBtn">Don't Allow</button><button class="modal-btn modal-btn-allow" id="modalAllowBtn">Allow</button></div></div></div>

    <div id="phoneScreen" class="screen"><input type="tel" id="phoneNumber" class="input-field" placeholder="Enter Mobile Number"><button class="btn" id="sendOtpBtn">Login with OTP</button><div class="link" id="showPinBtn">Login with MPIN</div><div id="phoneError" class="error-text"></div></div>

    <div id="otpScreen" class="screen hidden"><div class="welcome-text">India's best Satta Matka Application Welcomes You !!!</div><div class="timer" id="timer">Second Remaining 60</div><input type="text" id="otpCode" class="input-field" placeholder="Enter OTP" maxlength="6"><button class="btn" id="verifyOtpBtn">SUBMIT</button><div class="link" id="resendOtpBtn">Resend OTP</div><div id="otpError" class="error-text"></div></div>

    <div id="pinScreen" class="screen hidden"><input type="password" id="pinInput" class="input-field pin-input" placeholder="●●●●" maxlength="4"><button class="btn" id="verifyPinBtn">Login with MPIN</button><div class="link" id="forgotPinBtn">Forgot MPIN?</div><div id="pinError" class="error-text"></div></div>

    <div id="registerScreen" class="screen hidden"><input type="text" id="regName" class="input-field" placeholder="Full Name"><input type="password" id="regPin" class="input-field" placeholder="Create MPIN" maxlength="4"><input type="password" id="regConfirmPin" class="input-field" placeholder="Confirm MPIN" maxlength="4"><button class="btn" id="registerBtn">Register</button><div id="regError" class="error-text"></div></div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyBeGpb7V0i5GN1opY9JECHxQIGvHFDPX38", authDomain: "win777-ed482.firebaseapp.com", projectId: "win777-ed482", storageBucket: "win777-ed482.firebasestorage.app", messagingSenderId: "843686112399", appId: "1:843686112399:web:9c20a96831e6a94cd814fa" };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    
    let confirmationResult = null, currentPhone = null, countdown = 0, timerInterval = null, recaptchaVerifier = null;
    const modalOverlay = document.getElementById('modalOverlay');
    
    function showModal(title, text, onAllow, onDeny) {
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalText').innerHTML = text;
        modalOverlay.style.display = 'flex';
        document.getElementById('modalAllowBtn').onclick = () => { modalOverlay.style.display = 'none'; if (onAllow) onAllow(); };
        document.getElementById('modalDenyBtn').onclick = () => { modalOverlay.style.display = 'none'; if (onDeny) onDeny(); };
    }
    
    function showScreen(screen) {
        document.getElementById('phoneScreen').classList.add('hidden');
        document.getElementById('otpScreen').classList.add('hidden');
        document.getElementById('pinScreen').classList.add('hidden');
        document.getElementById('registerScreen').classList.add('hidden');
        screen.classList.remove('hidden');
    }
    
    function showError(elementId, message) { const el = document.getElementById(elementId); if (el) { el.innerText = message; setTimeout(() => el.innerText = '', 4000); } }
    
    function initRecaptcha() { if (!recaptchaVerifier) { const container = document.createElement('div'); container.id = 'recaptcha-container'; container.style.position = 'absolute'; container.style.left = '-9999px'; document.body.appendChild(container); recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { size: 'invisible' }); } return recaptchaVerifier; }
    
    function startTimer(seconds) { countdown = seconds; if (timerInterval) clearInterval(timerInterval); timerInterval = setInterval(() => { if (countdown <= 1) clearInterval(timerInterval); const timerEl = document.getElementById('timer'); if (timerEl && countdown > 0) timerEl.innerText = `Second Remaining ${countdown}`; countdown--; }, 1000); }
    
    document.getElementById('sendOtpBtn').onclick = function() {
        const phone = document.getElementById('phoneNumber').value.replace(/\D/g, '');
        if (!phone || phone.length < 10) { showError('phoneError', 'Enter valid 10-digit number'); return; }
        currentPhone = '+91' + phone;
        const btn = this; btn.disabled = true; btn.innerText = 'Sending...';
        const verifier = initRecaptcha();
        auth.signInWithPhoneNumber(currentPhone, verifier).then(confirmation => { confirmationResult = confirmation; showScreen(otpScreen); startTimer(60); btn.disabled = false; btn.innerText = 'Login with OTP'; }).catch(error => { showError('phoneError', error.message); btn.disabled = false; btn.innerText = 'Login with OTP'; });
    };
    
    document.getElementById('verifyOtpBtn').onclick = function() {
        const code = document.getElementById('otpCode').value;
        if (!code || code.length !== 6) { showError('otpError', 'Enter 6-digit OTP'); return; }
        const btn = this; btn.disabled = true; btn.innerText = 'Verifying...';
        confirmationResult.confirm(code).then(result => { const user = result.user; db.collection('users').doc(user.uid).get().then(doc => { if (doc.exists && doc.data().pin) showScreen(pinScreen); else showScreen(registerScreen); btn.disabled = false; btn.innerText = 'SUBMIT'; }).catch(() => { showScreen(registerScreen); btn.disabled = false; btn.innerText = 'SUBMIT'; }); }).catch(error => { showError('otpError', 'Invalid OTP'); btn.disabled = false; btn.innerText = 'SUBMIT'; });
    };
    
    document.getElementById('resendOtpBtn').onclick = function() { if (!currentPhone) return; const verifier = initRecaptcha(); auth.signInWithPhoneNumber(currentPhone, verifier).then(confirmation => { confirmationResult = confirmation; startTimer(60); showError('otpError', 'OTP resent!'); }).catch(error => showError('otpError', error.message)); };
    
    document.getElementById('registerBtn').onclick = function() {
        const name = document.getElementById('regName').value.trim(), pin = document.getElementById('regPin').value, confirmPin = document.getElementById('regConfirmPin').value;
        if (!name) { showError('regError', 'Enter your name'); return; } if (!pin || pin.length !== 4) { showError('regError', 'MPIN must be 4 digits'); return; } if (pin !== confirmPin) { showError('regError', 'MPINs do not match'); return; }
        const user = auth.currentUser; if (!user) { showError('regError', 'Session expired'); return; }
        const btn = this; btn.disabled = true; btn.innerText = 'Creating...';
        db.collection('users').doc(user.uid).set({ uid: user.uid, phone: user.phoneNumber, name: name, pin: pin, balance: 0, role: 'user', createdAt: new Date() }).then(() => { showModal('🔔 Allow Notifications', 'Stay updated with your bets, results, and offers!', () => { if (Notification.permission === 'default') Notification.requestPermission(); window.location.href = 'dashboard.html'; }, () => { window.location.href = 'dashboard.html'; }); btn.disabled = false; btn.innerText = 'Register'; }).catch(error => { showError('regError', error.message); btn.disabled = false; btn.innerText = 'Register'; });
    };
    
    document.getElementById('verifyPinBtn').onclick = function() {
        const pin = document.getElementById('pinInput').value;
        if (!pin || pin.length !== 4) { showError('pinError', 'Enter 4-digit MPIN'); return; }
        const user = auth.currentUser; if (!user) { showScreen(phoneScreen); return; }
        const btn = this; btn.disabled = true; btn.innerText = 'Verifying...';
        db.collection('users').doc(user.uid).get().then(doc => { if (doc.exists && doc.data().pin === pin) window.location.href = 'dashboard.html'; else showError('pinError', 'Invalid MPIN'); btn.disabled = false; btn.innerText = 'Login with MPIN'; }).catch(error => { showError('pinError', 'Error verifying PIN'); btn.disabled = false; btn.innerText = 'Login with MPIN'; });
    };
    
    document.getElementById('showPinBtn').onclick = function() {
        const user = auth.currentUser; if (!user) { showScreen(phoneScreen); return; }
        db.collection('users').doc(user.uid).get().then(doc => { if (doc.exists && doc.data().pin) showScreen(pinScreen); else showScreen(phoneScreen); }).catch(() => showScreen(phoneScreen));
    };
    
    document.getElementById('forgotPinBtn').onclick = function() { auth.signOut().then(() => showScreen(phoneScreen)).catch(() => showScreen(phoneScreen)); };
    
    auth.onAuthStateChanged(user => { if (user) { db.collection('users').doc(user.uid).get().then(doc => { if (doc.exists && doc.data().pin) showScreen(pinScreen); else if (doc.exists && !doc.data().pin) showScreen(registerScreen); else showScreen(phoneScreen); }).catch(() => showScreen(phoneScreen)); } else showScreen(phoneScreen); });
</script>
</body>
</html>
