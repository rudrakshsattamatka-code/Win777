<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WIN777 - Login</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
        body{background:#0a0a0f;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
        .login-box{background:#1a1a2e;padding:30px;border-radius:20px;width:100%;max-width:400px;border:1px solid #0096ff}
        .logo{text-align:center;margin-bottom:20px}
        .logo img{width:80px}
        h2{color:#0096ff;text-align:center;margin-bottom:20px;font-size:20px}
        input{width:100%;padding:12px;margin:10px 0;background:#0a0a0f;border:1px solid #0096ff;border-radius:10px;color:white}
        button{width:100%;padding:12px;background:#0096ff;border:none;border-radius:10px;color:white;font-weight:bold;cursor:pointer}
        .error{color:#ff6b6b;font-size:12px;margin-top:10px;text-align:center}
        .otp-group{display:flex;gap:10px;justify-content:center;margin:15px 0}
        .otp-digit{width:45px;height:50px;text-align:center;font-size:20px;background:#0a0a0f;border:1px solid #0096ff;border-radius:10px;color:white}
        .hidden{display:none}
    </style>
</head>
<body>
<div class="login-box" id="app">
    <div class="logo"><img src="https://i.imgur.com/lPQ7wQD.png" alt="logo"></div>
    <div id="phoneScreen">
        <h2>Welcome Back!</h2>
        <input type="tel" id="phone" placeholder="Enter 10 digit mobile number">
        <button id="sendOtpBtn">Send OTP</button>
        <div id="phoneError" class="error"></div>
    </div>
    <div id="otpScreen" class="hidden">
        <h2>Enter OTP</h2>
        <div class="otp-group">
            <input type="text" class="otp-digit" maxlength="1" id="otp1"><input type="text" class="otp-digit" maxlength="1" id="otp2">
            <input type="text" class="otp-digit" maxlength="1" id="otp3"><input type="text" class="otp-digit" maxlength="1" id="otp4">
            <input type="text" class="otp-digit" maxlength="1" id="otp5"><input type="text" class="otp-digit" maxlength="1" id="otp6">
        </div>
        <button id="verifyBtn">Verify</button>
        <button id="resendBtn" style="background:#333;margin-top:10px">Resend OTP</button>
        <div id="otpError" class="error"></div>
    </div>
    <div id="pinScreen" class="hidden">
        <h2>Create 4-digit PIN</h2>
        <input type="password" id="pin" maxlength="4" placeholder="Enter PIN">
        <input type="password" id="confirmPin" maxlength="4" placeholder="Confirm PIN">
        <button id="registerBtn">Create Account</button>
        <div id="pinError" class="error"></div>
    </div>
    <div id="pinLoginScreen" class="hidden">
        <h2>Enter 4-digit PIN</h2>
        <input type="password" id="loginPin" maxlength="4" placeholder="Enter PIN">
        <button id="pinLoginBtn">Login</button>
        <button id="logoutPinBtn" style="background:#333;margin-top:10px">Use different account</button>
        <div id="pinLoginError" class="error"></div>
    </div>
</div>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBeGpb7V0i5GN1opY9JECHxQIGvHFDPX38",
        authDomain: "win777-ed482.firebaseapp.com",
        projectId: "win777-ed482",
        storageBucket: "win777-ed482.firebasestorage.app",
        messagingSenderId: "843686112399",
        appId: "1:843686112399:web:9c20a96831e6a94cd814fa"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    
    let confirmation = null;
    let currentPhone = null;
    let timerInterval = null;
    let countdown = 0;
    
    function showScreen(screen){
        document.getElementById('phoneScreen').classList.add('hidden');
        document.getElementById('otpScreen').classList.add('hidden');
        document.getElementById('pinScreen').classList.add('hidden');
        document.getElementById('pinLoginScreen').classList.add('hidden');
        document.getElementById(screen).classList.remove('hidden');
    }
    
    // Send OTP
    document.getElementById('sendOtpBtn').onclick = async () => {
        let phone = document.getElementById('phone').value;
        if(phone.length < 10){
            document.getElementById('phoneError').innerText = 'Enter valid 10 digit number';
            return;
        }
        let fullPhone = '+91' + phone;
        currentPhone = fullPhone;
        let btn = document.getElementById('sendOtpBtn');
        btn.disabled = true;
        btn.innerText = 'Sending...';
        
        let recaptcha = new firebase.auth.RecaptchaVerifier('app', {size:'invisible'});
        try{
            confirmation = await auth.signInWithPhoneNumber(fullPhone, recaptcha);
            showScreen('otpScreen');
            startTimer(60);
            document.getElementById('otpError').innerText = 'OTP sent!';
        } catch(e){
            document.getElementById('phoneError').innerText = e.message;
        }
        btn.disabled = false;
        btn.innerText = 'Send OTP';
    };
    
    function startTimer(sec){
        countdown = sec;
        if(timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if(countdown <= 1){
                clearInterval(timerInterval);
                document.getElementById('resendBtn').innerHTML = 'Resend OTP';
                document.getElementById('resendBtn').disabled = false;
            } else {
                countdown--;
                document.getElementById('resendBtn').innerHTML = `Resend in ${countdown}s`;
                document.getElementById('resendBtn').disabled = true;
            }
        }, 1000);
    }
    
    // Verify OTP
    document.getElementById('verifyBtn').onclick = async () => {
        let code = '';
        for(let i=1;i<=6;i++) code += document.getElementById(`otp${i}`).value;
        if(code.length !== 6){
            document.getElementById('otpError').innerText = 'Enter 6 digit OTP';
            return;
        }
        try{
            let result = await confirmation.confirm(code);
            let user = result.user;
            let doc = await db.collection('users').doc(user.uid).get();
            if(doc.exists && doc.data().pin){
                window.location.href = 'dashboard.html';
            } else {
                showScreen('pinScreen');
            }
        } catch(e){
            document.getElementById('otpError').innerText = 'Invalid OTP';
        }
    };
    
    // Resend OTP
    document.getElementById('resendBtn').onclick = async () => {
        let recaptcha = new firebase.auth.RecaptchaVerifier('app', {size:'invisible'});
        confirmation = await auth.signInWithPhoneNumber(currentPhone, recaptcha);
        startTimer(60);
        document.getElementById('otpError').innerText = 'OTP resent!';
    };
    
    // Register PIN
    document.getElementById('registerBtn').onclick = async () => {
        let pin = document.getElementById('pin').value;
        let confirm = document.getElementById('confirmPin').value;
        if(pin.length !== 4){
            document.getElementById('pinError').innerText = 'PIN must be 4 digits';
            return;
        }
        if(pin !== confirm){
            document.getElementById('pinError').innerText = 'PINs do not match';
            return;
        }
        let user = auth.currentUser;
        if(!user) return;
        await db.collection('users').doc(user.uid).set({
            uid: user.uid,
            phone: user.phoneNumber,
            name: 'User',
            pin: pin,
            balance: 0,
            role: 'user'
        });
        window.location.href = 'dashboard.html';
    };
    
    // PIN Login
    document.getElementById('pinLoginBtn').onclick = async () => {
        let pin = document.getElementById('loginPin').value;
        if(pin.length !== 4){
            document.getElementById('pinLoginError').innerText = 'Enter 4 digit PIN';
            return;
        }
        let user = auth.currentUser;
        if(!user){
            showScreen('phoneScreen');
            return;
        }
        let doc = await db.collection('users').doc(user.uid).get();
        if(doc.exists && doc.data().pin === pin){
            window.location.href = 'dashboard.html';
        } else {
            document.getElementById('pinLoginError').innerText = 'Wrong PIN';
        }
    };
    
    document.getElementById('logoutPinBtn').onclick = async () => {
        await auth.signOut();
        showScreen('phoneScreen');
    };
    
    auth.onAuthStateChanged(async (user) => {
        if(user){
            let doc = await db.collection('users').doc(user.uid).get();
            if(doc.exists && doc.data().pin){
                showScreen('pinLoginScreen');
            } else {
                showScreen('phoneScreen');
            }
        } else {
            showScreen('phoneScreen');
        }
    });
</script>
<div id="app"></div>
</body>
</html>
