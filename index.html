<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>win777 - Secure Login</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .app-container {
            max-width: 450px;
            width: 100%;
            background: rgba(30, 30, 47, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 36px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.1);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #ff9800, #ff5722);
            padding: 30px 20px;
            text-align: center;
            color: white;
        }
        .header h1 {
            font-size: 32px;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }
        .header p {
            font-size: 13px;
            opacity: 0.9;
        }
        .screen {
            padding: 30px 24px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
            font-weight: 500;
            font-size: 13px;
        }
        input, select {
            width: 100%;
            padding: 14px 16px;
            background: #2a2a3a;
            border: 1px solid #3a3a4a;
            border-radius: 16px;
            color: white;
            font-size: 16px;
            transition: 0.2s;
        }
        input:focus, select:focus {
            border-color: #ff9800;
            outline: none;
            background: #2f2f41;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff9800, #ff5722);
            border: none;
            border-radius: 16px;
            font-weight: bold;
            font-size: 16px;
            color: white;
            cursor: pointer;
            margin-top: 12px;
            transition: 0.2s;
        }
        button:active { transform: scale(0.98); }
        button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .secondary-btn {
            background: transparent;
            border: 1px solid #ff9800;
            color: #ff9800;
        }
        .error-msg {
            color: #ff6b6b;
            font-size: 12px;
            margin-top: 10px;
            text-align: center;
            padding: 8px;
            border-radius: 10px;
            background: rgba(255,107,107,0.1);
        }
        .success-msg {
            color: #8bc34a;
            font-size: 12px;
            margin-top: 10px;
            text-align: center;
            padding: 8px;
            border-radius: 10px;
            background: rgba(139,195,74,0.1);
        }
        .info-box {
            background: rgba(33,150,243,0.1);
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 20px;
            border-left: 4px solid #2196f3;
        }
        .info-box p {
            color: #90caf9;
            font-size: 12px;
        }
        .country-selector {
            display: flex;
            gap: 10px;
        }
        .country-selector select { width: 35%; }
        .country-selector input { width: 65%; }
        .loading {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .pin-dots {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 20px 0;
        }
        .pin-dot {
            width: 50px;
            height: 50px;
            background: #2a2a3a;
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: white;
            border-bottom: 3px solid #ff9800;
        }
        footer {
            text-align: center;
            padding: 20px;
            background: rgba(0,0,0,0.3);
            color: #666;
            font-size: 11px;
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <h1>WIN777</h1>
        <p>Secure Authentication System</p>
    </div>
    <div id="dynamicScreen"></div>
    <footer>Protected by advanced security</footer>
</div>

<script>
    // Firebase Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyBeGpb7V0i5GN1opY9JECHxQIGvHFDPX38",
        authDomain: "win777-ed482.firebaseapp.com",
        projectId: "win777-ed482",
        storageBucket: "win777-ed482.firebasestorage.app",
        messagingSenderId: "843686112399",
        appId: "1:843686112399:web:9c20a96831e6a94cd814fa",
        measurementId: "G-YG8V7EJ0PL"
    };
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    
    // App State
    let confirmationResult = null;
    let currentPhone = null;
    let countdown = 0;
    let timerInterval = null;
    let appState = 'login';
    let recaptchaVerifier = null;
    let retryCount = 0;
    let lastPhoneRequest = null;
    
    const dynamicScreen = document.getElementById('dynamicScreen');
    
    // Initialize reCAPTCHA once - crucial fix
    function initRecaptcha() {
        if (!recaptchaVerifier && document.getElementById('recaptcha-container')) {
            try {
                recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
                    size: 'invisible',
                    'callback': () => {}
                });
            } catch (e) {
                console.log('reCAPTCHA already exists');
            }
        }
        return recaptchaVerifier;
    }
    
    function renderScreen() {
        if (appState === 'login') renderLogin();
        else if (appState === 'otp-verify') renderOtp();
        else if (appState === 'register-pin') renderRegister();
        else if (appState === 'pin-login') renderPinLogin();
        else if (appState === 'dashboard') renderDashboard();
    }
    
    function showMessage(msg, isError = true) {
        const msgDiv = document.querySelector('#dynamicScreen .error-msg, #dynamicScreen .success-msg');
        if (msgDiv) {
            msgDiv.innerText = msg;
            msgDiv.className = isError ? 'error-msg' : 'success-msg';
            setTimeout(() => {
                if (msgDiv.innerText === msg) msgDiv.innerText = '';
            }, 5000);
        }
    }
    
    // Send OTP with retry logic and rate limiting protection
    async function sendOTP(phoneNumber) {
        if (!phoneNumber || phoneNumber.length < 10) {
            showMessage('📱 Please enter a valid 10-digit mobile number');
            return false;
        }
        
        // Rate limiting - prevent too many requests
        const now = Date.now();
        if (lastPhoneRequest && (now - lastPhoneRequest) < 30000) {
            showMessage('⏱️ Please wait 30 seconds before trying again');
            return false;
        }
        lastPhoneRequest = now;
        
        const fullPhone = phoneNumber.startsWith('+') ? phoneNumber : '+91' + phoneNumber;
        currentPhone = fullPhone;
        
        const btn = document.getElementById('sendOtpBtn');
        const originalText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span class="loading"></span> Sending OTP...';
        
        try {
            const verifier = initRecaptcha();
            if (!verifier) {
                setTimeout(() => initRecaptcha(), 100);
            }
            
            const confirmation = await auth.signInWithPhoneNumber(fullPhone, verifier);
            confirmationResult = confirmation;
            appState = 'otp-verify';
            startTimer(60);
            renderScreen();
            showMessage('✅ OTP sent successfully! Check your phone', false);
            retryCount = 0;
            return true;
        } catch (error) {
            console.error('OTP Error:', error);
            
            let userFriendlyMessage = '';
            
            switch(error.code) {
                case 'auth/too-many-requests':
                    userFriendlyMessage = '⚠️ Too many attempts. Please wait 1 hour before trying again.';
                    break;
                case 'auth/invalid-phone-number':
                    userFriendlyMessage = '❌ Invalid phone number. Please check and try again.';
                    break;
                case 'auth/quota-exceeded':
                    userFriendlyMessage = '📞 Daily SMS limit reached. Please try again tomorrow.';
                    break;
                case 'auth/billing-not-enabled':
                    userFriendlyMessage = '💳 Billing setup in progress. Please wait 5 minutes and refresh.';
                    break;
                default:
                    userFriendlyMessage = `❌ ${error.message}`;
            }
            
            showMessage(userFriendlyMessage);
            retryCount++;
            
            if (retryCount >= 3) {
                showMessage('⚠️ Multiple failed attempts. Please wait 10 minutes before trying again.');
            }
            
            btn.disabled = false;
            btn.innerHTML = originalText;
            return false;
        }
    }
    
    async function verifyOTP(otpCode) {
        if (!confirmationResult) {
            showMessage('Session expired. Please request OTP again.');
            appState = 'login';
            renderScreen();
            return;
        }
        
        if (!otpCode || otpCode.length !== 6) {
            showMessage('Please enter the 6-digit OTP');
            return;
        }
        
        const btn = document.getElementById('verifyOtpBtn');
        const originalText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span class="loading"></span> Verifying...';
        
        try {
            const result = await confirmationResult.confirm(otpCode);
            const user = result.user;
            const userDoc = await db.collection('users').doc(user.uid).get();
            
            if (userDoc.exists && userDoc.data().pin) {
                // Existing user - store session and go to dashboard
                localStorage.setItem('win777_user', JSON.stringify({
                    uid: user.uid,
                    name: userDoc.data().name,
                    role: userDoc.data().role
                }));
                window.location.href = 'dashboard.html';
            } else {
                // New user - set up PIN
                appState = 'register-pin';
                renderScreen();
            }
        } catch (error) {
            showMessage('❌ Invalid OTP. Please try again.');
        } finally {
            btn.disabled = false;
            btn.innerHTML = originalText;
        }
    }
    
    async function resendOTP() {
        if (countdown > 0) {
            showMessage(`Please wait ${countdown} seconds before resending`);
            return;
        }
        
        const btn = document.getElementById('resendOtpBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="loading"></span> Resending...';
        
        try {
            const verifier = initRecaptcha();
            const confirmation = await auth.signInWithPhoneNumber(currentPhone, verifier);
            confirmationResult = confirmation;
            startTimer(60);
            showMessage('✅ OTP resent successfully!', false);
            renderScreen();
        } catch (error) {
            showMessage('Failed to resend OTP. Please try again.');
        } finally {
            btn.disabled = false;
        }
    }
    
    async function registerUser(name, pin, confirmPin) {
        if (!name || name.trim().length < 2) {
            showMessage('Please enter your full name');
            return;
        }
        if (!/^\d{4}$/.test(pin)) {
            showMessage('PIN must be exactly 4 digits (0-9)');
            return;
        }
        if (pin !== confirmPin) {
            showMessage('PINs do not match');
            return;
        }
        
        const user = auth.currentUser;
        if (!user) {
            showMessage('Session expired. Please login again.');
            appState = 'login';
            renderScreen();
            return;
        }
        
        const btn = document.getElementById('registerBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="loading"></span> Creating Account...';
        
        try {
            await db.collection('users').doc(user.uid).set({
                uid: user.uid,
                phone: user.phoneNumber,
                name: name.trim(),
                pin: pin,
                role: 'user',
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            
            localStorage.setItem('win777_user', JSON.stringify({
                uid: user.uid,
                name: name.trim(),
                role: 'user'
            }));
            
            showMessage('✅ Account created successfully! Redirecting...', false);
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 1500);
        } catch (error) {
            showMessage('Error: ' + error.message);
        } finally {
            btn.disabled = false;
            btn.innerHTML = 'Create Account';
        }
    }
    
    async function verifyPinLogin(pin) {
        const user = auth.currentUser;
        if (!user) {
            appState = 'login';
            renderScreen();
            return;
        }
        
        try {
            const userDoc = await db.collection('users').doc(user.uid).get();
            if (userDoc.exists && userDoc.data().pin === pin) {
                localStorage.setItem('win777_user', JSON.stringify({
                    uid: user.uid,
                    name: userDoc.data().name,
                    role: userDoc.data().role
                }));
                
                if (userDoc.data().role === 'admin') {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'dashboard.html';
                }
            } else {
                showMessage('❌ Incorrect PIN. Please try again.');
            }
        } catch (error) {
            showMessage('Error verifying PIN. Please try again.');
        }
    }
    
    async function logout() {
        await auth.signOut();
        localStorage.removeItem('win777_user');
        appState = 'login';
        renderScreen();
    }
    
    function startTimer(seconds) {
        countdown = seconds;
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (countdown <= 1) {
                clearInterval(timerInterval);
                timerInterval = null;
                renderScreen();
            } else {
                countdown--;
                const timerSpan = document.getElementById('resendTimer');
                if (timerSpan) timerSpan.innerText = `${countdown}s`;
            }
        }, 1000);
    }
    
    // UI Rendering Functions
    function renderLogin() {
        dynamicScreen.innerHTML = `
            <div class="screen">
                <div id="recaptcha-container"></div>
                <div class="info-box">
                    <p>🔐 Secure OTP verification. Real SMS will be sent to your phone.</p>
                </div>
                <div class="input-group">
                    <label>📱 Mobile Number</label>
                    <div class="country-selector">
                        <select id="countryCode">
                            <option value="+91">🇮🇳 +91</option>
                            <option value="+1">🇺🇸 +1</option>
                            <option value="+44">🇬🇧 +44</option>
                            <option value="+61">🇦🇺 +61</option>
                            <option value="+971">🇦🇪 +971</option>
                        </select>
                        <input type="tel" id="phoneNumber" placeholder="9876543210" maxlength="10" inputmode="numeric">
                    </div>
                </div>
                <button id="sendOtpBtn">📨 Send OTP</button>
                <div class="error-msg"></div>
            </div>
        `;
        
        document.getElementById('sendOtpBtn').addEventListener('click', () => {
            const code = document.getElementById('countryCode').value;
            const phone = document.getElementById('phoneNumber').value.replace(/\D/g, '');
            sendOTP(code + phone);
        });
        
        setTimeout(() => initRecaptcha(), 100);
    }
    
    function renderOtp() {
        dynamicScreen.innerHTML = `
            <div class="screen">
                <div id="recaptcha-container"></div>
                <div class="info-box">
                    <p>📨 OTP sent to ${currentPhone}</p>
                    <p style="font-size:11px; margin-top:5px;">Enter the 6-digit code received via SMS</p>
                </div>
                <div class="input-group">
                    <label>🔐 Enter OTP</label>
                    <input type="text" id="otpInput" placeholder="123456" maxlength="6" autocomplete="off" inputmode="numeric">
                </div>
                <button id="verifyOtpBtn">✓ Verify & Continue</button>
                <button id="resendOtpBtn" class="secondary-btn">${countdown > 0 ? `⏱️ Resend in <span id="resendTimer">${countdown}s</span>` : '⟳ Resend OTP'}</button>
                <button id="backBtn" class="secondary-btn">← Change Number</button>
                <div class="error-msg"></div>
            </div>
        `;
        
        document.getElementById('verifyOtpBtn').addEventListener('click', () => {
            verifyOTP(document.getElementById('otpInput').value);
        });
        document.getElementById('resendOtpBtn').addEventListener('click', () => resendOTP());
        document.getElementById('backBtn').addEventListener('click', () => {
            appState = 'login';
            renderScreen();
        });
    }
    
    function renderRegister() {
        dynamicScreen.innerHTML = `
            <div class="screen">
                <h3 style="margin-bottom: 20px; color: #ff9800;">✨ Complete Profile</h3>
                <div class="input-group">
                    <label>👤 Full Name</label>
                    <input type="text" id="fullName" placeholder="John Doe" autocomplete="off">
                </div>
                <div class="input-group">
                    <label>🔐 Create 4-Digit PIN</label>
                    <input type="password" id="pin" maxlength="4" placeholder="****" inputmode="numeric">
                </div>
                <div class="input-group">
                    <label>✓ Confirm PIN</label>
                    <input type="password" id="confirmPin" maxlength="4" placeholder="****" inputmode="numeric">
                </div>
                <button id="registerBtn">🚀 Create Account</button>
                <div class="error-msg"></div>
            </div>
        `;
        
        document.getElementById('registerBtn').addEventListener('click', () => {
            const name = document.getElementById('fullName').value;
            const pin = document.getElementById('pin').value;
            const confirm = document.getElementById('confirmPin').value;
            registerUser(name, pin, confirm);
        });
    }
    
    function renderPinLogin() {
        dynamicScreen.innerHTML = `
            <div class="screen">
                <h3 style="margin-bottom: 20px; color: #ff9800;">🔐 Enter PIN</h3>
                <div class="info-box">
                    <p>Welcome back! Enter your 4-digit PIN to login</p>
                </div>
                <div class="input-group">
                    <label>4-Digit PIN</label>
                    <input type="password" id="pinInput" maxlength="4" placeholder="****" inputmode="numeric">
                </div>
                <button id="pinLoginBtn">🔓 Unlock Dashboard</button>
                <button id="logoutPinBtn" class="secondary-btn">Use different account</button>
                <div class="error-msg"></div>
            </div>
        `;
        
        document.getElementById('pinLoginBtn').addEventListener('click', () => {
            verifyPinLogin(document.getElementById('pinInput').value);
        });
        document.getElementById('logoutPinBtn').addEventListener('click', async () => {
            await auth.signOut();
            appState = 'login';
            renderScreen();
        });
    }
    
    function renderDashboard() {
        const userData = JSON.parse(localStorage.getItem('win777_user') || '{}');
        dynamicScreen.innerHTML = `
            <div class="screen">
                <div class="info-box">
                    <p>👋 Welcome back, ${userData.name || 'User'}!</p>
                </div>
                <button id="logoutBtn">🚪 Logout</button>
                <div class="error-msg"></div>
            </div>
        `;
        
        document.getElementById('logoutBtn').addEventListener('click', logout);
    }
    
    // Check existing session on load
    auth.onAuthStateChanged(async (user) => {
        if (user && !window.location.pathname.includes('dashboard.html')) {
            const userDoc = await db.collection('users').doc(user.uid).get();
            if (userDoc.exists && userDoc.data().pin) {
                if (userDoc.data().role === 'admin') {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'dashboard.html';
                }
            } else if (userDoc.exists && !userDoc.data().pin) {
                appState = 'register-pin';
                renderScreen();
            }
        } else if (!user) {
            renderScreen();
        }
    });
    
    renderScreen();
</script>
</body>
</html>
