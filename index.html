<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WIN777 - Login</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body {
            background: linear-gradient(135deg, #1a0a00, #331a00);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }
        
        .falling-numbers {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        
        .number {
            position: absolute;
            color: rgba(255, 152, 0, 0.15);
            font-size: 24px;
            font-weight: bold;
            font-family: monospace;
            animation: fall linear infinite;
            user-select: none;
        }
        
        @keyframes fall {
            0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
        
        .number:nth-child(1) { left: 5%; animation-duration: 8s; animation-delay: 0s; font-size: 30px; }
        .number:nth-child(2) { left: 15%; animation-duration: 11s; animation-delay: 2s; font-size: 20px; }
        .number:nth-child(3) { left: 25%; animation-duration: 7s; animation-delay: 1s; font-size: 35px; }
        .number:nth-child(4) { left: 35%; animation-duration: 13s; animation-delay: 3s; font-size: 18px; }
        .number:nth-child(5) { left: 45%; animation-duration: 9s; animation-delay: 0.5s; font-size: 28px; }
        .number:nth-child(6) { left: 55%; animation-duration: 12s; animation-delay: 4s; font-size: 22px; }
        .number:nth-child(7) { left: 65%; animation-duration: 6s; animation-delay: 1.5s; font-size: 32px; }
        .number:nth-child(8) { left: 75%; animation-duration: 10s; animation-delay: 2.5s; font-size: 25px; }
        .number:nth-child(9) { left: 85%; animation-duration: 14s; animation-delay: 3.5s; font-size: 19px; }
        .number:nth-child(10) { left: 95%; animation-duration: 8s; animation-delay: 0.8s; font-size: 27px; }
        .number:nth-child(11) { left: 10%; animation-duration: 9s; animation-delay: 5s; font-size: 33px; }
        .number:nth-child(12) { left: 20%; animation-duration: 7s; animation-delay: 4.2s; font-size: 21px; }
        .number:nth-child(13) { left: 30%; animation-duration: 11s; animation-delay: 1.8s; font-size: 29px; }
        .number:nth-child(14) { left: 40%; animation-duration: 8s; animation-delay: 2.2s; font-size: 26px; }
        .number:nth-child(15) { left: 50%; animation-duration: 10s; animation-delay: 3.2s; font-size: 31px; }
        .number:nth-child(16) { left: 60%; animation-duration: 12s; animation-delay: 0.3s; font-size: 23px; }
        .number:nth-child(17) { left: 70%; animation-duration: 7s; animation-delay: 4.5s; font-size: 34px; }
        .number:nth-child(18) { left: 80%; animation-duration: 9s; animation-delay: 1.2s; font-size: 24px; }
        .number:nth-child(19) { left: 90%; animation-duration: 11s; animation-delay: 2.8s; font-size: 28px; }
        .number:nth-child(20) { left: 100%; animation-duration: 8s; animation-delay: 3.8s; font-size: 20px; }
        
        .app-container {
            max-width: 420px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            min-height: 100vh;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            border-radius: 0;
            box-shadow: 0 0 50px rgba(0,0,0,0.3);
        }
        
        .header {
            background: linear-gradient(135deg, #ff9800, #e68a00);
            padding: 30px 20px;
            text-align: center;
            border-bottom: 1px solid #ffe0b3;
        }
        
        .logo-img {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            margin-bottom: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .logo-text {
            font-size: 32px;
            font-weight: bold;
            color: #fff;
            letter-spacing: 3px;
        }
        
        .tagline {
            font-size: 11px;
            color: #fff;
            margin-top: 8px;
            opacity: 0.9;
        }
        
        .screen { padding: 30px 25px; }
        
        .input-field {
            background: #f8f9fa;
            border: 1px solid #ffe0b3;
            border-radius: 12px;
            padding: 15px;
            width: 100%;
            color: #333;
            font-size: 16px;
            margin-bottom: 20px;
            outline: none;
            transition: all 0.3s;
        }
        
        .input-field:focus {
            border-color: #ff9800;
            box-shadow: 0 0 0 2px rgba(255,152,0,0.2);
        }
        
        .pin-input {
            font-size: 24px;
            text-align: center;
            letter-spacing: 8px;
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff9800, #e68a00);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255,152,0,0.4);
        }
        
        .link {
            text-align: center;
            margin-top: 15px;
            color: #ff9800;
            font-size: 13px;
            cursor: pointer;
        }
        
        .timer {
            color: #ff9800;
            font-size: 20px;
            font-weight: bold;
            margin: 20px 0;
            text-align: center;
        }
        
        .welcome-text {
            color: #ff9800;
            font-size: 14px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .error-text {
            color: #dc3545;
            font-size: 12px;
            text-align: center;
            margin-top: 10px;
        }
        
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="falling-numbers">
        <div class="number">1</div><div class="number">2</div><div class="number">3</div><div class="number">4</div><div class="number">5</div>
        <div class="number">6</div><div class="number">7</div><div class="number">8</div><div class="number">9</div><div class="number">0</div>
        <div class="number">1</div><div class="number">2</div><div class="number">3</div><div class="number">4</div><div class="number">5</div>
        <div class="number">6</div><div class="number">7</div><div class="number">8</div><div class="number">9</div><div class="number">0</div>
    </div>

    <div class="app-container">
        <div class="header">
            <img src="https://i.imgur.com/V4pMmxP.jpeg" alt="WIN777" class="logo-img">
            <div class="logo-text">WIN777</div>
            <div class="tagline">India's best Satta Matka Application</div>
        </div>

        <div id="phoneScreen" class="screen">
            <input type="tel" id="phoneNumber" class="input-field" placeholder="Enter Mobile Number">
            <button class="btn" id="sendOtpBtn">Login with OTP</button>
            <div class="link" id="showPinBtn">Login with MPIN</div>
            <div class="link" id="forgotPinLink">Forgot MPIN?</div>
            <div id="phoneError" class="error-text"></div>
        </div>

        <div id="otpScreen" class="screen hidden">
            <div class="welcome-text">Enter OTP sent to your mobile</div>
            <div class="timer" id="timer">Second Remaining 60</div>
            <input type="text" id="otpCode" class="input-field" placeholder="Enter OTP" maxlength="6">
            <button class="btn" id="verifyOtpBtn">VERIFY OTP</button>
            <div class="link" id="resendOtpBtn">Resend OTP</div>
            <div id="otpError" class="error-text"></div>
        </div>

        <div id="pinScreen" class="screen hidden">
            <input type="password" id="pinInput" class="input-field pin-input" placeholder="●●●●" maxlength="4">
            <button class="btn" id="verifyPinBtn">Login with MPIN</button>
            <div id="pinError" class="error-text"></div>
        </div>

        <div id="registerScreen" class="screen hidden">
            <input type="text" id="regName" class="input-field" placeholder="Full Name">
            <input type="password" id="regPin" class="input-field" placeholder="Create MPIN" maxlength="4">
            <input type="password" id="regConfirmPin" class="input-field" placeholder="Confirm MPIN" maxlength="4">
            <button class="btn" id="registerBtn">Register</button>
            <div id="regError" class="error-text"></div>
        </div>

        <!-- Forgot PIN Reset Screen -->
        <div id="resetPinScreen" class="screen hidden">
            <div class="welcome-text">Reset MPIN</div>
            <input type="tel" id="resetPhone" class="input-field" placeholder="Enter Mobile Number">
            <button class="btn" id="sendResetOtpBtn">Send OTP</button>
            <div id="resetError" class="error-text"></div>
        </div>

        <div id="resetOtpScreen" class="screen hidden">
            <div class="welcome-text">Enter OTP to reset MPIN</div>
            <div class="timer" id="resetTimer">Second Remaining 60</div>
            <input type="text" id="resetOtpCode" class="input-field" placeholder="Enter OTP" maxlength="6">
            <input type="password" id="newPinReset" class="input-field" placeholder="New MPIN (4 digits)" maxlength="4">
            <input type="password" id="confirmPinReset" class="input-field" placeholder="Confirm MPIN" maxlength="4">
            <button class="btn" id="resetPinBtn">Reset MPIN</button>
            <div class="link" id="backToLogin">Back to Login</div>
            <div id="resetOtpError" class="error-text"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBeGpb7V0i5GN1opY9JECHxQIGvHFDPX38",
            authDomain: "win777-ed482.firebaseapp.com",
            projectId: "win777-ed482",
            storageBucket: "win777-ed482.firebasestorage.app",
            messagingSenderId: "843686112399",
            appId: "1:843686112399:web:9c20a96831e6a94cd814fa"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
        
        let confirmationResult = null, currentPhone = null, countdown = 0, timerInterval = null, recaptchaVerifier = null;
        let resetConfirmationResult = null, resetPhoneNumber = null;
        
        function showScreen(screen) {
            document.getElementById('phoneScreen').classList.add('hidden');
            document.getElementById('otpScreen').classList.add('hidden');
            document.getElementById('pinScreen').classList.add('hidden');
            document.getElementById('registerScreen').classList.add('hidden');
            document.getElementById('resetPinScreen').classList.add('hidden');
            document.getElementById('resetOtpScreen').classList.add('hidden');
            screen.classList.remove('hidden');
        }
        
        function showError(elementId, message) { const el = document.getElementById(elementId); if (el) { el.innerText = message; setTimeout(() => el.innerText = '', 4000); } }
        
        function initRecaptcha() { if (!recaptchaVerifier) { const container = document.createElement('div'); container.id = 'recaptcha-container'; container.style.position = 'absolute'; container.style.left = '-9999px'; document.body.appendChild(container); recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { size: 'invisible' }); } return recaptchaVerifier; }
        
        function startTimer(seconds, timerElementId) { 
            countdown = seconds; 
            if (timerInterval) clearInterval(timerInterval); 
            timerInterval = setInterval(() => { 
                if (countdown <= 1) clearInterval(timerInterval); 
                const timerEl = document.getElementById(timerElementId); 
                if (timerEl && countdown > 0) timerEl.innerText = `Second Remaining ${countdown}`; 
                countdown--; 
            }, 1000); 
        }
        
        // Normal Login OTP
        document.getElementById('sendOtpBtn').onclick = function() {
            const phone = document.getElementById('phoneNumber').value.replace(/\D/g, '');
            if (!phone || phone.length < 10) { showError('phoneError', 'Enter valid 10-digit number'); return; }
            currentPhone = '+91' + phone;
            const btn = this; btn.disabled = true; btn.innerText = 'Sending...';
            const verifier = initRecaptcha();
            auth.signInWithPhoneNumber(currentPhone, verifier).then(confirmation => { 
                confirmationResult = confirmation; 
                showScreen(otpScreen); 
                startTimer(60, 'timer'); 
                btn.disabled = false; 
                btn.innerText = 'Login with OTP'; 
            }).catch(error => { 
                showError('phoneError', error.message); 
                btn.disabled = false; 
                btn.innerText = 'Login with OTP'; 
            });
        };
        
        document.getElementById('verifyOtpBtn').onclick = function() {
            const code = document.getElementById('otpCode').value;
            if (!code || code.length !== 6) { showError('otpError', 'Enter 6-digit OTP'); return; }
            const btn = this; btn.disabled = true; btn.innerText = 'Verifying...';
            confirmationResult.confirm(code).then(result => { 
                const user = result.user; 
                db.collection('users').doc(user.uid).get().then(doc => { 
                    if (doc.exists && doc.data().pin) showScreen(pinScreen); 
                    else showScreen(registerScreen); 
                    btn.disabled = false; 
                    btn.innerText = 'VERIFY OTP'; 
                }).catch(() => { 
                    showScreen(registerScreen); 
                    btn.disabled = false; 
                    btn.innerText = 'VERIFY OTP'; 
                }); 
            }).catch(error => { 
                showError('otpError', 'Invalid OTP'); 
                btn.disabled = false; 
                btn.innerText = 'VERIFY OTP'; 
            });
        };
        
        document.getElementById('resendOtpBtn').onclick = function() { 
            if (!currentPhone) return; 
            const verifier = initRecaptcha(); 
            auth.signInWithPhoneNumber(currentPhone, verifier).then(confirmation => { 
                confirmationResult = confirmation; 
                startTimer(60, 'timer'); 
                showError('otpError', 'OTP resent!'); 
            }).catch(error => showError('otpError', error.message)); 
        };
        
        // Forgot PIN Flow
        document.getElementById('forgotPinLink').onclick = function() {
            showScreen(resetPinScreen);
        };
        
        document.getElementById('sendResetOtpBtn').onclick = function() {
            const phone = document.getElementById('resetPhone').value.replace(/\D/g, '');
            if (!phone || phone.length < 10) { showError('resetError', 'Enter valid 10-digit number'); return; }
            resetPhoneNumber = '+91' + phone;
            
            // Check if user exists
            db.collection('users').where('phone', '==', resetPhoneNumber).get().then((snapshot) => {
                if (snapshot.empty) {
                    showError('resetError', 'No account found with this number');
                    return;
                }
                const btn = this; btn.disabled = true; btn.innerText = 'Sending...';
                const verifier = initRecaptcha();
                auth.signInWithPhoneNumber(resetPhoneNumber, verifier).then(confirmation => {
                    resetConfirmationResult = confirmation;
                    showScreen(resetOtpScreen);
                    startTimer(60, 'resetTimer');
                    btn.disabled = false;
                    btn.innerText = 'Send OTP';
                }).catch(error => {
                    showError('resetError', error.message);
                    btn.disabled = false;
                    btn.innerText = 'Send OTP';
                });
            }).catch(() => {
                showError('resetError', 'Error checking user');
            });
        };
        
        document.getElementById('resetPinBtn').onclick = function() {
            const otp = document.getElementById('resetOtpCode').value;
            const newPin = document.getElementById('newPinReset').value;
            const confirmPin = document.getElementById('confirmPinReset').value;
            
            if (!otp || otp.length !== 6) { showError('resetOtpError', 'Enter 6-digit OTP'); return; }
            if (!newPin || newPin.length !== 4) { showError('resetOtpError', 'MPIN must be 4 digits'); return; }
            if (newPin !== confirmPin) { showError('resetOtpError', 'MPINs do not match'); return; }
            
            const btn = this; btn.disabled = true; btn.innerText = 'Verifying...';
            
            resetConfirmationResult.confirm(otp).then((result) => {
                const user = result.user;
                db.collection('users').doc(user.uid).update({ pin: newPin }).then(() => {
                    alert('✅ MPIN reset successfully! Please login with new MPIN.');
                    showScreen(phoneScreen);
                    document.getElementById('resetPhone').value = '';
                    document.getElementById('resetOtpCode').value = '';
                    document.getElementById('newPinReset').value = '';
                    document.getElementById('confirmPinReset').value = '';
                    btn.disabled = false;
                    btn.innerText = 'Reset MPIN';
                }).catch((err) => {
                    showError('resetOtpError', 'Error updating PIN');
                    btn.disabled = false;
                    btn.innerText = 'Reset MPIN';
                });
            }).catch((error) => {
                showError('resetOtpError', 'Invalid OTP');
                btn.disabled = false;
                btn.innerText = 'Reset MPIN';
            });
        };
        
        document.getElementById('backToLogin').onclick = function() {
            showScreen(phoneScreen);
            document.getElementById('resetPhone').value = '';
            document.getElementById('resetOtpCode').value = '';
            document.getElementById('newPinReset').value = '';
            document.getElementById('confirmPinReset').value = '';
        };
        
        document.getElementById('registerBtn').onclick = function() {
            const name = document.getElementById('regName').value.trim(), pin = document.getElementById('regPin').value, confirmPin = document.getElementById('regConfirmPin').value;
            if (!name) { showError('regError', 'Enter your name'); return; } 
            if (!pin || pin.length !== 4) { showError('regError', 'MPIN must be 4 digits'); return; } 
            if (pin !== confirmPin) { showError('regError', 'MPINs do not match'); return; }
            const user = auth.currentUser; if (!user) { showError('regError', 'Session expired'); return; }
            const btn = this; btn.disabled = true; btn.innerText = 'Creating...';
            db.collection('users').doc(user.uid).set({ uid: user.uid, phone: user.phoneNumber, name: name, pin: pin, balance: 0, role: 'user', createdAt: new Date() }).then(() => { window.location.href = 'dashboard.html'; }).catch(error => { showError('regError', error.message); btn.disabled = false; btn.innerText = 'Register'; });
        };
        
        document.getElementById('verifyPinBtn').onclick = function() {
            const pin = document.getElementById('pinInput').value;
            if (!pin || pin.length !== 4) { showError('pinError', 'Enter 4-digit MPIN'); return; }
            const user = auth.currentUser; if (!user) { showScreen(phoneScreen); return; }
            const btn = this; btn.disabled = true; btn.innerText = 'Verifying...';
            db.collection('users').doc(user.uid).get().then(doc => { if (doc.exists && doc.data().pin === pin) window.location.href = 'dashboard.html'; else showError('pinError', 'Invalid MPIN'); btn.disabled = false; btn.innerText = 'Login with MPIN'; }).catch(error => { showError('pinError', 'Error verifying PIN'); btn.disabled = false; btn.innerText = 'Login with MPIN'; });
        };
        
        document.getElementById('showPinBtn').onclick = function() {
            const user = auth.currentUser; if (!user) { showScreen(phoneScreen); return; }
            db.collection('users').doc(user.uid).get().then(doc => { if (doc.exists && doc.data().pin) showScreen(pinScreen); else showScreen(phoneScreen); }).catch(() => showScreen(phoneScreen));
        };
        
        auth.onAuthStateChanged(user => { if (user) { db.collection('users').doc(user.uid).get().then(doc => { if (doc.exists && doc.data().pin) showScreen(pinScreen); else if (doc.exists && !doc.data().pin) showScreen(registerScreen); else showScreen(phoneScreen); }).catch(() => showScreen(phoneScreen)); } else showScreen(phoneScreen); });
    </script>
</body>
</html>
