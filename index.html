<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WIN77 - Login</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: #0a0a0f; min-height: 100vh; }
        .app-container { max-width: 450px; margin: 0 auto; background: #0a0a0f; min-height: 100vh; }
        .header { padding: 30px 20px 20px; text-align: center; }
        .logo { font-size: 32px; font-weight: bold; color: #ff9800; letter-spacing: 2px; }
        .tagline { font-size: 11px; color: #888; margin-top: 5px; }
        .screen { padding: 20px; }
        .mpin-input, .phone-input, .otp-input, .register-input {
            background: #1a1a2e;
            border: 1px solid #ff9800;
            border-radius: 12px;
            padding: 15px;
            width: 100%;
            color: white;
            font-size: 16px;
            margin-bottom: 20px;
        }
        .mpin-input { font-size: 24px; text-align: center; letter-spacing: 8px; }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: #ff9800;
            border: none;
            border-radius: 12px;
            color: black;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        .forgot-link { text-align: center; margin-top: 15px; color: #ff9800; font-size: 13px; cursor: pointer; }
        .otp-welcome { color: #ff9800; font-size: 14px; margin-bottom: 20px; text-align: center; }
        .timer { color: #ff9800; font-size: 24px; font-weight: bold; margin: 20px 0; text-align: center; }
        .error-text { color: #f44336; font-size: 12px; text-align: center; margin-top: 10px; }
        .hidden { display: none; }
        .notification-popup {
            position: fixed; bottom: 0; left: 0; right: 0; background: #1a1a2e;
            border-radius: 20px 20px 0 0; padding: 25px; z-index: 1000;
            border-top: 1px solid #ff9800; transform: translateY(100%); transition: transform 0.3s ease;
        }
        .notification-popup.show { transform: translateY(0); }
        .notification-title { color: white; font-size: 18px; margin-bottom: 10px; }
        .notification-text { color: #aaa; font-size: 13px; margin-bottom: 20px; }
        .notification-buttons { display: flex; gap: 15px; }
        .notify-allow { flex: 1; padding: 12px; background: #ff9800; border: none; border-radius: 12px; color: black; font-weight: bold; cursor: pointer; }
        .notify-deny { flex: 1; padding: 12px; background: transparent; border: 1px solid #ff9800; border-radius: 12px; color: #ff9800; cursor: pointer; }
        .overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 999; display: none; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <div class="logo">WIN77</div>
        <div class="tagline">India's best Satta Matka Application</div>
    </div>

    <div id="overlay" class="overlay"></div>
    <div id="notificationPopup" class="notification-popup">
        <div class="notification-title">🔔 Allow Notifications</div>
        <div class="notification-text">Stay updated with your bets, results, and offers. Get instant alerts!</div>
        <div class="notification-buttons">
            <button class="notify-deny" onclick="denyNotification()">Don't Allow</button>
            <button class="notify-allow" onclick="allowNotification()">Allow</button>
        </div>
    </div>

    <!-- Phone Screen -->
    <div id="phoneScreen" class="screen">
        <input type="tel" id="phoneNumber" class="phone-input" placeholder="Enter Mobile Number">
        <button class="login-btn" id="sendOtpBtn">Login with OTP</button>
        <div class="forgot-link" id="showPinBtn">Login with MPIN</div>
        <div id="phoneError" class="error-text"></div>
    </div>

    <!-- OTP Screen -->
    <div id="otpScreen" class="screen hidden">
        <div class="otp-welcome">India's best Satta Matka Application Welcomes You !!!</div>
        <div class="timer" id="timer">Second Remaining 60</div>
        <input type="text" id="otpCode" class="otp-input" placeholder="Enter OTP" maxlength="6">
        <button class="login-btn" id="verifyOtpBtn">SUBMIT</button>
        <div class="forgot-link" id="resendOtpBtn">Resend OTP</div>
        <div id="otpError" class="error-text"></div>
    </div>

    <!-- PIN Screen -->
    <div id="pinScreen" class="screen hidden">
        <input type="password" id="pinInput" class="mpin-input" placeholder="●●●●" maxlength="4">
        <button class="login-btn" id="verifyPinBtn">Login with MPIN</button>
        <div class="forgot-link" id="forgotPinBtn">Forgot MPIN?</div>
        <div id="pinError" class="error-text"></div>
    </div>

    <!-- Register Screen -->
    <div id="registerScreen" class="screen hidden">
        <input type="text" id="regName" class="register-input" placeholder="Full Name">
        <input type="password" id="regPin" class="register-input" placeholder="Create MPIN" maxlength="4">
        <input type="password" id="regConfirmPin" class="register-input" placeholder="Confirm MPIN" maxlength="4">
        <button class="login-btn" id="registerBtn">Register</button>
        <div id="regError" class="error-text"></div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBeGpb7V0i5GN1opY9JECHxQIGvHFDPX38",
        authDomain: "win777-ed482.firebaseapp.com",
        projectId: "win777-ed482",
        storageBucket: "win777-ed482.firebasestorage.app",
        messagingSenderId: "843686112399",
        appId: "1:843686112399:web:9c20a96831e6a94cd814fa"
    };
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    
    let confirmationResult = null;
    let currentPhone = null;
    let countdown = 0;
    let timerInterval = null;
    let recaptchaVerifier = null;
    
    // DOM Elements
    const phoneScreen = document.getElementById('phoneScreen');
    const otpScreen = document.getElementById('otpScreen');
    const pinScreen = document.getElementById('pinScreen');
    const registerScreen = document.getElementById('registerScreen');
    
    function showScreen(screen) {
        phoneScreen.classList.add('hidden');
        otpScreen.classList.add('hidden');
        pinScreen.classList.add('hidden');
        registerScreen.classList.add('hidden');
        screen.classList.remove('hidden');
    }
    
    function initRecaptcha() {
        if (!recaptchaVerifier) {
            const container = document.createElement('div');
            container.id = 'recaptcha-container';
            container.style.position = 'absolute';
            container.style.left = '-9999px';
            document.body.appendChild(container);
            recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { size: 'invisible' });
            console.log('reCAPTCHA initialized');
        }
        return recaptchaVerifier;
    }
    
    function showError(elementId, message) {
        const el = document.getElementById(elementId);
        if (el) {
            el.innerText = message;
            setTimeout(() => el.innerText = '', 5000);
        }
    }
    
    function startTimer(seconds) {
        countdown = seconds;
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (countdown <= 1) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            const timerEl = document.getElementById('timer');
            if (timerEl && countdown > 0) timerEl.innerText = `Second Remaining ${countdown}`;
            countdown--;
        }, 1000);
    }
    
    // Notification
    function allowNotification() {
        document.getElementById('notificationPopup').classList.remove('show');
        document.getElementById('overlay').style.display = 'none';
        if (Notification.permission === 'default') Notification.requestPermission();
    }
    function denyNotification() {
        document.getElementById('notificationPopup').classList.remove('show');
        document.getElementById('overlay').style.display = 'none';
    }
    function showNotificationPopup() {
        document.getElementById('notificationPopup').classList.add('show');
        document.getElementById('overlay').style.display = 'block';
    }
    
    // Send OTP
    document.getElementById('sendOtpBtn').onclick = function() {
        const phone = document.getElementById('phoneNumber').value.replace(/\D/g, '');
        if (!phone || phone.length < 10) {
            showError('phoneError', 'Enter valid 10-digit mobile number');
            return;
        }
        currentPhone = '+91' + phone;
        const btn = this;
        btn.disabled = true;
        btn.innerText = 'Sending...';
        
        try {
            const verifier = initRecaptcha();
            auth.signInWithPhoneNumber(currentPhone, verifier)
                .then(confirmation => {
                    confirmationResult = confirmation;
                    showScreen(otpScreen);
                    startTimer(60);
                    btn.disabled = false;
                    btn.innerText = 'Login with OTP';
                    showError('otpError', 'OTP sent! Check your phone');
                })
                .catch(error => {
                    console.error('OTP Error:', error);
                    showError('phoneError', error.message);
                    btn.disabled = false;
                    btn.innerText = 'Login with OTP';
                });
        } catch(e) {
            console.error('Exception:', e);
            showError('phoneError', e.message);
            btn.disabled = false;
            btn.innerText = 'Login with OTP';
        }
    };
    
    // Verify OTP
    document.getElementById('verifyOtpBtn').onclick = function() {
        const code = document.getElementById('otpCode').value;
        if (!code || code.length !== 6) {
            showError('otpError', 'Enter 6-digit OTP');
            return;
        }
        const btn = this;
        btn.disabled = true;
        btn.innerText = 'Verifying...';
        
        confirmationResult.confirm(code)
            .then(result => {
                const user = result.user;
                db.collection('users').doc(user.uid).get()
                    .then(doc => {
                        if (doc.exists && doc.data().pin) {
                            window.location.href = 'dashboard.html';
                        } else {
                            showScreen(registerScreen);
                        }
                        btn.disabled = false;
                        btn.innerText = 'SUBMIT';
                    })
                    .catch(() => {
                        showScreen(registerScreen);
                        btn.disabled = false;
                        btn.innerText = 'SUBMIT';
                    });
            })
            .catch(error => {
                console.error('Verification Error:', error);
                showError('otpError', 'Invalid OTP. Try again.');
                btn.disabled = false;
                btn.innerText = 'SUBMIT';
            });
    };
    
    // Resend OTP
    document.getElementById('resendOtpBtn').onclick = function() {
        if (!currentPhone) {
            showError('otpError', 'Session expired. Please go back.');
            return;
        }
        const verifier = initRecaptcha();
        auth.signInWithPhoneNumber(currentPhone, verifier)
            .then(confirmation => {
                confirmationResult = confirmation;
                startTimer(60);
                showError('otpError', 'OTP resent!');
            })
            .catch(error => {
                showError('otpError', error.message);
            });
    };
    
    // Register User
    document.getElementById('registerBtn').onclick = function() {
        const name = document.getElementById('regName').value.trim();
        const pin = document.getElementById('regPin').value;
        const confirmPin = document.getElementById('regConfirmPin').value;
        
        if (!name) { showError('regError', 'Enter your name'); return; }
        if (!pin || pin.length !== 4) { showError('regError', 'MPIN must be 4 digits'); return; }
        if (pin !== confirmPin) { showError('regError', 'MPINs do not match'); return; }
        
        const user = auth.currentUser;
        if (!user) { showError('regError', 'Session expired'); return; }
        
        const btn = this;
        btn.disabled = true;
        btn.innerText = 'Creating...';
        
        db.collection('users').doc(user.uid).set({
            uid: user.uid,
            phone: user.phoneNumber,
            name: name,
            pin: pin,
            balance: 0,
            role: 'user',
            createdAt: new Date()
        }).then(() => {
            showNotificationPopup();
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 2000);
        }).catch(error => {
            showError('regError', error.message);
            btn.disabled = false;
            btn.innerText = 'Register';
        });
    };
    
    // Verify PIN
    document.getElementById('verifyPinBtn').onclick = function() {
        const pin = document.getElementById('pinInput').value;
        if (!pin || pin.length !== 4) {
            showError('pinError', 'Enter 4-digit MPIN');
            return;
        }
        
        const user = auth.currentUser;
        if (!user) {
            showScreen(phoneScreen);
            return;
        }
        
        const btn = this;
        btn.disabled = true;
        btn.innerText = 'Verifying...';
        
        db.collection('users').doc(user.uid).get()
            .then(doc => {
                if (doc.exists && doc.data().pin === pin) {
                    window.location.href = 'dashboard.html';
                } else {
                    showError('pinError', 'Invalid MPIN');
                    btn.disabled = false;
                    btn.innerText = 'Login with MPIN';
                }
            })
            .catch(error => {
                showError('pinError', 'Error verifying PIN');
                btn.disabled = false;
                btn.innerText = 'Login with MPIN';
            });
    };
    
    // Show PIN login
    document.getElementById('showPinBtn').onclick = function() {
        const user = auth.currentUser;
        if (!user) {
            showScreen(phoneScreen);
            return;
        }
        db.collection('users').doc(user.uid).get()
            .then(doc => {
                if (doc.exists && doc.data().pin) {
                    showScreen(pinScreen);
                    document.getElementById('pinInput').value = '';
                } else {
                    showScreen(phoneScreen);
                }
            })
            .catch(() => showScreen(phoneScreen));
    };
    
    // Forgot PIN - logout
    document.getElementById('forgotPinBtn').onclick = function() {
        auth.signOut().then(() => {
            showScreen(phoneScreen);
            document.getElementById('phoneNumber').value = '';
        }).catch(() => {
            showScreen(phoneScreen);
        });
    };
    
    // Check session on page load
    auth.onAuthStateChanged(user => {
        if (user) {
            db.collection('users').doc(user.uid).get()
                .then(doc => {
                    if (doc.exists && doc.data().pin) {
                        showScreen(pinScreen);
                        document.getElementById('pinInput').value = '';
                    } else if (doc.exists && !doc.data().pin) {
                        showScreen(registerScreen);
                    } else {
                        showScreen(phoneScreen);
                    }
                })
                .catch(() => showScreen(phoneScreen));
        } else {
            showScreen(phoneScreen);
        }
    });
</script>
</body>
</html>
