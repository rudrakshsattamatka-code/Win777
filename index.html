<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WIN777 - Login</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        /* Animated Background */
        .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; overflow: hidden; }
        .particle {
            position: absolute;
            background: rgba(255,152,0,0.15);
            border-radius: 50%;
            animation: float 15s infinite ease-in-out;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0.3; }
            25% { transform: translateY(-100px) translateX(50px); opacity: 0.6; }
            50% { transform: translateY(-200px) translateX(-50px); opacity: 0.3; }
            75% { transform: translateY(-100px) translateX(50px); opacity: 0.6; }
        }
        .glow-orb {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255,152,0,0.15), transparent);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: pulse 6s infinite;
            z-index: 0;
        }
        @keyframes pulse { 0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; } 50% { transform: translate(-50%, -50%) scale(1.5); opacity: 0.1; } }
        .login-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 40px 28px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,152,0,0.2);
            animation: slideUp 0.5s ease-out;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .logo-section { text-align: center; margin-bottom: 30px; }
        .logo-img { width: 120px; height: 120px; object-fit: contain; display: block; margin: 0 auto; filter: drop-shadow(0 8px 20px rgba(0,0,0,0.3)); }
        .trust-badge { text-align: center; margin-bottom: 30px; }
        .trust-main { font-size: 14px; font-weight: 600; color: #ff9800; letter-spacing: 0.5px; background: rgba(0,0,0,0.3); display: inline-block; padding: 6px 18px; border-radius: 40px; }
        .trust-features { display: flex; justify-content: center; gap: 12px; margin-top: 8px; font-size: 12px; color: #aaa; }
        .trust-features span { color: #4caf50; margin-right: 3px; }
        .input-section { margin-bottom: 20px; }
        .input-label { font-size: 14px; font-weight: 600; color: #ddd; margin-bottom: 8px; display: block; }
        .country-selector-box { display: flex; align-items: center; gap: 12px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,152,0,0.3); border-radius: 20px; padding: 4px; transition: all 0.3s ease; }
        .country-selector-box:focus-within { border-color: #ff9800; box-shadow: 0 0 0 3px rgba(255,152,0,0.1); }
        .country-code-select { width: 100px; padding: 15px 10px; background: #1a1a2e; border: none; border-radius: 16px; font-size: 15px; font-weight: 500; color: #ff9800; outline: none; cursor: pointer; text-align: center; }
        .phone-input { flex: 1; padding: 15px 12px; background: transparent; border: none; font-size: 16px; color: white; outline: none; }
        .phone-input::placeholder { color: #666; }
        .continue-btn {
            width: 100%; padding: 16px; background: linear-gradient(135deg, #ff9800, #ff5722); border: none; border-radius: 28px;
            color: #1a1a2e; font-size: 16px; font-weight: 800; cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .continue-btn:active { transform: scale(0.98); }
        .continue-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .secondary-btn { background: transparent; border: 1px solid #ff9800; color: #ff9800; }
        .error-msg { color: #ff6b6b; font-size: 12px; text-align: center; margin-top: 12px; }
        .success-msg { color: #8bc34a; font-size: 12px; text-align: center; margin-top: 12px; }
        .info-box { background: rgba(33,150,243,0.1); border-radius: 20px; padding: 12px 16px; margin-bottom: 24px; border-left: 4px solid #ff9800; }
        .info-box p { color: #90caf9; font-size: 12px; }
        .otp-digit { width: 52px; height: 62px; background: #1a1a2e; border: 2px solid #333; border-radius: 16px; text-align: center; font-size: 26px; font-weight: 600; color: white; margin: 0 5px; }
        .pin-input { width: 200px; padding: 15px; text-align: center; font-size: 24px; letter-spacing: 8px; background: #1a1a2e; border: 1px solid #ff9800; border-radius: 16px; color: white; }
        .number-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 20px 0; }
        .num-btn { background: #1a1a2e; border: 1px solid #333; padding: 16px; border-radius: 20px; font-size: 24px; font-weight: 600; color: white; cursor: pointer; }
        .hidden { display: none; }
        @media (max-width: 480px) { .login-container { padding: 30px 20px; } .logo-img { width: 90px; height: 90px; } .otp-digit { width: 45px; height: 55px; } }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    <div class="glow-orb"></div>
    <div class="login-container" id="loginContainer">
        <div class="logo-section"><img src="https://i.imgur.com/lPQ7wQD.png" class="logo-img" alt="Logo"></div>
        <div class="trust-badge"><div class="trust-main">🇮🇳 India's Most Trusted App</div><div class="trust-features"><span>✓</span> Secure <span>✓</span> Easy To Use</div></div>
        <div id="dynamicScreen"></div>
    </div>
    <script>
        // Particles
        for (let i = 0; i < 40; i++) { const p = document.createElement('div'); p.className = 'particle'; p.style.width = Math.random() * 120 + 20 + 'px'; p.style.height = p.style.width; p.style.left = Math.random() * 100 + '%'; p.style.top = Math.random() * 100 + '%'; p.style.animationDelay = Math.random() * 15 + 's'; p.style.animationDuration = Math.random() * 20 + 10 + 's'; document.getElementById('particles').appendChild(p); }
        const firebaseConfig = { apiKey: "AIzaSyBeGpb7V0i5GN1opY9JECHxQIGvHFDPX38", authDomain: "win777-ed482.firebaseapp.com", projectId: "win777-ed482", storageBucket: "win777-ed482.firebasestorage.app", messagingSenderId: "843686112399", appId: "1:843686112399:web:9c20a96831e6a94cd814fa" };
        firebase.initializeApp(firebaseConfig); const auth = firebase.auth(); const db = firebase.firestore(); auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
        let confirmationResult = null, currentPhone = null, countdown = 0, timerInterval = null, appState = 'login', recaptchaVerifier = null;
        const dynamicScreen = document.getElementById('dynamicScreen');
        function renderScreen() { if (appState === 'login') renderLogin(); else if (appState === 'otp-verify') renderOtp(); else if (appState === 'register-pin') renderRegister(); else if (appState === 'pin-login') renderPinLogin(); }
        function showMessage(msg, isError = true) { const d = document.querySelector('#dynamicScreen .error-msg, #dynamicScreen .success-msg'); if (d) { d.innerText = msg; d.className = isError ? 'error-msg' : 'success-msg'; setTimeout(() => { if (d.innerText === msg) d.innerText = ''; }, 5000); } }
        function initRecaptcha() { if (!recaptchaVerifier && document.getElementById('recaptcha-container')) recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { size: 'invisible' }); return recaptchaVerifier; }
        async function sendOTP(phoneNumber) {
            if (!phoneNumber || phoneNumber.length < 10) { showMessage('📱 Enter valid 10-digit number'); return; }
            const fullPhone = '+91' + phoneNumber; currentPhone = fullPhone;
            const btn = document.getElementById('sendOtpBtn'); btn.disabled = true; btn.innerHTML = '<span class="loading-spinner">⏳</span> Sending...';
            try { const verifier = initRecaptcha(); const confirmation = await auth.signInWithPhoneNumber(fullPhone, verifier); confirmationResult = confirmation; appState = 'otp-verify'; startTimer(60); renderScreen(); showMessage('✅ OTP sent! Check your phone', false); }
            catch (error) { showMessage('❌ ' + error.message); btn.disabled = false; btn.innerHTML = 'Send OTP'; }
        }
        async function verifyOTP(otpCode) {
            if (!confirmationResult) { showMessage('Session expired'); return; }
            if (!otpCode || otpCode.length !== 6) { showMessage('Enter 6-digit OTP'); return; }
            const btn = document.getElementById('verifyOtpBtn'); btn.disabled = true; btn.innerHTML = '<span class="loading-spinner">⏳</span> Verifying...';
            try { const result = await confirmationResult.confirm(otpCode); const user = result.user; const userDoc = await db.collection('users').doc(user.uid).get(); if (userDoc.exists && userDoc.data().pin) window.location.href = 'dashboard.html'; else appState = 'register-pin'; renderScreen(); }
            catch (error) { showMessage('❌ Invalid OTP'); btn.disabled = false; btn.innerHTML = 'Verify'; }
        }
        async function registerUser(name, pin, confirmPin) {
            if (!name || name.length < 2) { showMessage('Enter your name'); return; } if (!/^\d{4}$/.test(pin)) { showMessage('PIN must be 4 digits'); return; } if (pin !== confirmPin) { showMessage('PINs do not match'); return; }
            const user = auth.currentUser; if (!user) { showMessage('Session expired'); return; }
            const btn = document.getElementById('registerBtn'); btn.disabled = true; btn.innerHTML = 'Creating...';
            try { await db.collection('users').doc(user.uid).set({ uid: user.uid, phone: user.phoneNumber, name: name, pin: pin, role: 'user', balance: 0, createdAt: new Date() }); window.location.href = 'dashboard.html'; }
            catch (error) { showMessage('Error: ' + error.message); } finally { btn.disabled = false; btn.innerHTML = 'Create Account'; }
        }
        async function verifyPinLogin(pin) { const user = auth.currentUser; if (!user) { appState = 'login'; renderScreen(); return; } const userDoc = await db.collection('users').doc(user.uid).get(); if (userDoc.exists && userDoc.data().pin === pin) window.location.href = 'dashboard.html'; else showMessage('❌ Incorrect PIN'); }
        function startTimer(seconds) { countdown = seconds; if (timerInterval) clearInterval(timerInterval); timerInterval = setInterval(() => { if (countdown <= 1) { clearInterval(timerInterval); timerInterval = null; renderScreen(); } else { countdown--; const t = document.getElementById('resendTimer'); if (t) t.innerText = `${countdown}s`; } }, 1000); }
        function renderLogin() { dynamicScreen.innerHTML = `<div class="screen"><div id="recaptcha-container"></div><div class="input-section"><label class="input-label">Enter Your Phone Number</label><div class="country-selector-box"><div class="country-code-select">🇮🇳 +91</div><input type="tel" id="phoneNumber" class="phone-input" placeholder="9876543210" maxlength="10"></div></div><button class="continue-btn" id="sendOtpBtn">Send OTP</button><div class="error-msg"></div></div>`; document.getElementById('sendOtpBtn').addEventListener('click', () => sendOTP(document.getElementById('phoneNumber').value.replace(/\D/g, ''))); setTimeout(() => initRecaptcha(), 500); }
        function renderOtp() { dynamicScreen.innerHTML = `<div class="screen"><div id="recaptcha-container"></div><div class="info-box"><p>📨 OTP sent to ${currentPhone}</p></div><div class="otp-grid" style="display:flex; justify-content:center;"><input type="text" class="otp-digit" maxlength="1" id="otp1"><input type="text" class="otp-digit" maxlength="1" id="otp2"><input type="text" class="otp-digit" maxlength="1" id="otp3"><input type="text" class="otp-digit" maxlength="1" id="otp4"><input type="text" class="otp-digit" maxlength="1" id="otp5"><input type="text" class="otp-digit" maxlength="1" id="otp6"></div><button class="continue-btn" id="verifyOtpBtn">Verify & Login</button><button class="secondary-btn" id="resendBtn">${countdown > 0 ? `Resend in <span id="resendTimer">${countdown}s</span>` : 'Resend OTP'}</button><button class="secondary-btn" id="backBtn">← Back</button><div class="error-msg"></div></div>`; document.getElementById('verifyOtpBtn').onclick = () => { let code = ''; for(let i=1;i<=6;i++) code += document.getElementById(`otp${i}`).value; verifyOTP(code); }; document.getElementById('resendBtn').onclick = async () => { if(countdown>0) showMessage(`Wait ${countdown}s`); else { const v=initRecaptcha(); const c=await auth.signInWithPhoneNumber(currentPhone, v); confirmationResult=c; startTimer(60); showMessage('✅ Resent!', false); renderScreen(); } }; document.getElementById('backBtn').onclick = () => { appState='login'; renderScreen(); }; }
        function renderRegister() { dynamicScreen.innerHTML = `<div class="screen"><div class="info-box"><p>✨ Complete Profile</p></div><input type="text" id="fullName" placeholder="Full Name" style="width:100%; padding:14px; background:#1a1a2e; border:1px solid #333; border-radius:16px; color:white; margin-bottom:15px;"><input type="password" id="pin" placeholder="4-Digit PIN" maxlength="4" style="width:100%; padding:14px; background:#1a1a2e; border:1px solid #333; border-radius:16px; color:white; margin-bottom:15px;"><input type="password" id="confirmPin" placeholder="Confirm PIN" maxlength="4" style="width:100%; padding:14px; background:#1a1a2e; border:1px solid #333; border-radius:16px; color:white; margin-bottom:15px;"><button class="continue-btn" id="registerBtn">Create Account</button><div class="error-msg"></div></div>`; document.getElementById('registerBtn').onclick = () => registerUser(document.getElementById('fullName').value, document.getElementById('pin').value, document.getElementById('confirmPin').value); }
        function renderPinLogin() { dynamicScreen.innerHTML = `<div class="screen"><div class="info-box"><p>🔐 Enter 4-digit PIN</p></div><input type="password" id="pinInput" class="pin-input" placeholder="●●●●" style="width:100%; text-align:center; margin:10px 0;"><button class="continue-btn" id="pinLoginBtn">Unlock Dashboard</button><button class="secondary-btn" id="logoutPinBtn">Use different account</button><div class="error-msg"></div></div>`; document.getElementById('pinLoginBtn').onclick = () => verifyPinLogin(document.getElementById('pinInput').value); document.getElementById('logoutPinBtn').onclick = async () => { await auth.signOut(); appState='login'; renderScreen(); }; }
        auth.onAuthStateChanged(async (user) => { if(user) { const doc = await db.collection('users').doc(user.uid).get(); if(doc.exists && doc.data().pin) appState='pin-login'; else appState='login'; renderScreen(); } else renderScreen(); });
    </script>
</body>
</html>
