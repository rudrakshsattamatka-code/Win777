<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WIN777 - Login</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #0a0a0f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-container {
            width: 100%;
            max-width: 400px;
            background: #1a1a2e;
            border-radius: 24px;
            padding: 40px 28px;
            border: 1px solid #0096ff;
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo img {
            width: 100px;
            height: 100px;
            object-fit: contain;
        }
        .trust-badge {
            text-align: center;
            color: #0096ff;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-label {
            color: #ccc;
            font-size: 14px;
            margin-bottom: 8px;
            display: block;
        }
        .phone-wrapper {
            display: flex;
            gap: 10px;
        }
        .country-code {
            width: 80px;
            padding: 14px;
            background: #0a0a0f;
            border: 1px solid #0096ff;
            border-radius: 12px;
            color: #0096ff;
            font-weight: bold;
            text-align: center;
        }
        .phone-input {
            flex: 1;
            padding: 14px;
            background: #0a0a0f;
            border: 1px solid #0096ff;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            outline: none;
        }
        .phone-input:focus {
            border-color: #00ffaa;
        }
        .continue-btn {
            width: 100%;
            padding: 14px;
            background: #0096ff;
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        .continue-btn:active {
            transform: scale(0.98);
        }
        .continue-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .secondary-btn {
            background: transparent;
            border: 1px solid #0096ff;
            color: #0096ff;
        }
        .error-msg {
            color: #ff6b6b;
            font-size: 12px;
            text-align: center;
            margin-top: 12px;
        }
        .success-msg {
            color: #8bc34a;
            font-size: 12px;
            text-align: center;
            margin-top: 12px;
        }
        .info-box {
            background: rgba(0,150,255,0.1);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            border-left: 3px solid #0096ff;
            color: #ccc;
            font-size: 13px;
        }
        .otp-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }
        .otp-digit {
            width: 50px;
            height: 55px;
            background: #0a0a0f;
            border: 1px solid #0096ff;
            border-radius: 12px;
            text-align: center;
            font-size: 24px;
            color: white;
            outline: none;
        }
        .otp-digit:focus {
            border-color: #00ffaa;
        }
        .pin-input {
            width: 200px;
            padding: 14px;
            text-align: center;
            font-size: 24px;
            letter-spacing: 8px;
            background: #0a0a0f;
            border: 1px solid #0096ff;
            border-radius: 12px;
            color: white;
            display: block;
            margin: 10px auto;
        }
        .hidden {
            display: none;
        }
        .resend-btn {
            margin-top: 10px;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="logo">
        <img src="https://i.imgur.com/lPQ7wQD.png" alt="WIN777">
    </div>
    <div class="trust-badge">🇮🇳 India's Most Trusted App</div>

    <!-- Phone Login Screen -->
    <div id="phoneScreen">
        <div class="input-group">
            <label class="input-label">Enter Your Phone Number</label>
            <div class="phone-wrapper">
                <div class="country-code">+91</div>
                <input type="tel" id="phoneNumber" class="phone-input" placeholder="9876543210" maxlength="10">
            </div>
        </div>
        <button class="continue-btn" id="sendOtpBtn">Send OTP</button>
        <div id="phoneError" class="error-msg"></div>
    </div>

    <!-- OTP Verification Screen -->
    <div id="otpScreen" class="hidden">
        <div class="info-box">
            📨 OTP sent to your phone number
        </div>
        <div class="otp-group">
            <input type="text" class="otp-digit" maxlength="1" id="otp1">
            <input type="text" class="otp-digit" maxlength="1" id="otp2">
            <input type="text" class="otp-digit" maxlength="1" id="otp3">
            <input type="text" class="otp-digit" maxlength="1" id="otp4">
            <input type="text" class="otp-digit" maxlength="1" id="otp5">
            <input type="text" class="otp-digit" maxlength="1" id="otp6">
        </div>
        <button class="continue-btn" id="verifyOtpBtn">Verify OTP</button>
        <button class="secondary-btn resend-btn" id="resendOtpBtn">Resend OTP</button>
        <button class="secondary-btn" id="backToPhoneBtn">← Change Number</button>
        <div id="otpError" class="error-msg"></div>
    </div>

    <!-- Register PIN Screen (New User) -->
    <div id="registerScreen" class="hidden">
        <div class="info-box">
            ✨ Complete your profile
        </div>
        <div class="input-group">
            <label class="input-label">Full Name</label>
            <input type="text" id="fullName" class="phone-input" placeholder="Enter your name">
        </div>
        <div class="input-group">
            <label class="input-label">Create 4-Digit PIN</label>
            <input type="password" id="pin" class="phone-input" maxlength="4" placeholder="****">
        </div>
        <div class="input-group">
            <label class="input-label">Confirm PIN</label>
            <input type="password" id="confirmPin" class="phone-input" maxlength="4" placeholder="****">
        </div>
        <button class="continue-btn" id="registerBtn">Create Account</button>
        <div id="registerError" class="error-msg"></div>
    </div>

    <!-- PIN Login Screen (Existing User) -->
    <div id="pinLoginScreen" class="hidden">
        <div class="info-box">
            🔐 Welcome back! Enter your 4-digit PIN
        </div>
        <input type="password" id="loginPin" class="pin-input" maxlength="4" placeholder="●●●●">
        <button class="continue-btn" id="pinLoginBtn">Unlock Dashboard</button>
        <button class="secondary-btn" id="logoutPinBtn">Use different account</button>
        <div id="pinLoginError" class="error-msg"></div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBeGpb7V0i5GN1opY9JECHxQIGvHFDPX38",
        authDomain: "win777-ed482.firebaseapp.com",
        projectId: "win777-ed482",
        storageBucket: "win777-ed482.firebasestorage.app",
        messagingSenderId: "843686112399",
        appId: "1:843686112399:web:9c20a96831e6a94cd814fa"
    };
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    
    let confirmationResult = null;
    let currentPhone = null;
    let countdown = 0;
    let timerInterval = null;
    let recaptchaVerifier = null;
    
    // DOM Elements
    const phoneScreen = document.getElementById('phoneScreen');
    const otpScreen = document.getElementById('otpScreen');
    const registerScreen = document.getElementById('registerScreen');
    const pinLoginScreen = document.getElementById('pinLoginScreen');
    
    function showScreen(screen) {
        phoneScreen.classList.add('hidden');
        otpScreen.classList.add('hidden');
        registerScreen.classList.add('hidden');
        pinLoginScreen.classList.add('hidden');
        
        if (screen === 'phone') phoneScreen.classList.remove('hidden');
        else if (screen === 'otp') otpScreen.classList.remove('hidden');
        else if (screen === 'register') registerScreen.classList.remove('hidden');
        else if (screen === 'pinLogin') pinLoginScreen.classList.remove('hidden');
    }
    
    function showError(elementId, message) {
        const el = document.getElementById(elementId);
        if (el) {
            el.innerText = message;
            setTimeout(() => { el.innerText = ''; }, 5000);
        }
    }
    
    function startTimer(seconds) {
        countdown = seconds;
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (countdown <= 1) {
                clearInterval(timerInterval);
                timerInterval = null;
                const resendBtn = document.getElementById('resendOtpBtn');
                if (resendBtn) {
                    resendBtn.innerText = 'Resend OTP';
                    resendBtn.disabled = false;
                }
            } else {
                countdown--;
                const resendBtn = document.getElementById('resendOtpBtn');
                if (resendBtn) {
                    resendBtn.innerText = `Resend in ${countdown}s`;
                    resendBtn.disabled = true;
                }
            }
        }, 1000);
    }
    
    // Initialize reCAPTCHA
    function initRecaptcha() {
        if (!recaptchaVerifier) {
            const container = document.createElement('div');
            container.id = 'recaptcha-container';
            container.style.position = 'absolute';
            container.style.left = '-9999px';
            document.body.appendChild(container);
            recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
                size: 'invisible'
            });
        }
        return recaptchaVerifier;
    }
    
    // Send OTP
    document.getElementById('sendOtpBtn').onclick = async () => {
        const phone = document.getElementById('phoneNumber').value.replace(/\D/g, '');
        if (!phone || phone.length < 10) {
            showError('phoneError', 'Enter valid 10-digit mobile number');
            return;
        }
        
        const fullPhone = '+91' + phone;
        currentPhone = fullPhone;
        
        const btn = document.getElementById('sendOtpBtn');
        btn.disabled = true;
        btn.innerText = 'Sending...';
        
        try {
            const verifier = initRecaptcha();
            confirmationResult = await auth.signInWithPhoneNumber(fullPhone, verifier);
            showScreen('otp');
            startTimer(60);
            showError('otpError', 'OTP sent successfully!');
        } catch (error) {
            console.error(error);
            let errorMsg = error.message;
            if (error.code === 'auth/invalid-phone-number') errorMsg = 'Invalid phone number';
            else if (error.code === 'auth/too-many-requests') errorMsg = 'Too many requests. Try later';
            showError('phoneError', errorMsg);
        } finally {
            btn.disabled = false;
            btn.innerText = 'Send OTP';
        }
    };
    
    // Verify OTP
    document.getElementById('verifyOtpBtn').onclick = async () => {
        let code = '';
        for (let i = 1; i <= 6; i++) {
            code += document.getElementById(`otp${i}`).value;
        }
        if (code.length !== 6) {
            showError('otpError', 'Enter 6-digit OTP');
            return;
        }
        
        const btn = document.getElementById('verifyOtpBtn');
        btn.disabled = true;
        btn.innerText = 'Verifying...';
        
        try {
            const result = await confirmationResult.confirm(code);
            const user = result.user;
            const userDoc = await db.collection('users').doc(user.uid).get();
            
            if (userDoc.exists && userDoc.data().pin) {
                // Existing user - go to PIN login
                showScreen('pinLogin');
            } else {
                // New user - register PIN
                showScreen('register');
            }
        } catch (error) {
            showError('otpError', 'Invalid OTP. Please try again.');
        } finally {
            btn.disabled = false;
            btn.innerText = 'Verify OTP';
        }
    };
    
    // Resend OTP
    document.getElementById('resendOtpBtn').onclick = async () => {
        if (countdown > 0) {
            showError('otpError', `Wait ${countdown} seconds`);
            return;
        }
        
        const btn = document.getElementById('resendOtpBtn');
        btn.innerText = 'Sending...';
        
        try {
            const verifier = initRecaptcha();
            confirmationResult = await auth.signInWithPhoneNumber(currentPhone, verifier);
            startTimer(60);
            showError('otpError', 'OTP resent!');
        } catch (error) {
            showError('otpError', error.message);
        } finally {
            btn.innerText = 'Resend OTP';
        }
    };
    
    // Back to phone
    document.getElementById('backToPhoneBtn').onclick = () => {
        showScreen('phone');
        for (let i = 1; i <= 6; i++) {
            document.getElementById(`otp${i}`).value = '';
        }
    };
    
    // Register new user
    document.getElementById('registerBtn').onclick = async () => {
        const name = document.getElementById('fullName').value.trim();
        const pin = document.getElementById('pin').value;
        const confirmPin = document.getElementById('confirmPin').value;
        
        if (!name || name.length < 2) {
            showError('registerError', 'Enter your full name');
            return;
        }
        if (!pin || pin.length !== 4) {
            showError('registerError', 'PIN must be 4 digits');
            return;
        }
        if (pin !== confirmPin) {
            showError('registerError', 'PINs do not match');
            return;
        }
        
        const user = auth.currentUser;
        if (!user) {
            showError('registerError', 'Session expired. Please login again.');
            showScreen('phone');
            return;
        }
        
        const btn = document.getElementById('registerBtn');
        btn.disabled = true;
        btn.innerText = 'Creating...';
        
        try {
            await db.collection('users').doc(user.uid).set({
                uid: user.uid,
                phone: user.phoneNumber,
                name: name,
                pin: pin,
                role: 'user',
                balance: 0,
                createdAt: new Date()
            });
            window.location.href = 'dashboard.html';
        } catch (error) {
            showError('registerError', error.message);
        } finally {
            btn.disabled = false;
            btn.innerText = 'Create Account';
        }
    };
    
    // PIN Login
    document.getElementById('pinLoginBtn').onclick = async () => {
        const pin = document.getElementById('loginPin').value;
        if (!pin || pin.length !== 4) {
            showError('pinLoginError', 'Enter 4-digit PIN');
            return;
        }
        
        const user = auth.currentUser;
        if (!user) {
            showScreen('phone');
            return;
        }
        
        const userDoc = await db.collection('users').doc(user.uid).get();
        if (userDoc.exists && userDoc.data().pin === pin) {
            window.location.href = 'dashboard.html';
        } else {
            showError('pinLoginError', 'Incorrect PIN');
        }
    };
    
    // Logout from PIN screen
    document.getElementById('logoutPinBtn').onclick = async () => {
        await auth.signOut();
        showScreen('phone');
        document.getElementById('loginPin').value = '';
    };
    
    // Auto-focus OTP inputs
    for (let i = 1; i <= 6; i++) {
        const input = document.getElementById(`otp${i}`);
        input.addEventListener('input', (e) => {
            if (e.target.value.length === 1 && i < 6) {
                document.getElementById(`otp${i + 1}`).focus();
            }
        });
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && !e.target.value && i > 1) {
                document.getElementById(`otp${i - 1}`).focus();
            }
        });
    }
    
    // Check existing session on load
    auth.onAuthStateChanged(async (user) => {
        if (user) {
            const userDoc = await db.collection('users').doc(user.uid).get();
            if (userDoc.exists && userDoc.data().pin) {
                showScreen('pinLogin');
            } else if (userDoc.exists && !userDoc.data().pin) {
                showScreen('register');
            } else {
                showScreen('phone');
            }
        } else {
            showScreen('phone');
        }
    });
</script>
</body>
</html>
