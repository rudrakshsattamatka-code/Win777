<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WIN777 - Live Support Chat</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Georgia', 'Times New Roman', serif; }
        body { background: #0a0806; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .chat-header { background: linear-gradient(135deg, #1a1510, #0a0806); padding: 15px 20px; display: flex; align-items: center; gap: 15px; border-bottom: 2px solid #ffd700; flex-shrink: 0; }
        .back-btn { background: none; border: none; color: #ffd700; font-size: 24px; cursor: pointer; }
        .chat-title { flex: 1; color: #ffd700; font-size: 18px; font-weight: bold; text-align: center; }
        .status { font-size: 11px; color: #66ff66; margin-top: 3px; }
        
        .chat-messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 20px; font-size: 14px; word-wrap: break-word; }
        .user-message { background: linear-gradient(135deg, #ffd700, #daa520); color: #1a1510; align-self: flex-end; border-bottom-right-radius: 4px; }
        .support-message { background: #1a1510; color: #ffd700; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #ffd70040; }
        .message-time { font-size: 10px; margin-top: 6px; opacity: 0.7; }
        
        .chat-input-area { background: #1a1510; padding: 12px 15px; display: flex; gap: 10px; border-top: 1px solid #ffd70040; flex-shrink: 0; }
        .chat-input { flex: 1; background: #0a0806; border: 1px solid #ffd70040; border-radius: 25px; padding: 12px 18px; color: #ffd700; font-size: 14px; outline: none; }
        .chat-input:focus { border-color: #ffd700; }
        .send-btn { background: linear-gradient(135deg, #ffd700, #daa520); border: none; border-radius: 25px; padding: 0 22px; color: #1a1510; font-weight: bold; cursor: pointer; font-size: 16px; }
        .send-btn:hover { transform: scale(1.02); }
        
        .typing-indicator { color: #aa9c7a; font-size: 12px; padding: 8px 15px; font-style: italic; background: #0a0806; flex-shrink: 0; }
        .welcome-msg { background: #1a1510; border-radius: 16px; padding: 20px; text-align: center; margin: 20px; border: 1px solid #ffd70040; }
        .welcome-msg h3 { color: #ffd700; margin-bottom: 10px; }
        .welcome-msg p { color: #aa9c7a; font-size: 13px; }
        
        /* Removed bottom-nav since chat has its own input area */
        .no-bottom-nav { padding-bottom: 0; }
    </style>
</head>
<body>
    <div class="chat-header">
        <button class="back-btn" onclick="goBack()">←</button>
        <div class="chat-title">
            💬 ROYAL SUPPORT
            <div class="status">● Online 24/7</div>
        </div>
        <div style="width: 30px;"></div>
    </div>
    
    <div class="chat-messages" id="chatMessages">
        <div class="welcome-msg">
            <h3>👑 Welcome to Royal Support!</h3>
            <p>Our support team is available 24/7 to assist you.<br>Send a message and we'll respond shortly.</p>
        </div>
    </div>
    
    <div class="typing-indicator" id="typingIndicator" style="display: none;">👑 Support is typing...</div>
    
    <div class="chat-input-area">
        <input type="text" class="chat-input" id="messageInput" placeholder="Type your message..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button class="send-btn" onclick="sendMessage()">📤 Send</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBeGpb7V0i5GN1opY9JECHxQIGvHFDPX38",
            authDomain: "win777-ed482.firebaseapp.com",
            projectId: "win777-ed482",
            storageBucket: "win777-ed482.firebasestorage.app",
            messagingSenderId: "843686112399",
            appId: "1:843686112399:web:9c20a96831e6a94cd814fa"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        let currentUser = null;
        let currentUserData = null;
        let chatRoomId = null;
        
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            currentUser = user;
            await loadUserData();
            setupChat();
        });
        
        async function loadUserData() {
            try {
                const doc = await db.collection('users').doc(currentUser.uid).get();
                if (doc.exists) {
                    currentUserData = doc.data();
                    chatRoomId = `chat_${currentUser.uid}`;
                    console.log("Chat room ID:", chatRoomId);
                }
            } catch (error) {
                console.error("Error loading user data:", error);
            }
        }
        
        function setupChat() {
            if (!chatRoomId) return;
            
            // Listen for messages
            db.collection('chats').doc(chatRoomId).collection('messages')
                .orderBy('timestamp', 'asc')
                .onSnapshot((snapshot) => {
                    const container = document.getElementById('chatMessages');
                    if (snapshot.empty) {
                        return;
                    }
                    
                    let html = '';
                    snapshot.forEach(doc => {
                        const msg = doc.data();
                        const isUser = msg.senderId === currentUser.uid;
                        const time = msg.timestamp?.toDate().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) || '';
                        
                        html += `
                            <div class="message ${isUser ? 'user-message' : 'support-message'}">
                                ${escapeHtml(msg.text)}
                                <div class="message-time">${time}</div>
                            </div>
                        `;
                    });
                    if (html) container.innerHTML = html;
                    container.scrollTop = container.scrollHeight;
                }, (error) => {
                    console.error("Error loading messages:", error);
                });
            
            // Listen for typing indicator from admin
            db.collection('chats').doc(chatRoomId).onSnapshot((doc) => {
                if (doc.exists && doc.data().adminTyping) {
                    document.getElementById('typingIndicator').style.display = 'block';
                } else {
                    document.getElementById('typingIndicator').style.display = 'none';
                }
            }, (error) => {
                console.error("Typing indicator error:", error);
            });
            
            // Create/update chat document
            db.collection('chats').doc(chatRoomId).set({
                userId: currentUser.uid,
                userName: currentUserData?.name || 'User',
                userPhone: currentUserData?.phone || '',
                lastActive: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true }).catch(error => {
                console.error("Error creating chat document:", error);
            });
        }
        
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;
            
            input.value = '';
            
            try {
                await db.collection('chats').doc(chatRoomId).collection('messages').add({
                    senderId: currentUser.uid,
                    senderName: currentUserData?.name || 'User',
                    text: text,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    isUser: true
                });
                
                await db.collection('chats').doc(chatRoomId).set({
                    lastMessage: text,
                    lastMessageTime: firebase.firestore.FieldValue.serverTimestamp(),
                    unread: true
                }, { merge: true });
                
                console.log("Message sent successfully");
            } catch (error) {
                console.error("Error sending message:", error);
                alert("Error sending message: " + error.message);
            }
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        function goBack() {
            window.location.href = 'dashboard.html';
        }
        
        // Typing indicator
        let typingTimeout;
        const inputField = document.getElementById('messageInput');
        if (inputField) {
            inputField.addEventListener('input', () => {
                if (!chatRoomId) return;
                db.collection('chats').doc(chatRoomId).update({ userTyping: true }).catch(() => {});
                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(() => {
                    db.collection('chats').doc(chatRoomId).update({ userTyping: false }).catch(() => {});
                }, 1000);
            });
        }
        
        window.sendMessage = sendMessage;
        window.goBack = goBack;
    </script>
</body>
</html>
