<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Live Chat Support</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f5f5f5; display: flex; height: 100vh; overflow: hidden; }
        
        .users-panel { width: 320px; background: #fff; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
        .users-panel h3 { padding: 18px; background: #333; color: #fff; font-size: 16px; }
        .users-list { flex: 1; overflow-y: auto; }
        .user-item { padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; transition: all 0.2s; }
        .user-item:hover { background: #f9f9f9; }
        .user-item.active { background: #fff3e0; border-left: 3px solid #ff9800; }
        .user-name { font-weight: bold; color: #333; }
        .user-phone { font-size: 11px; color: #888; margin-top: 2px; }
        .last-msg { font-size: 11px; color: #666; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .last-time { font-size: 10px; color: #999; margin-top: 3px; }
        .unread-badge { background: #ff9800; color: #fff; border-radius: 10px; padding: 2px 8px; font-size: 10px; margin-left: 8px; }
        .no-users { padding: 30px; text-align: center; color: #888; }
        
        .chat-panel { flex: 1; display: flex; flex-direction: column; background: #fff; }
        .chat-header { padding: 18px; background: #333; color: #fff; border-bottom: 1px solid #ddd; }
        .chat-header .user-name { color: #ff9800; font-size: 16px; }
        .chat-header .user-phone { color: #aaa; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 20px; background: #fafafa; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 70%; padding: 10px 14px; border-radius: 18px; font-size: 14px; word-wrap: break-word; }
        .user-msg { background: #ff9800; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
        .admin-msg { background: #e9ecef; color: #333; align-self: flex-start; border-bottom-left-radius: 4px; }
        .msg-time { font-size: 10px; margin-top: 5px; opacity: 0.7; }
        .no-chat { text-align: center; color: #888; padding: 50px; }
        
        .typing-indicator { padding: 10px 20px; font-size: 12px; color: #888; font-style: italic; background: #fafafa; }
        .input-area { padding: 15px 20px; background: #fff; border-top: 1px solid #ddd; display: flex; gap: 12px; }
        .input-area input { flex: 1; padding: 12px 18px; border: 1px solid #ddd; border-radius: 25px; outline: none; font-size: 14px; }
        .input-area input:focus { border-color: #ff9800; }
        .input-area button { background: #ff9800; color: #fff; border: none; padding: 12px 25px; border-radius: 25px; cursor: pointer; font-weight: bold; }
        .input-area button:hover { background: #e68900; }
    </style>
</head>
<body>
    <div class="users-panel">
        <h3>💬 Active Chat Users</h3>
        <div class="users-list" id="usersList">
            <div class="no-users">Loading...</div>
        </div>
    </div>
    
    <div class="chat-panel">
        <div class="chat-header" id="chatHeader">
            <div style="text-align: center; color: #aaa;">Select a user to start chatting</div>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="no-chat">👈 Select a user from the left panel</div>
        </div>
        <div class="typing-indicator" id="typingIndicator" style="display: none;"></div>
        <div class="input-area" id="inputArea" style="display: none;">
            <input type="text" id="messageInput" placeholder="Type your reply..." onkeypress="if(event.key==='Enter') sendAdminMessage()">
            <button onclick="sendAdminMessage()">Send</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBeGpb7V0i5GN1opY9JECHxQIGvHFDPX38",
            authDomain: "win777-ed482.firebaseapp.com",
            projectId: "win777-ed482",
            storageBucket: "win777-ed482.firebasestorage.app",
            messagingSenderId: "843686112399",
            appId: "1:843686112399:web:9c20a96831e6a94cd814fa"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        let selectedUserId = null;
        let selectedUserName = "";
        const adminId = "admin_support";
        
        function loadUsers() {
            db.collection('chats').orderBy('lastMessageTime', 'desc').onSnapshot((snapshot) => {
                const container = document.getElementById('usersList');
                if (snapshot.empty) {
                    container.innerHTML = '<div class="no-users">No active chats yet</div>';
                    return;
                }
                
                let html = '';
                snapshot.forEach(doc => {
                    const user = doc.data();
                    const hasUnread = user.unread === true;
                    const timeAgo = user.lastMessageTime?.toDate().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) || '';
                    
                    html += `
                        <div class="user-item ${selectedUserId === doc.id ? 'active' : ''}" onclick="selectUser('${doc.id}', '${escapeHtml(user.userName)}')">
                            <div class="user-name">
                                ${escapeHtml(user.userName)}
                                ${hasUnread ? '<span class="unread-badge">New</span>' : ''}
                            </div>
                            <div class="user-phone">${user.userPhone || 'No phone'}</div>
                            <div class="last-msg">💬 ${escapeHtml(user.lastMessage?.substring(0, 45) || 'No messages')}</div>
                            <div class="last-time">${timeAgo}</div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            });
        }
        
        function selectUser(userId, userName) {
            selectedUserId = userId;
            selectedUserName = userName;
            
            document.getElementById('chatHeader').innerHTML = `
                <div>
                    <span class="user-name">👑 ${escapeHtml(userName)}</span>
                    <div class="user-phone">Chatting with user</div>
                </div>
            `;
            document.getElementById('inputArea').style.display = 'flex';
            document.getElementById('chatMessages').innerHTML = '<div style="padding:20px; text-align:center; color:#888;">Loading messages...</div>';
            
            db.collection('chats').doc(userId).update({ unread: false });
            loadMessages();
            
            db.collection('chats').doc(userId).onSnapshot((doc) => {
                if (doc.exists && doc.data().userTyping) {
                    document.getElementById('typingIndicator').innerHTML = '✍️ User is typing...';
                    document.getElementById('typingIndicator').style.display = 'block';
                } else {
                    document.getElementById('typingIndicator').style.display = 'none';
                }
            });
        }
        
        function loadMessages() {
            if (!selectedUserId) return;
            
            db.collection('chats').doc(selectedUserId).collection('messages')
                .orderBy('timestamp', 'asc')
                .onSnapshot((snapshot) => {
                    const container = document.getElementById('chatMessages');
                    if (snapshot.empty) {
                        container.innerHTML = '<div class="no-chat">No messages yet. Start the conversation!</div>';
                        return;
                    }
                    
                    let html = '';
                    snapshot.forEach(doc => {
                        const msg = doc.data();
                        const isUser = msg.senderId !== adminId;
                        const time = msg.timestamp?.toDate().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) || '';
                        
                        html += `
                            <div class="message ${isUser ? 'user-msg' : 'admin-msg'}">
                                ${escapeHtml(msg.text)}
                                <div class="msg-time">${time}</div>
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                    container.scrollTop = container.scrollHeight;
                });
        }
        
        async function sendAdminMessage() {
            if (!selectedUserId) {
                alert('Please select a user first');
                return;
            }
            
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;
            
            input.value = '';
            
            await db.collection('chats').doc(selectedUserId).collection('messages').add({
                senderId: adminId,
                senderName: 'Support Team',
                text: text,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                isAdmin: true
            });
            
            await db.collection('chats').doc(selectedUserId).update({
                lastMessage: text,
                lastMessageTime: firebase.firestore.FieldValue.serverTimestamp(),
                adminTyping: false
            });
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        let typingTimeout;
        const inputField = document.getElementById('messageInput');
        
        function setupTypingListener() {
            if (!inputField) return;
            inputField.addEventListener('input', () => {
                if (!selectedUserId) return;
                db.collection('chats').doc(selectedUserId).update({ adminTyping: true });
                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(() => {
                    db.collection('chats').doc(selectedUserId).update({ adminTyping: false });
                }, 1000);
            });
        }
        
        loadUsers();
        setTimeout(setupTypingListener, 500);
        
        window.selectUser = selectUser;
        window.sendAdminMessage = sendAdminMessage;
    </script>
</body>
</html>
