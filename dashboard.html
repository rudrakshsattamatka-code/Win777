<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WIN777 - Dashboard</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: #0a0a0f; min-height: 100vh; padding-bottom: 80px; position: relative; overflow-x: hidden; }
        .bg-animation { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; overflow: hidden; }
        .orb { position: absolute; background: radial-gradient(circle, rgba(33,150,243,0.1), transparent); border-radius: 50%; animation: float 20s infinite; }
        @keyframes float { 0%,100% { transform: translateY(0) translateX(0); } 25% { transform: translateY(-80px) translateX(50px); } 50% { transform: translateY(-160px) translateX(-50px); } 75% { transform: translateY(-80px) translateX(50px); } }
        .header { background: #1a1a2e; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #2196f3; }
        .logo-small { font-size: 24px; font-weight: bold; color: #2196f3; }
        .balance-card { background: #2196f3; padding: 6px 16px; border-radius: 30px; color: white; font-weight: bold; }
        .menu-btn { background: none; border: none; font-size: 24px; color: #2196f3; cursor: pointer; }
        .sidebar { position: fixed; left: -280px; top: 0; width: 280px; height: 100%; background: #1a1a2e; z-index: 1000; transition: 0.3s; border-right: 1px solid #2196f3; }
        .sidebar.open { left: 0; }
        .sidebar-header { padding: 25px; text-align: center; border-bottom: 1px solid #2196f3; }
        .sidebar-header h2 { color: #2196f3; }
        .sidebar-item { padding: 15px 25px; display: flex; align-items: center; gap: 12px; color: #aaa; cursor: pointer; border-bottom: 1px solid #222; }
        .sidebar-item:hover { background: #2196f310; color: #2196f3; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 999; display: none; }
        .overlay.active { display: block; }
        .container { max-width: 500px; margin: 0 auto; padding: 20px 16px; position: relative; z-index: 1; }
        .market-card { background: #1a1a2e; border-radius: 20px; padding: 18px; margin-bottom: 16px; border: 1px solid #2196f3; transition: 0.2s; }
        .market-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .market-name { font-size: 18px; font-weight: 800; color: #2196f3; text-transform: uppercase; }
        .market-result { font-size: 12px; color: #aaa; background: #0a0a0f; padding: 4px 10px; border-radius: 20px; font-family: monospace; }
        .market-status { font-size: 11px; padding: 4px 12px; border-radius: 20px; }
        .status-open-bid { background: #2196f320; color: #2196f3; }
        .status-close-bid { background: #ff980020; color: #ff9800; }
        .status-closed { background: #f4433620; color: #f44336; }
        .market-time { font-size: 12px; color: #aaa; margin: 10px 0; }
        .bid-phase { font-size: 11px; padding: 6px; border-radius: 10px; text-align: center; margin-bottom: 12px; }
        .bid-phase-open { background: #2196f310; color: #2196f3; }
        .bid-phase-close { background: #ff980010; color: #ff9800; }
        .play-btn { width: 100%; padding: 12px; background: #2196f3; border: none; border-radius: 16px; color: white; font-weight: bold; cursor: pointer; }
        .play-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #1a1a2e; display: flex; justify-content: space-around; padding: 10px 20px; border-top: 1px solid #2196f3; z-index: 100; }
        .nav-item { text-align: center; color: #aaa; cursor: pointer; font-size: 11px; }
        .nav-item.active { color: #2196f3; }
        .nav-item span { font-size: 22px; display: block; }
        .card { background: #1a1a2e; border-radius: 24px; padding: 20px; margin-bottom: 20px; border: 1px solid #2196f3; }
        .card-title { font-size: 18px; font-weight: bold; color: #2196f3; margin-bottom: 15px; border-left: 4px solid #2196f3; padding-left: 12px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; color: #aaa; font-size: 12px; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 12px; background: #0a0a0f; border: 1px solid #2196f3; border-radius: 12px; color: white; }
        .save-btn { background: #2196f3; padding: 12px; border: none; border-radius: 12px; color: white; font-weight: bold; width: 100%; cursor: pointer; }
        .data-table { width: 100%; overflow-x: auto; }
        .data-table table { width: 100%; border-collapse: collapse; }
        .data-table th, .data-table td { padding: 10px; text-align: left; border-bottom: 1px solid #2196f3; color: #ddd; font-size: 13px; }
        .data-table th { color: #2196f3; }
        .hidden { display: none; }
        .amount-options { display: flex; gap: 10px; flex-wrap: wrap; margin: 15px 0; }
        .amount-chip { background: #0a0a0f; border: 1px solid #2196f3; padding: 8px 15px; border-radius: 30px; cursor: pointer; color: white; }
        .amount-chip.active { background: #2196f3; color: white; }
        @media (max-width: 480px) { .market-name { font-size: 14px; } }
    </style>
</head>
<body>
    <div class="bg-animation" id="bgAnimation"></div>
    <div class="header"><button class="menu-btn" id="menuBtn">☰</button><div class="logo-small">WIN777</div><div class="balance-card">💰 ₹<span id="userBalance">0</span></div></div>
    <div class="sidebar" id="sidebar"><div class="sidebar-header"><h2>WIN777</h2></div><div class="sidebar-item" onclick="showPage('profile')">👤 My Profile</div><div class="sidebar-item" onclick="showPage('bank')">🏦 Bank Details</div><div class="sidebar-item" onclick="showPage('history')">📋 Bid History</div><div class="sidebar-item" onclick="showPage('transactions')">📊 Transactions</div><div class="sidebar-item" id="logoutBtn" style="color:#f44336;">🚪 Logout</div></div>
    <div class="overlay" id="overlay"></div>
    <div class="container"><div id="marketsList"></div><div id="profilePage" class="hidden"><div class="card"><div class="card-title">👤 My Profile</div><p id="profileName" style="color:white;"></p><p id="profilePhone" style="color:#aaa;"></p><p id="profileBalance" style="color:#2196f3;"></p></div></div><div id="bankPage" class="hidden"><div class="card"><div class="card-title">🏦 Bank Details</div><div class="form-group"><label>Account Holder</label><input type="text" id="accName"></div><div class="form-group"><label>Bank Name</label><input type="text" id="bankName"></div><div class="form-group"><label>Account Number</label><input type="text" id="accNumber"></div><div class="form-group"><label>IFSC Code</label><input type="text" id="ifsc"></div><button class="save-btn" id="saveBankBtn">Save</button></div></div><div id="historyPage" class="hidden"><div class="card"><div class="card-title">📋 Bid History</div><div id="bidHistoryList"></div></div></div><div id="transactionsPage" class="hidden"><div class="card"><div class="card-title">📊 Transactions</div><div id="transactionsList"></div></div></div></div>
    <div class="bottom-nav"><div class="nav-item active" onclick="scrollToMarkets()"><span>🏠</span><p>Home</p></div><div class="nav-item" onclick="showDeposit()"><span>💰</span><p>Deposit</p></div><div class="nav-item" onclick="showWithdraw()"><span>💸</span><p>Withdraw</p></div><div class="nav-item" onclick="showPage('profile')"><span>👤</span><p>Profile</p></div></div>

    <!-- Deposit Modal -->
    <div id="depositModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:2000; justify-content:center; align-items:center;"><div style="background:#1a1a2e; border-radius:30px; padding:25px; width:90%; max-width:350px; border:1px solid #2196f3;"><h3 style="color:#2196f3;">💰 Deposit</h3><div class="amount-options"><div class="amount-chip" onclick="setAmount(200)">₹200</div><div class="amount-chip" onclick="setAmount(500)">₹500</div><div class="amount-chip" onclick="setAmount(1000)">₹1000</div><div class="amount-chip" onclick="setAmount(5000)">₹5000</div></div><input type="number" id="customAmount" placeholder="Enter Amount" style="width:100%; padding:12px; background:#0a0a0f; border:1px solid #2196f3; border-radius:12px; color:white;"><button class="save-btn" id="payBtn" style="margin-top:15px;">Pay</button><button class="save-btn" style="background:#333; margin-top:10px;" onclick="closeDeposit()">Cancel</button><div id="depositMsg"></div></div></div>
    <!-- Withdraw Modal -->
    <div id="withdrawModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:2000; justify-content:center; align-items:center;"><div style="background:#1a1a2e; border-radius:30px; padding:25px; width:90%; max-width:350px; border:1px solid #2196f3;"><h3 style="color:#2196f3;">💸 Withdraw</h3><select id="bankSelect" style="width:100%; padding:12px; background:#0a0a0f; border:1px solid #2196f3; border-radius:12px; color:white; margin-bottom:15px;"></select><input type="number" id="withdrawAmount" placeholder="Amount (Min ₹500)" style="width:100%; padding:12px; background:#0a0a0f; border:1px solid #2196f3; border-radius:12px; color:white;"><button class="save-btn" id="withdrawBtn" style="margin-top:15px;">Request</button><button class="save-btn" style="background:#333; margin-top:10px;" onclick="closeWithdraw()">Cancel</button><div id="withdrawMsg"></div></div></div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyBeGpb7V0i5GN1opY9JECHxQIGvHFDPX38", authDomain: "win777-ed482.firebaseapp.com", projectId: "win777-ed482", storageBucket: "win777-ed482.firebasestorage.app", messagingSenderId: "843686112399", appId: "1:843686112399:web:9c20a96831e6a94cd814fa" };
        firebase.initializeApp(firebaseConfig); const auth = firebase.auth(); const db = firebase.firestore();
        let currentUser = null, userData = null, marketsData = [], currentAmount = 200;

        // Background Animation
        for (let i = 0; i < 30; i++) { const orb = document.createElement('div'); orb.className = 'orb'; orb.style.width = Math.random() * 300 + 100 + 'px'; orb.style.height = orb.style.width; orb.style.left = Math.random() * 100 + '%'; orb.style.top = Math.random() * 100 + '%'; orb.style.animationDelay = Math.random() * 20 + 's'; orb.style.animationDuration = Math.random() * 25 + 15 + 's'; document.getElementById('bgAnimation').appendChild(orb); }

        function parseTime(t) { const d=new Date(); let h=0,m=0, match=t.match(/(\d+):(\d+)\s*(AM|PM)/i); if(match){ h=parseInt(match[1]); m=parseInt(match[2]); if(match[3].toUpperCase()==='PM' && h!==12) h+=12; if(match[3].toUpperCase()==='AM' && h===12) h=0; } d.setHours(h,m,0,0); return d; }
        function getMarketPhase(m){ const n=new Date(), mr=new Date(); mr.setHours(0,30,0,0); const o=parseTime(m.openBidEnd), c=parseTime(m.closeBidEnd); if(n>=mr && n<o) return 'open_bid'; if(n>=o && n<c) return 'close_bid'; return 'closed'; }
        
        async function loadMarkets() { const snap = await db.collection('markets').get(); marketsData = []; snap.forEach(d=>marketsData.push({id:d.id, ...d.data()})); renderMarkets(); }
        function renderMarkets(){ const c=document.getElementById('marketsList'); c.innerHTML=''; marketsData.forEach(m=>{ const p=getMarketPhase(m); c.innerHTML+=`<div class="market-card"><div class="market-header"><span class="market-name">${m.name}</span><span class="market-result">🎲 ${m.result||'***-**-***'}</span></div><div class="market-time">⏰ Open Ends: ${m.openBidEnd} | Close Ends: ${m.closeBidEnd}</div><div class="bid-phase ${p==='open_bid'?'bid-phase-open':'bid-phase-close'}">${p==='open_bid'?'📈 ALL BETS':'📉 CLOSE ONLY'}</div><button class="play-btn" ${p==='closed'?'disabled':''} onclick="playMarket('${m.name}','${p}')">${p==='closed'?'🔴 CLOSED':'🎲 PLAY'}</button></div>`; }); }
        function playMarket(name,phase){ window.location.href=`betting.html?market=${encodeURIComponent(name)}&phase=${phase}`; }
        
        async function loadUserData(){ const u=auth.currentUser; if(!u) return; currentUser=u; const doc=await db.collection('users').doc(u.uid).get(); userData=doc.data(); document.getElementById('userBalance').innerText=userData?.balance||0; document.getElementById('profileName').innerHTML=`👤 ${userData?.name||'User'}`; document.getElementById('profilePhone').innerHTML=`📞 ${userData?.phone||''}`; document.getElementById('profileBalance').innerHTML=`💰 Balance: ₹${userData?.balance||0}`; if(userData?.bankDetails){ document.getElementById('accName').value=userData.bankDetails.accName||''; document.getElementById('bankName').value=userData.bankDetails.bankName||''; document.getElementById('accNumber').value=userData.bankDetails.accNumber||''; document.getElementById('ifsc').value=userData.bankDetails.ifsc||''; } loadBidHistory(); loadTransactions(); }
        async function loadBidHistory(){ const bids=await db.collection('bids').where('userId','==',currentUser.uid).orderBy('createdAt','desc').get(); const div=document.getElementById('bidHistoryList'); if(bids.empty){ div.innerHTML='<p style="color:#888;">No bids</p>'; return; } div.innerHTML=`<div class="data-table"><table><td><th>Market</th><th>Type</th><th>Value</th><th>Points</th><th>Status</th></tr>${bids.docs.map(d=>`<tr><td>${d.data().market}</td><td>${d.data().gameType}</td><td>${d.data().value}</td><td>${d.data().points}</td><td>${d.data().status}</td></tr>`).join('')}</table></div>`; }
        async function loadTransactions(){ const trans=await db.collection('transactions').where('userId','==',currentUser.uid).orderBy('date','desc').get(); const div=document.getElementById('transactionsList'); if(trans.empty){ div.innerHTML='<p style="color:#888;">No transactions</p>'; return; } div.innerHTML=`<div class="data-table"><tr><th>Type</th><th>Amount</th><th>Status</th><th>Date</th></tr>${trans.docs.map(d=>`<tr><td style="color:${d.data().type==='credit'?'#4caf50':'#f44336'}">${d.data().type}</td><td>₹${d.data().amount}</td><td>${d.data().status||'Completed'}</td><td>${d.data().date?.toDate().toLocaleString()||''}</td></tr>`).join('')}</table></div>`; }
        
        document.getElementById('saveBankBtn').onclick=async()=>{ const bank={accName:document.getElementById('accName').value, bankName:document.getElementById('bankName').value, accNumber:document.getElementById('accNumber').value, ifsc:document.getElementById('ifsc').value}; await db.collection('users').doc(currentUser.uid).update({bankDetails:bank}); alert('Bank saved!'); };
        function showPage(page){ document.getElementById('marketsList').classList.add('hidden'); document.getElementById('profilePage').classList.add('hidden'); document.getElementById('bankPage').classList.add('hidden'); document.getElementById('historyPage').classList.add('hidden'); document.getElementById('transactionsPage').classList.add('hidden'); if(page==='markets') document.getElementById('marketsList').classList.remove('hidden'); else if(page==='profile') document.getElementById('profilePage').classList.remove('hidden'); else if(page==='bank') document.getElementById('bankPage').classList.remove('hidden'); else if(page==='history') { document.getElementById('historyPage').classList.remove('hidden'); loadBidHistory(); } else if(page==='transactions') { document.getElementById('transactionsPage').classList.remove('hidden'); loadTransactions(); } closeSidebar(); }
        function scrollToMarkets(){ document.getElementById('marketsList').scrollIntoView({behavior:'smooth'}); }
        function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('active'); }
        document.getElementById('menuBtn').onclick=()=>{ document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay').classList.toggle('active'); };
        document.getElementById('overlay').onclick=closeSidebar;
        document.getElementById('logoutBtn').onclick=async()=>{ await auth.signOut(); window.location.href='index.html'; };
        
        function setAmount(amt){ currentAmount=amt; document.getElementById('customAmount').value=''; }
        function showDeposit(){ document.getElementById('depositModal').style.display='flex'; }
        function closeDeposit(){ document.getElementById('depositModal').style.display='none'; }
        document.getElementById('payBtn').onclick=()=>{ let amt=currentAmount; const custom=parseInt(document.getElementById('customAmount').value); if(custom>=200 && custom<=49000) amt=custom; if(amt<200){ alert('Min ₹200'); return; } const upi=`upi://pay?pa=win777@okhdfcbank&pn=WIN777&am=${amt}&cu=INR`; window.location.href=upi; setTimeout(async()=>{ const newBal=(userData.balance||0)+amt; await db.collection('users').doc(currentUser.uid).update({balance:newBal}); await db.collection('transactions').add({userId:currentUser.uid, type:'credit', amount:amt, status:'Completed', date:new Date()}); loadUserData(); alert(`₹${amt} added!`); closeDeposit(); }, 5000); };
        
        async function showWithdraw(){ const doc=await db.collection('users').doc(currentUser.uid).get(); const bank=doc.data().bankDetails; const select=document.getElementById('bankSelect'); select.innerHTML=''; if(bank) select.innerHTML+=`<option value="${bank.accNumber}">${bank.bankName} - ${bank.accNumber}</option>`; select.innerHTML+=`<option value="new">+ Add New</option>`; document.getElementById('withdrawModal').style.display='flex'; }
        function closeWithdraw(){ document.getElementById('withdrawModal').style.display='none'; }
        document.getElementById('withdrawBtn').onclick=async()=>{ const amount=parseInt(document.getElementById('withdrawAmount').value); if(amount<500){ alert('Min ₹500'); return; } if(amount>userData.balance){ alert('Insufficient balance'); return; } const bankSelect=document.getElementById('bankSelect').value; let bankDetails=userData.bankDetails; if(bankSelect==='new'){ bankDetails={accName:prompt('Account Name'), bankName:prompt('Bank Name'), accNumber:prompt('Account Number'), ifsc:prompt('IFSC')}; } await db.collection('withdrawRequests').add({userId:currentUser.uid, amount:amount, bankDetails:bankDetails, status:'Pending', date:new Date().toDateString(), createdAt:new Date()}); await db.collection('transactions').add({userId:currentUser.uid, type:'debit', amount:amount, status:'Pending', description:'Withdrawal Request', date:new Date()}); alert('Request sent for approval!'); closeWithdraw(); };
        
        auth.onAuthStateChanged(async (user)=>{ if(!user) window.location.href='index.html'; else { await loadUserData(); await loadMarkets(); setInterval(loadMarkets, 30000); } });
    </script>
</body>
</html>
