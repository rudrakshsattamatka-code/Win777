<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WIN777 - Dashboard</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        body {
            background: #0a0a0f;
            padding-bottom: 70px;
        }
        /* Header */
        .header {
            background: #1a1a2e;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            border-bottom: 1px solid #0096ff;
            z-index: 100;
        }
        .logo {
            color: #0096ff;
            font-size: 22px;
            font-weight: bold;
        }
        .balance {
            background: #0096ff;
            padding: 5px 15px;
            border-radius: 30px;
            color: white;
            font-weight: bold;
        }
        .menu-btn {
            background: none;
            border: none;
            color: #0096ff;
            font-size: 24px;
            cursor: pointer;
        }
        /* Sidebar */
        .sidebar {
            position: fixed;
            left: -260px;
            top: 0;
            width: 260px;
            height: 100%;
            background: #1a1a2e;
            transition: 0.3s;
            z-index: 1000;
            border-right: 1px solid #0096ff;
            overflow-y: auto;
        }
        .sidebar.open {
            left: 0;
        }
        .sidebar-header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #0096ff;
        }
        .sidebar-header h2 {
            color: #0096ff;
        }
        .sidebar-item {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #ccc;
            cursor: pointer;
            border-bottom: 1px solid #222;
        }
        .sidebar-item:hover {
            background: #0096ff20;
            color: #0096ff;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            display: none;
        }
        .overlay.active {
            display: block;
        }
        /* Container */
        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 15px;
        }
        /* Market Card */
        .market-card {
            background: #1a1a2e;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 12px;
            border: 1px solid #0096ff;
        }
        .market-name {
            color: #0096ff;
            font-weight: bold;
            font-size: 16px;
        }
        .market-result {
            color: #ff9800;
            font-size: 12px;
            margin-top: 5px;
        }
        .market-status {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            margin: 10px 0;
        }
        .status-open {
            background: #4caf5020;
            color: #4caf50;
            border: 1px solid #4caf50;
        }
        .status-close {
            background: #ff980020;
            color: #ff9800;
            border: 1px solid #ff9800;
        }
        .status-closed {
            background: #f4433620;
            color: #f44336;
            border: 1px solid #f44336;
        }
        .play-btn {
            width: 100%;
            padding: 10px;
            background: #0096ff;
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .play-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1a1a2e;
            display: flex;
            justify-content: space-around;
            padding: 10px;
            border-top: 1px solid #0096ff;
            z-index: 100;
        }
        .nav-item {
            text-align: center;
            color: #aaa;
            cursor: pointer;
            font-size: 11px;
        }
        .nav-item.active {
            color: #0096ff;
        }
        .nav-item span {
            font-size: 22px;
            display: block;
        }
        /* Cards */
        .card {
            background: #1a1a2e;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #0096ff;
        }
        .card-title {
            color: #0096ff;
            margin-bottom: 12px;
            font-weight: bold;
            font-size: 16px;
            border-left: 3px solid #0096ff;
            padding-left: 10px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            background: #0a0a0f;
            border: 1px solid #0096ff;
            border-radius: 8px;
            color: white;
        }
        button {
            background: #0096ff;
            padding: 10px;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        /* Tables */
        .data-table {
            width: 100%;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid #0096ff;
            color: #ddd;
            font-size: 12px;
        }
        th {
            color: #0096ff;
        }
        .no-data {
            color: #888;
            text-align: center;
            padding: 20px;
        }
        .hidden {
            display: none;
        }
        /* Amount options */
        .amount-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 10px 0;
        }
        .amount-chip {
            background: #0a0a0f;
            border: 1px solid #0096ff;
            padding: 8px 15px;
            border-radius: 30px;
            cursor: pointer;
            color: white;
        }
        .amount-chip.active {
            background: #0096ff;
            color: white;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #1a1a2e;
            border-radius: 20px;
            padding: 20px;
            width: 90%;
            max-width: 350px;
            border: 1px solid #0096ff;
        }
        .modal-content h3 {
            color: #0096ff;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
<div class="header">
    <button class="menu-btn" id="menuBtn">☰</button>
    <div class="logo">WIN777</div>
    <div class="balance">💰 ₹<span id="userBalance">0</span></div>
</div>

<div class="sidebar" id="sidebar">
    <div class="sidebar-header"><h2>WIN777</h2></div>
    <div class="sidebar-item" onclick="showPage('markets')">🎮 Markets</div>
    <div class="sidebar-item" onclick="showPage('profile')">👤 Profile</div>
    <div class="sidebar-item" onclick="showPage('bank')">🏦 Bank Details</div>
    <div class="sidebar-item" onclick="showPage('history')">📋 Bid History</div>
    <div class="sidebar-item" onclick="showPage('transactions')">📊 Transactions</div>
    <div class="sidebar-item" id="logoutBtn">🚪 Logout</div>
</div>
<div class="overlay" id="overlay"></div>

<div class="container">
    <!-- Markets Page -->
    <div id="marketsPage"></div>
    
    <!-- Profile Page -->
    <div id="profilePage" class="hidden">
        <div class="card">
            <div class="card-title">My Profile</div>
            <p id="profileName" style="color:white; margin:5px 0"></p>
            <p id="profilePhone" style="color:#aaa; margin:5px 0"></p>
            <p id="profileBalance" style="color:#0096ff; font-size:18px; font-weight:bold; margin:5px 0"></p>
        </div>
    </div>
    
    <!-- Bank Details Page -->
    <div id="bankPage" class="hidden">
        <div class="card">
            <div class="card-title">Bank Details</div>
            <input type="text" id="accName" placeholder="Account Holder Name">
            <input type="text" id="bankName" placeholder="Bank Name">
            <input type="text" id="accNumber" placeholder="Account Number">
            <input type="text" id="ifsc" placeholder="IFSC Code">
            <button id="saveBankBtn">Save Bank Details</button>
            <div id="bankMsg" style="color:#4caf50; margin-top:8px;"></div>
        </div>
    </div>
    
    <!-- Bid History Page -->
    <div id="historyPage" class="hidden">
        <div class="card">
            <div class="card-title">📋 Bid History</div>
            <div id="bidHistoryList" class="data-table"></div>
        </div>
    </div>
    
    <!-- Transactions Page -->
    <div id="transactionsPage" class="hidden">
        <div class="card">
            <div class="card-title">📊 Transaction History</div>
            <div id="transactionsList" class="data-table"></div>
        </div>
    </div>
</div>

<div class="bottom-nav">
    <div class="nav-item active" onclick="showPage('markets')"><span>🏠</span><p>Home</p></div>
    <div class="nav-item" onclick="showDeposit()"><span>💰</span><p>Deposit</p></div>
    <div class="nav-item" onclick="showWithdraw()"><span>💸</span><p>Withdraw</p></div>
    <div class="nav-item" onclick="showPage('profile')"><span>👤</span><p>Profile</p></div>
</div>

<!-- Deposit Modal -->
<div id="depositModal" class="modal">
    <div class="modal-content">
        <h3>💰 Deposit Money</h3>
        <div class="amount-options">
            <div class="amount-chip" onclick="selectAmount(200)">₹200</div>
            <div class="amount-chip" onclick="selectAmount(500)">₹500</div>
            <div class="amount-chip" onclick="selectAmount(1000)">₹1000</div>
            <div class="amount-chip" onclick="selectAmount(5000)">₹5000</div>
        </div>
        <input type="number" id="customAmount" placeholder="Enter amount (Min ₹200)">
        <button id="depositBtn">Request Deposit</button>
        <div id="depositMsg" style="margin-top:10px; font-size:12px;"></div>
        <button onclick="closeDeposit()" style="background:#333; margin-top:10px">Cancel</button>
    </div>
</div>

<!-- Withdraw Modal -->
<div id="withdrawModal" class="modal">
    <div class="modal-content">
        <h3>💸 Withdraw Money</h3>
        <select id="bankSelect"></select>
        <input type="number" id="withdrawAmount" placeholder="Amount (Min ₹500)">
        <button id="withdrawBtn">Request Withdrawal</button>
        <div id="withdrawMsg" style="margin-top:10px; font-size:12px;"></div>
        <button onclick="closeWithdraw()" style="background:#333; margin-top:10px">Cancel</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBeGpb7V0i5GN1opY9JECHxQIGvHFDPX38",
        authDomain: "win777-ed482.firebaseapp.com",
        projectId: "win777-ed482",
        storageBucket: "win777-ed482.firebasestorage.app",
        messagingSenderId: "843686112399",
        appId: "1:843686112399:web:9c20a96831e6a94cd814fa"
    };
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    
    let currentUser = null;
    let userData = null;
    let markets = [];
    let selectedAmount = 200;
    
    // ============ MARKETS ============
    async function loadMarkets() {
        try {
            const snapshot = await db.collection('markets').get();
            markets = [];
            snapshot.forEach(doc => markets.push({ id: doc.id, ...doc.data() }));
            renderMarkets();
        } catch (error) {
            console.error('Error loading markets:', error);
        }
    }
    
    function renderMarkets() {
        let html = '';
        if (markets.length === 0) {
            html = '<div class="market-card"><p class="no-data">No markets available. Admin will add soon.</p></div>';
        } else {
            for (let m of markets) {
                let statusClass = '', statusText = '', disabled = false;
                if (m.status === 'open') {
                    statusClass = 'status-open';
                    statusText = '🟢 OPEN - All Bets';
                    disabled = false;
                } else if (m.status === 'close') {
                    statusClass = 'status-close';
                    statusText = '🟡 CLOSE - Close Bets Only';
                    disabled = false;
                } else {
                    statusClass = 'status-closed';
                    statusText = '🔴 CLOSED';
                    disabled = true;
                }
                html += `
                    <div class="market-card">
                        <div class="market-name">${m.name || 'Unnamed'}</div>
                        <div class="market-result">Result: ${m.result || '***-**-***'}</div>
                        <div><span class="market-status ${statusClass}">${statusText}</span></div>
                        <button class="play-btn" ${disabled ? 'disabled' : ''} onclick="playMarket('${m.name}', '${m.status}')">
                            ${disabled ? 'CLOSED' : 'PLAY NOW'}
                        </button>
                    </div>
                `;
            }
        }
        document.getElementById('marketsPage').innerHTML = html;
    }
    
    function playMarket(name, status) {
        window.location.href = `betting.html?market=${encodeURIComponent(name)}&status=${status}`;
    }
    
    // ============ USER DATA ============
    async function loadUserData() {
        const user = auth.currentUser;
        if (!user) return;
        currentUser = user;
        
        try {
            const doc = await db.collection('users').doc(user.uid).get();
            if (doc.exists) {
                userData = doc.data();
                document.getElementById('userBalance').innerText = userData?.balance || 0;
                document.getElementById('profileName').innerHTML = `👤 ${userData?.name || 'User'}`;
                document.getElementById('profilePhone').innerHTML = `📞 ${userData?.phone || ''}`;
                document.getElementById('profileBalance').innerHTML = `💰 Balance: ₹${userData?.balance || 0}`;
                
                if (userData?.bankDetails) {
                    document.getElementById('accName').value = userData.bankDetails.accName || '';
                    document.getElementById('bankName').value = userData.bankDetails.bankName || '';
                    document.getElementById('accNumber').value = userData.bankDetails.accNumber || '';
                    document.getElementById('ifsc').value = userData.bankDetails.ifsc || '';
                }
            }
        } catch (error) {
            console.error('Error loading user:', error);
        }
    }
    
    // ============ BID HISTORY ============
    async function loadBidHistory() {
        if (!currentUser) return;
        try {
            const bids = await db.collection('bids')
                .where('userId', '==', currentUser.uid)
                .orderBy('createdAt', 'desc')
                .get();
            
            let html = '';
            if (bids.empty) {
                html = '<div class="no-data">No bids placed yet</div>';
            } else {
                html = `<table>
                    <thead>
                        <tr><th>Market</th><th>Type</th><th>Value</th><th>Points</th><th>Status</th></tr>
                    </thead>
                    <tbody>`;
                bids.forEach(doc => {
                    const b = doc.data();
                    html += `<tr>
                        <td>${b.market || '-'}</td>
                        <td>${b.gameType || '-'}</td>
                        <td>${b.value || '-'}</td>
                        <td>${b.points || '-'}</td>
                        <td>${b.status || 'Pending'}</td>
                    </tr>`;
                });
                html += `</tbody></table>`;
            }
            document.getElementById('bidHistoryList').innerHTML = html;
        } catch (error) {
            console.error('Error loading bids:', error);
            document.getElementById('bidHistoryList').innerHTML = '<div class="no-data">Error loading bid history</div>';
        }
    }
    
    // ============ TRANSACTION HISTORY ============
    async function loadTransactionHistory() {
        if (!currentUser) return;
        try {
            const transactions = await db.collection('transactions')
                .where('userId', '==', currentUser.uid)
                .orderBy('date', 'desc')
                .get();
            
            let html = '';
            if (transactions.empty) {
                html = '<div class="no-data">No transactions yet</div>';
            } else {
                html = `<table>
                    <thead>
                        <tr><th>Type</th><th>Amount</th><th>Status</th><th>Date</th></tr>
                    </thead>
                    <tbody>`;
                transactions.forEach(doc => {
                    const t = doc.data();
                    let statusColor = '#ff9800';
                    if (t.status === 'Completed') statusColor = '#4caf50';
                    if (t.status === 'Rejected') statusColor = '#f44336';
                    html += `<tr>
                        <td>${t.type === 'credit' ? 'Deposit' : 'Withdraw'}</td>
                        <td>₹${t.amount}</td>
                        <td style="color: ${statusColor}">${t.status || 'Pending'}</td>
                        <td>${t.date?.toDate().toLocaleString() || 'Pending'}</td>
                    </tr>`;
                });
                html += `</tbody></table>`;
            }
            document.getElementById('transactionsList').innerHTML = html;
        } catch (error) {
            console.error('Error loading transactions:', error);
            document.getElementById('transactionsList').innerHTML = '<div class="no-data">Error loading transaction history</div>';
        }
    }
    
    // ============ BANK DETAILS ============
    document.getElementById('saveBankBtn').onclick = async () => {
        const bank = {
            accName: document.getElementById('accName').value,
            bankName: document.getElementById('bankName').value,
            accNumber: document.getElementById('accNumber').value,
            ifsc: document.getElementById('ifsc').value
        };
        if (!bank.accName || !bank.bankName || !bank.accNumber || !bank.ifsc) {
            document.getElementById('bankMsg').innerHTML = '❌ Please fill all fields';
            document.getElementById('bankMsg').style.color = '#f44336';
            setTimeout(() => document.getElementById('bankMsg').innerHTML = '', 3000);
            return;
        }
        try {
            await db.collection('users').doc(currentUser.uid).update({ bankDetails: bank });
            document.getElementById('bankMsg').innerHTML = '✅ Bank details saved!';
            document.getElementById('bankMsg').style.color = '#4caf50';
            setTimeout(() => document.getElementById('bankMsg').innerHTML = '', 3000);
        } catch (error) {
            alert('Error: ' + error.message);
        }
    };
    
    // ============ DEPOSIT ============
    function selectAmount(amt) {
        selectedAmount = amt;
        document.querySelectorAll('.amount-chip').forEach(chip => chip.classList.remove('active'));
        event.target.classList.add('active');
    }
    
    function showDeposit() {
        document.getElementById('depositModal').style.display = 'flex';
        document.getElementById('depositMsg').innerHTML = '';
    }
    
    function closeDeposit() {
        document.getElementById('depositModal').style.display = 'none';
    }
    
    document.getElementById('depositBtn').onclick = async () => {
        let amount = selectedAmount;
        const custom = parseInt(document.getElementById('customAmount').value);
        if (custom >= 200) amount = custom;
        if (amount < 200) {
            document.getElementById('depositMsg').innerHTML = '❌ Minimum deposit is ₹200';
            document.getElementById('depositMsg').style.color = '#f44336';
            return;
        }
        if (amount > 50000) {
            document.getElementById('depositMsg').innerHTML = '❌ Maximum deposit is ₹50000';
            document.getElementById('depositMsg').style.color = '#f44336';
            return;
        }
        
        document.getElementById('depositMsg').innerHTML = '⏳ Creating deposit request...';
        document.getElementById('depositMsg').style.color = '#ff9800';
        
        try {
            await db.collection('transactions').add({
                userId: currentUser.uid,
                type: 'credit',
                amount: amount,
                status: 'Pending',
                date: new Date()
            });
            document.getElementById('depositMsg').innerHTML = '✅ Deposit request created! Admin will approve after payment.';
            document.getElementById('depositMsg').style.color = '#4caf50';
            
            // Show UPI intent
            setTimeout(() => {
                const upiUrl = `upi://pay?pa=win777@okhdfcbank&pn=WIN777&am=${amount}&cu=INR`;
                if (confirm(`Pay ₹${amount} using UPI? Click OK to open UPI app.`)) {
                    window.open(upiUrl, '_blank');
                }
            }, 1000);
            
            setTimeout(() => {
                closeDeposit();
                loadTransactionHistory();
            }, 3000);
        } catch (error) {
            document.getElementById('depositMsg').innerHTML = '❌ Error: ' + error.message;
            document.getElementById('depositMsg').style.color = '#f44336';
        }
    };
    
    // ============ WITHDRAW ============
    async function showWithdraw() {
        if (!userData?.bankDetails) {
            alert('Please add bank details first in Profile > Bank Details');
            showPage('bank');
            return;
        }
        const select = document.getElementById('bankSelect');
        select.innerHTML = '';
        select.innerHTML += `<option value="saved">${userData.bankDetails.bankName} - ${userData.bankDetails.accNumber}</option>`;
        select.innerHTML += `<option value="new">+ Add New Bank</option>`;
        document.getElementById('withdrawModal').style.display = 'flex';
        document.getElementById('withdrawMsg').innerHTML = '';
    }
    
    function closeWithdraw() {
        document.getElementById('withdrawModal').style.display = 'none';
    }
    
    document.getElementById('withdrawBtn').onclick = async () => {
        const amount = parseInt(document.getElementById('withdrawAmount').value);
        if (amount < 500) {
            document.getElementById('withdrawMsg').innerHTML = '❌ Minimum withdrawal is ₹500';
            document.getElementById('withdrawMsg').style.color = '#f44336';
            return;
        }
        if (amount > (userData?.balance || 0)) {
            document.getElementById('withdrawMsg').innerHTML = `❌ Insufficient balance! Your balance is ₹${userData?.balance || 0}`;
            document.getElementById('withdrawMsg').style.color = '#f44336';
            return;
        }
        
        let bankDetails = userData.bankDetails;
        if (document.getElementById('bankSelect').value === 'new') {
            bankDetails = {
                accName: prompt('Enter Account Holder Name'),
                bankName: prompt('Enter Bank Name'),
                accNumber: prompt('Enter Account Number'),
                ifsc: prompt('Enter IFSC Code')
            };
            if (!bankDetails.accName) return;
        }
        
        document.getElementById('withdrawMsg').innerHTML = '⏳ Sending withdrawal request...';
        document.getElementById('withdrawMsg').style.color = '#ff9800';
        
        try {
            await db.collection('withdrawRequests').add({
                userId: currentUser.uid,
                amount: amount,
                bankDetails: bankDetails,
                status: 'Pending',
                date: new Date()
            });
            await db.collection('transactions').add({
                userId: currentUser.uid,
                type: 'debit',
                amount: amount,
                status: 'Pending',
                date: new Date()
            });
            document.getElementById('withdrawMsg').innerHTML = '✅ Withdrawal request sent! Admin will approve.';
            document.getElementById('withdrawMsg').style.color = '#4caf50';
            
            setTimeout(() => {
                closeWithdraw();
                loadTransactionHistory();
            }, 2000);
        } catch (error) {
            document.getElementById('withdrawMsg').innerHTML = '❌ Error: ' + error.message;
            document.getElementById('withdrawMsg').style.color = '#f44336';
        }
    };
    
    // ============ UI NAVIGATION ============
    function showPage(page) {
        document.getElementById('marketsPage').classList.add('hidden');
        document.getElementById('profilePage').classList.add('hidden');
        document.getElementById('bankPage').classList.add('hidden');
        document.getElementById('historyPage').classList.add('hidden');
        document.getElementById('transactionsPage').classList.add('hidden');
        
        document.getElementById(page + 'Page').classList.remove('hidden');
        
        if (page === 'history') loadBidHistory();
        if (page === 'transactions') loadTransactionHistory();
        
        closeSidebar();
    }
    
    function closeSidebar() {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('overlay').classList.remove('active');
    }
    
    document.getElementById('menuBtn').onclick = () => {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('overlay').classList.toggle('active');
    };
    document.getElementById('overlay').onclick = closeSidebar;
    
    document.getElementById('logoutBtn').onclick = async () => {
        await auth.signOut();
        window.location.href = 'index.html';
    };
    
    // ============ INITIALIZE ============
    auth.onAuthStateChanged(async (user) => {
        if (!user) {
            window.location.href = 'index.html';
        } else {
            await loadUserData();
            await loadMarkets();
            setInterval(loadMarkets, 30000);
        }
    });
</script>
</body>
</html>
