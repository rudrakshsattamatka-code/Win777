<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WIN777 - Dashboard</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: #0a0a0f; padding-bottom: 70px; }
        .header { background: #1a1a2e; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; border-bottom: 1px solid #0096ff; z-index: 100; }
        .logo { color: #0096ff; font-size: 22px; font-weight: bold; }
        .balance { background: #0096ff; padding: 5px 15px; border-radius: 30px; color: white; font-weight: bold; }
        .menu-btn { background: none; border: none; color: #0096ff; font-size: 24px; cursor: pointer; }
        .sidebar { position: fixed; left: -260px; top: 0; width: 260px; height: 100%; background: #1a1a2e; transition: 0.3s; z-index: 1000; border-right: 1px solid #0096ff; overflow-y: auto; }
        .sidebar.open { left: 0; }
        .sidebar-header { padding: 20px; text-align: center; border-bottom: 1px solid #0096ff; }
        .sidebar-header h2 { color: #0096ff; }
        .sidebar-item { padding: 15px 20px; display: flex; align-items: center; gap: 12px; color: #ccc; cursor: pointer; border-bottom: 1px solid #222; }
        .sidebar-item:hover { background: #0096ff20; color: #0096ff; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; display: none; }
        .overlay.active { display: block; }
        .container { max-width: 500px; margin: 0 auto; padding: 15px; }
        .market-card { background: #1a1a2e; border-radius: 16px; padding: 15px; margin-bottom: 12px; border: 1px solid #0096ff; }
        .market-name { color: #0096ff; font-weight: bold; font-size: 16px; }
        .market-result { color: #ff9800; font-size: 12px; margin-top: 5px; }
        .market-status { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; margin: 10px 0; }
        .status-open { background: #4caf5020; color: #4caf50; border: 1px solid #4caf50; }
        .status-close { background: #ff980020; color: #ff9800; border: 1px solid #ff9800; }
        .status-closed { background: #f4433620; color: #f44336; border: 1px solid #f44336; }
        .play-btn { width: 100%; padding: 10px; background: #0096ff; border: none; border-radius: 10px; color: white; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .play-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #1a1a2e; display: flex; justify-content: space-around; padding: 10px; border-top: 1px solid #0096ff; z-index: 100; }
        .nav-item { text-align: center; color: #aaa; cursor: pointer; font-size: 11px; }
        .nav-item.active { color: #0096ff; }
        .nav-item span { font-size: 22px; display: block; }
        .card { background: #1a1a2e; border-radius: 16px; padding: 15px; margin-bottom: 15px; border: 1px solid #0096ff; }
        .card-title { color: #0096ff; margin-bottom: 12px; font-weight: bold; font-size: 16px; border-left: 3px solid #0096ff; padding-left: 10px; }
        input, select { width: 100%; padding: 10px; margin: 5px 0; background: #0a0a0f; border: 1px solid #0096ff; border-radius: 8px; color: white; }
        button { background: #0096ff; padding: 10px; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; }
        .bid-card { background: #1a1a2e; border-radius: 20px; padding: 16px; margin-bottom: 15px; border: 1px solid #0096ff; position: relative; overflow: hidden; }
        .bid-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: linear-gradient(180deg, #0096ff, #00ffaa); }
        .bid-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
        .bid-market { font-size: 16px; font-weight: bold; color: #0096ff; }
        .bid-type { font-size: 12px; color: #ff9800; background: rgba(255,152,0,0.1); padding: 4px 10px; border-radius: 20px; }
        .bid-id { font-size: 11px; color: #666; font-family: monospace; margin-bottom: 12px; word-break: break-all; }
        .bid-details { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 10px; }
        .bid-digit { font-size: 32px; font-weight: bold; color: #00ffaa; }
        .bid-points { font-size: 18px; font-weight: bold; color: white; }
        .bid-info { display: flex; justify-content: space-between; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
        .bid-date { font-size: 11px; color: #888; }
        .bid-status { margin-top: 12px; padding: 8px; border-radius: 12px; text-align: center; font-size: 13px; font-weight: bold; }
        .status-won { background: #4caf5020; color: #4caf50; border: 1px solid #4caf50; }
        .status-lost { background: #f4433620; color: #f44336; border: 1px solid #f44336; }
        .status-pending { background: #ff980020; color: #ff9800; border: 1px solid #ff9800; }
        .no-data { color: #888; text-align: center; padding: 30px; }
        .data-table { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #0096ff; color: #ddd; font-size: 12px; }
        th { color: #0096ff; }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="header">
    <button class="menu-btn" id="menuBtn">☰</button>
    <div class="logo">WIN777</div>
    <div class="balance">💰 ₹<span id="userBalance">0</span></div>
</div>

<div class="sidebar" id="sidebar">
    <div class="sidebar-header"><h2>WIN777</h2></div>
    <div class="sidebar-item" onclick="showPage('markets')">🎮 Markets</div>
    <div class="sidebar-item" onclick="showPage('profile')">👤 Profile</div>
    <div class="sidebar-item" onclick="showPage('bank')">🏦 Bank Details</div>
    <div class="sidebar-item" onclick="showPage('history')">📋 Bid History</div>
    <div class="sidebar-item" onclick="showPage('transactions')">📊 Transactions</div>
    <div class="sidebar-item" onclick="window.location.href='funds.html'">🏦 Funds</div>
    <div class="sidebar-item" id="logoutBtn">🚪 Logout</div>
</div>
<div class="overlay" id="overlay"></div>

<div class="container">
    <div id="marketsPage"></div>
    
    <div id="profilePage" class="hidden">
        <div class="card">
            <div class="card-title">My Profile</div>
            <p id="profileName" style="color:white; margin:5px 0"></p>
            <p id="profilePhone" style="color:#aaa; margin:5px 0"></p>
            <p id="profileBalance" style="color:#0096ff; font-size:18px; font-weight:bold; margin:5px 0"></p>
        </div>
    </div>
    
    <div id="bankPage" class="hidden">
        <div class="card">
            <div class="card-title">Bank Details</div>
            <input type="text" id="accName" placeholder="Account Holder Name">
            <input type="text" id="bankName" placeholder="Bank Name">
            <input type="text" id="accNumber" placeholder="Account Number">
            <input type="text" id="ifsc" placeholder="IFSC Code">
            <button id="saveBankBtn">Save Bank Details</button>
            <div id="bankMsg" style="color:#4caf50; margin-top:8px;"></div>
        </div>
    </div>
    
    <div id="historyPage" class="hidden">
        <div class="card">
            <div class="card-title">📋 Bid History</div>
            <div id="bidHistoryList"></div>
        </div>
    </div>
    
    <div id="transactionsPage" class="hidden">
        <div class="card">
            <div class="card-title">📊 Transaction History</div>
            <div id="transactionsList" class="data-table"></div>
        </div>
    </div>
</div>

<div class="bottom-nav">
    <div class="nav-item active" onclick="showPage('markets')"><span>🏠</span><p>Home</p></div>
    <div class="nav-item" onclick="window.location.href='deposit.html'"><span>💰</span><p>Deposit</p></div>
    <div class="nav-item" onclick="window.location.href='withdraw.html'"><span>💸</span><p>Withdraw</p></div>
    <div class="nav-item" onclick="showPage('profile')"><span>👤</span><p>Profile</p></div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBeGpb7V0i5GN1opY9JECHxQIGvHFDPX38",
        authDomain: "win777-ed482.firebaseapp.com",
        projectId: "win777-ed482",
        storageBucket: "win777-ed482.firebasestorage.app",
        messagingSenderId: "843686112399",
        appId: "1:843686112399:web:9c20a96831e6a94cd814fa"
    };
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    
    let currentUser = null;
    let userData = null;
    let markets = [];
    
    async function loadMarkets() {
        try {
            const snapshot = await db.collection('markets').get();
            markets = [];
            snapshot.forEach(doc => markets.push({ id: doc.id, ...doc.data() }));
            renderMarkets();
        } catch (error) { console.error(error); }
    }
    
    function renderMarkets() {
        let html = '';
        if (markets.length === 0) {
            html = '<div class="market-card"><p class="no-data">No markets available.</p></div>';
        } else {
            for (let m of markets) {
                let statusClass = '', statusText = '', disabled = false;
                if (m.status === 'open') { statusClass = 'status-open'; statusText = '🟢 OPEN - All Bets'; disabled = false; }
                else if (m.status === 'close') { statusClass = 'status-close'; statusText = '🟡 CLOSE - Close Bets Only'; disabled = false; }
                else { statusClass = 'status-closed'; statusText = '🔴 CLOSED'; disabled = true; }
                html += `<div class="market-card"><div class="market-name">${m.name}</div><div class="market-result">Result: ${m.result || '***-**-***'}</div><div><span class="market-status ${statusClass}">${statusText}</span></div><button class="play-btn" ${disabled ? 'disabled' : ''} onclick="playMarket('${m.name}', '${m.status}')">${disabled ? 'CLOSED' : 'PLAY NOW'}</button></div>`;
            }
        }
        document.getElementById('marketsPage').innerHTML = html;
    }
    
    function playMarket(name, status) {
        window.location.href = `betting.html?market=${encodeURIComponent(name)}&status=${status}`;
    }
    
    async function loadUserData() {
        const user = auth.currentUser;
        if (!user) return;
        currentUser = user;
        
        try {
            const doc = await db.collection('users').doc(user.uid).get();
            if (doc.exists) {
                userData = doc.data();
                // FIX: Convert balance to NUMBER
                let balance = Number(userData?.balance);
                if (isNaN(balance)) balance = 0;
                document.getElementById('userBalance').innerText = balance;
                document.getElementById('profileName').innerHTML = `👤 ${userData?.name || 'User'}`;
                document.getElementById('profilePhone').innerHTML = `📞 ${userData?.phone || ''}`;
                document.getElementById('profileBalance').innerHTML = `💰 Balance: ₹${balance}`;
                
                if (userData?.bankDetails) {
                    document.getElementById('accName').value = userData.bankDetails.accName || '';
                    document.getElementById('bankName').value = userData.bankDetails.bankName || '';
                    document.getElementById('accNumber').value = userData.bankDetails.accNumber || '';
                    document.getElementById('ifsc').value = userData.bankDetails.ifsc || '';
                }
            }
        } catch (error) { console.error(error); }
    }
    
    async function loadBidHistory() {
        if (!currentUser) return;
        try {
            const bids = await db.collection('bids').where('userId', '==', currentUser.uid).get();
            let bidsArray = [];
            bids.forEach(doc => bidsArray.push({ id: doc.id, ...doc.data() }));
            bidsArray.sort((a, b) => {
                let dateA = a.createdAt?.toDate ? a.createdAt.toDate() : new Date(0);
                let dateB = b.createdAt?.toDate ? b.createdAt.toDate() : new Date(0);
                return dateB - dateA;
            });
            
            let html = '';
            if (bidsArray.length === 0) {
                html = '<div class="no-data">No bids placed yet</div>';
            } else {
                for (let bid of bidsArray) {
                    const bidDate = bid.createdAt?.toDate ? bid.createdAt.toDate() : new Date();
                    const formattedDate = bidDate.toLocaleDateString('en-IN', { weekday: 'long', year: 'numeric', month: 'numeric', day: 'numeric' });
                    const formattedTime = bidDate.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
                    let statusClass = 'status-pending', statusText = 'Pending';
                    if (bid.status === 'won') { statusClass = 'status-won'; statusText = '🎉 You Won!'; }
                    else if (bid.status === 'lost') { statusClass = 'status-lost'; statusText = 'Better Luck Next Time!!!'; }
                    else { statusText = '⏳ Pending Result'; }
                    html += `<div class="bid-card"><div class="bid-header"><span class="bid-market">${bid.market || 'Unknown'}</span><span class="bid-type">${bid.gameType || 'Unknown'}${bid.bidType ? ',' + bid.bidType.toUpperCase() : ''}</span></div><div class="bid-id">Bid ID: ${bid.id.substring(0, 10)}...</div><div class="bid-details"><div class="bid-digit">${bid.value || '-'}</div><div class="bid-points">Points: ${bid.points || 0}</div></div><div class="bid-info"><div class="bid-date">📅 ${formattedDate}</div><div class="bid-date">🎲 PLAY FOR: ${formattedDate}</div></div><div class="bid-info"><div class="bid-date">⏰ Bid Time: ${formattedTime}</div></div><div class="bid-status ${statusClass}">${statusText}</div></div>`;
                }
            }
            document.getElementById('bidHistoryList').innerHTML = html;
        } catch (error) { console.error(error); }
    }
    
    async function loadTransactionHistory() {
        if (!currentUser) return;
        try {
            const transactions = await db.collection('transactions').where('userId', '==', currentUser.uid).get();
            let transArray = [];
            transactions.forEach(doc => transArray.push({ id: doc.id, ...doc.data() }));
            transArray.sort((a, b) => {
                let dateA = a.date?.toDate ? a.date.toDate() : new Date(0);
                let dateB = b.date?.toDate ? b.date.toDate() : new Date(0);
                return dateB - dateA;
            });
            
            let html = '';
            if (transArray.length === 0) {
                html = '<div class="no-data">No transactions yet</div>';
            } else {
                html = `ables<thead><tr><th>Type</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead><tbody>`;
                for (let t of transArray) {
                    let statusColor = '#ff9800';
                    if (t.status === 'Completed') statusColor = '#4caf50';
                    if (t.status === 'Rejected') statusColor = '#f44336';
                    html += `<tr><td>${t.type === 'credit' ? 'Deposit' : 'Withdraw'}</td><td>₹${Number(t.amount) || 0}</td><td style="color: ${statusColor}">${t.status || 'Pending'}</td><td>${t.date?.toDate ? t.date.toDate().toLocaleString() : 'Pending'}</td></tr>`;
                }
                html += `</tbody></table>`;
            }
            document.getElementById('transactionsList').innerHTML = html;
        } catch (error) { console.error(error); }
    }
    
    document.getElementById('saveBankBtn').onclick = async () => {
        const bank = {
            accName: document.getElementById('accName').value,
            bankName: document.getElementById('bankName').value,
            accNumber: document.getElementById('accNumber').value,
            ifsc: document.getElementById('ifsc').value
        };
        if (!bank.accName || !bank.bankName || !bank.accNumber || !bank.ifsc) {
            document.getElementById('bankMsg').innerHTML = '❌ Please fill all fields';
            document.getElementById('bankMsg').style.color = '#f44336';
            setTimeout(() => document.getElementById('bankMsg').innerHTML = '', 3000);
            return;
        }
        try {
            await db.collection('users').doc(currentUser.uid).update({ bankDetails: bank });
            document.getElementById('bankMsg').innerHTML = '✅ Bank details saved!';
            document.getElementById('bankMsg').style.color = '#4caf50';
            setTimeout(() => document.getElementById('bankMsg').innerHTML = '', 3000);
        } catch (error) { alert('Error: ' + error.message); }
    };
    
    function showPage(page) {
        document.getElementById('marketsPage').classList.add('hidden');
        document.getElementById('profilePage').classList.add('hidden');
        document.getElementById('bankPage').classList.add('hidden');
        document.getElementById('historyPage').classList.add('hidden');
        document.getElementById('transactionsPage').classList.add('hidden');
        document.getElementById(page + 'Page').classList.remove('hidden');
        if (page === 'history') loadBidHistory();
        if (page === 'transactions') loadTransactionHistory();
        closeSidebar();
    }
    
    function closeSidebar() {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('overlay').classList.remove('active');
    }
    
    document.getElementById('menuBtn').onclick = () => {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('overlay').classList.toggle('active');
    };
    document.getElementById('overlay').onclick = closeSidebar;
    document.getElementById('logoutBtn').onclick = async () => {
        await auth.signOut();
        window.location.href = 'index.html';
    };
    
    setInterval(() => { if (currentUser) loadUserData(); }, 5000);
    
    auth.onAuthStateChanged(async (user) => {
        if (!user) window.location.href = 'index.html';
        else { await loadUserData(); await loadMarkets(); setInterval(loadMarkets, 30000); }
    });
</script>
</body>
</html>
