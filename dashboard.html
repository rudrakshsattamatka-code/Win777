<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WIN777 - Dashboard</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
        body{background:#0a0a0f;padding-bottom:70px}
        .header{background:#1a1a2e;padding:15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #0096ff}
        .logo{color:#0096ff;font-size:20px;font-weight:bold}
        .balance{background:#0096ff;padding:5px 15px;border-radius:20px;color:white}
        .menu-btn{background:none;border:none;color:#0096ff;font-size:24px;cursor:pointer}
        .sidebar{position:fixed;left:-250px;top:0;width:250px;height:100%;background:#1a1a2e;transition:0.3s;z-index:1000;border-right:1px solid #0096ff}
        .sidebar.open{left:0}
        .sidebar-item{padding:15px 20px;color:#ccc;cursor:pointer;border-bottom:1px solid #222}
        .sidebar-item:hover{background:#0096ff20;color:#0096ff}
        .overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:999;display:none}
        .overlay.active{display:block}
        .container{max-width:500px;margin:0 auto;padding:15px}
        .market-card{background:#1a1a2e;border-radius:12px;padding:15px;margin-bottom:12px;border:1px solid #0096ff}
        .market-name{color:#0096ff;font-weight:bold;font-size:16px}
        .market-result{color:#ff9800;font-size:12px;margin-top:5px}
        .market-status{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;margin:10px 0}
        .status-open{background:#4caf5020;color:#4caf50;border:1px solid #4caf50}
        .status-close{background:#ff980020;color:#ff9800;border:1px solid #ff9800}
        .status-closed{background:#f4433620;color:#f44336;border:1px solid #f44336}
        .play-btn{width:100%;padding:10px;background:#0096ff;border:none;border-radius:10px;color:white;cursor:pointer;margin-top:10px}
        .play-btn:disabled{opacity:0.5;cursor:not-allowed}
        .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#1a1a2e;display:flex;justify-content:space-around;padding:10px;border-top:1px solid #0096ff}
        .nav-item{text-align:center;color:#aaa;cursor:pointer;font-size:11px}
        .nav-item.active{color:#0096ff}
        .nav-item span{font-size:22px;display:block}
        .card{background:#1a1a2e;border-radius:12px;padding:15px;margin-bottom:15px;border:1px solid #0096ff}
        .card-title{color:#0096ff;margin-bottom:10px;font-weight:bold}
        input,select{width:100%;padding:10px;margin:5px 0;background:#0a0a0f;border:1px solid #0096ff;border-radius:8px;color:white}
        button{background:#0096ff;padding:10px;border:none;border-radius:8px;color:white;cursor:pointer}
        table{width:100%;border-collapse:collapse}
        th,td{padding:8px;text-align:left;border-bottom:1px solid #0096ff;color:#ddd;font-size:12px}
        th{color:#0096ff}
        .hidden{display:none}
        .amount-options{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
        .amount-chip{background:#0a0a0f;border:1px solid #0096ff;padding:8px 15px;border-radius:30px;cursor:pointer;color:white}
        .amount-chip.active{background:#0096ff;color:white}
        .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:2000;justify-content:center;align-items:center}
        .modal-content{background:#1a1a2e;border-radius:20px;padding:20px;width:90%;max-width:350px;border:1px solid #0096ff}
        .modal-content h3{color:#0096ff;margin-bottom:15px}
    </style>
</head>
<body>
<div class="header"><button class="menu-btn" id="menuBtn">☰</button><div class="logo">WIN777</div><div class="balance">💰 ₹<span id="userBalance">0</span></div></div>
<div class="sidebar" id="sidebar"><div class="sidebar-item" onclick="showPage('markets')">🎮 Markets</div><div class="sidebar-item" onclick="showPage('profile')">👤 Profile</div><div class="sidebar-item" onclick="showPage('bank')">🏦 Bank Details</div><div class="sidebar-item" onclick="showPage('history')">📋 Bid History</div><div class="sidebar-item" onclick="showPage('transactions')">📊 Transactions</div><div class="sidebar-item" id="logoutBtn">🚪 Logout</div></div>
<div class="overlay" id="overlay"></div>
<div class="container">
    <div id="marketsPage"></div>
    <div id="profilePage" class="hidden"><div class="card"><div class="card-title">My Profile</div><p id="profileName"></p><p id="profilePhone"></p><p id="profileBalance"></p></div></div>
    <div id="bankPage" class="hidden"><div class="card"><div class="card-title">Bank Details</div><input type="text" id="accName" placeholder="Account Holder Name"><input type="text" id="bankName" placeholder="Bank Name"><input type="text" id="accNumber" placeholder="Account Number"><input type="text" id="ifsc" placeholder="IFSC Code"><button id="saveBankBtn">Save Bank Details</button><div id="bankMsg" style="color:#4caf50;margin-top:8px"></div></div></div>
    <div id="historyPage" class="hidden"><div class="card"><div class="card-title">Bid History</div><div id="bidList"></div></div></div>
    <div id="transactionsPage" class="hidden"><div class="card"><div class="card-title">Transaction History</div><div id="transList"></div></div></div>
</div>
<div class="bottom-nav"><div class="nav-item active" onclick="showPage('markets')"><span>🏠</span><p>Home</p></div><div class="nav-item" onclick="showDeposit()"><span>💰</span><p>Deposit</p></div><div class="nav-item" onclick="showWithdraw()"><span>💸</span><p>Withdraw</p></div><div class="nav-item" onclick="showPage('profile')"><span>👤</span><p>Profile</p></div></div>

<!-- Deposit Modal -->
<div id="depositModal" class="modal">
    <div class="modal-content">
        <h3>💰 Deposit Money</h3>
        <div class="amount-options">
            <div class="amount-chip" onclick="selectAmount(200)">₹200</div>
            <div class="amount-chip" onclick="selectAmount(500)">₹500</div>
            <div class="amount-chip" onclick="selectAmount(1000)">₹1000</div>
            <div class="amount-chip" onclick="selectAmount(5000)">₹5000</div>
        </div>
        <input type="number" id="customAmount" placeholder="Or enter amount (Min ₹200)">
        <button id="depositRequestBtn">Request Deposit</button>
        <div id="depositMsg" style="margin-top:10px;font-size:12px;color:#ff9800"></div>
        <button onclick="closeDeposit()" style="background:#333;margin-top:10px">Cancel</button>
    </div>
</div>

<!-- Withdraw Modal -->
<div id="withdrawModal" class="modal">
    <div class="modal-content">
        <h3>💸 Withdraw Money</h3>
        <select id="bankSelect">
            <option value="">Select Bank Account</option>
        </select>
        <input type="number" id="withdrawAmount" placeholder="Amount (Min ₹500)">
        <button id="withdrawRequestBtn">Request Withdrawal</button>
        <div id="withdrawMsg" style="margin-top:10px;font-size:12px;color:#ff9800"></div>
        <button onclick="closeWithdraw()" style="background:#333;margin-top:10px">Cancel</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBeGpb7V0i5GN1opY9JECHxQIGvHFDPX38",
        authDomain: "win777-ed482.firebaseapp.com",
        projectId: "win777-ed482",
        storageBucket: "win777-ed482.firebasestorage.app",
        messagingSenderId: "843686112399",
        appId: "1:843686112399:web:9c20a96831e6a94cd814fa"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    let currentUser = null;
    let userData = null;
    let markets = [];
    let selectedAmount = 200;

    async function loadMarkets(){
        let snap = await db.collection('markets').get();
        markets = [];
        snap.forEach(doc => markets.push({id:doc.id, ...doc.data()}));
        renderMarkets();
    }
    
    function renderMarkets(){
        let html = '';
        if(markets.length === 0){
            document.getElementById('marketsPage').innerHTML = '<div class="market-card"><p style="color:#aaa;text-align:center">No markets. Admin will add soon.</p></div>';
            return;
        }
        for(let m of markets){
            let statusClass = '', statusText = '', disabled = false;
            if(m.status === 'open'){ statusClass = 'status-open'; statusText = '🟢 OPEN - All Bets'; disabled = false; }
            else if(m.status === 'close'){ statusClass = 'status-close'; statusText = '🟡 CLOSE - Close Bets Only'; disabled = false; }
            else{ statusClass = 'status-closed'; statusText = '🔴 CLOSED'; disabled = true; }
            html += `<div class="market-card">
                <div class="market-name">${m.name}</div>
                <div class="market-result">Result: ${m.result || '***-**-***'}</div>
                <div><span class="market-status ${statusClass}">${statusText}</span></div>
                <button class="play-btn" ${disabled ? 'disabled' : ''} onclick="playMarket('${m.name}','${m.status}')">${disabled ? 'CLOSED' : 'PLAY NOW'}</button>
            </div>`;
        }
        document.getElementById('marketsPage').innerHTML = html;
    }
    
    function playMarket(name, status){
        window.location.href = `betting.html?market=${encodeURIComponent(name)}&status=${status}`;
    }
    
    async function loadUser(){
        let user = auth.currentUser;
        if(!user) return;
        currentUser = user;
        let doc = await db.collection('users').doc(user.uid).get();
        userData = doc.data();
        document.getElementById('userBalance').innerText = userData?.balance || 0;
        document.getElementById('profileName').innerHTML = `👤 ${userData?.name || 'User'}`;
        document.getElementById('profilePhone').innerHTML = `📞 ${userData?.phone || ''}`;
        document.getElementById('profileBalance').innerHTML = `💰 Balance: ₹${userData?.balance || 0}`;
        if(userData?.bankDetails){
            document.getElementById('accName').value = userData.bankDetails.accName || '';
            document.getElementById('bankName').value = userData.bankDetails.bankName || '';
            document.getElementById('accNumber').value = userData.bankDetails.accNumber || '';
            document.getElementById('ifsc').value = userData.bankDetails.ifsc || '';
        }
        loadBids();
        loadTransactions();
    }
    
    async function loadBids(){
        let bids = await db.collection('bids').where('userId','==',currentUser.uid).orderBy('createdAt','desc').get();
        let html = '<table><tr><th>Market</th><th>Type</th><th>Value</th><th>Points</th><th>Status</th></tr>';
        bids.forEach(d => {
            html += `<tr>
                <td>${d.data().market || '-'}</td>
                <td>${d.data().gameType || '-'}</td>
                <td>${d.data().value || '-'}</td>
                <td>${d.data().points || '-'}</td>
                <td>${d.data().status || 'Pending'}</td>
            </tr>`;
        });
        html += '</tr>';
        document.getElementById('bidList').innerHTML = html || '<p style="color:#888">No bids yet</p>';
    }
    
    async function loadTransactions(){
        let trans = await db.collection('transactions').where('userId','==',currentUser.uid).orderBy('date','desc').get();
        let html = '</table><tr><th>Type</th><th>Amount</th><th>Status</th><th>Date</th></tr>';
        trans.forEach(d => {
            let statusColor = d.data().status === 'Completed' ? '#4caf50' : (d.data().status === 'Rejected' ? '#f44336' : '#ff9800');
            html += `<tr>
                <td>${d.data().type === 'credit' ? 'Deposit' : 'Withdraw'}</td>
                <td>₹${d.data().amount}</td>
                <td style="color:${statusColor}">${d.data().status || 'Pending'}</td>
                <td>${d.data().date?.toDate().toLocaleString() || 'Pending'}</td>
            </tr>`;
        });
        html += '</table>';
        document.getElementById('transList').innerHTML = html || '<p style="color:#888">No transactions yet</p>';
    }
    
    // Save Bank Details
    document.getElementById('saveBankBtn').onclick = async () => {
        let bank = {
            accName: document.getElementById('accName').value,
            bankName: document.getElementById('bankName').value,
            accNumber: document.getElementById('accNumber').value,
            ifsc: document.getElementById('ifsc').value
        };
        if(!bank.accName || !bank.bankName || !bank.accNumber || !bank.ifsc){
            document.getElementById('bankMsg').innerHTML = '❌ Please fill all fields';
            document.getElementById('bankMsg').style.color = '#f44336';
            setTimeout(()=>document.getElementById('bankMsg').innerHTML='',3000);
            return;
        }
        await db.collection('users').doc(currentUser.uid).update({bankDetails: bank});
        document.getElementById('bankMsg').innerHTML = '✅ Bank details saved!';
        document.getElementById('bankMsg').style.color = '#4caf50';
        setTimeout(()=>document.getElementById('bankMsg').innerHTML='',3000);
    };
    
    function showPage(page){
        document.getElementById('marketsPage').classList.add('hidden');
        document.getElementById('profilePage').classList.add('hidden');
        document.getElementById('bankPage').classList.add('hidden');
        document.getElementById('historyPage').classList.add('hidden');
        document.getElementById('transactionsPage').classList.add('hidden');
        document.getElementById(page + 'Page').classList.remove('hidden');
        closeSidebar();
    }
    
    function closeSidebar(){
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('overlay').classList.remove('active');
    }
    
    document.getElementById('menuBtn').onclick = () => {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('overlay').classList.toggle('active');
    };
    document.getElementById('overlay').onclick = closeSidebar;
    document.getElementById('logoutBtn').onclick = async () => {
        await auth.signOut();
        window.location.href = 'index.html';
    };
    
    // Deposit Functions
    function selectAmount(amt){
        selectedAmount = amt;
        document.querySelectorAll('.amount-chip').forEach(chip => chip.classList.remove('active'));
        event.target.classList.add('active');
    }
    
    function showDeposit(){
        document.getElementById('depositModal').style.display = 'flex';
        document.getElementById('depositMsg').innerHTML = '';
    }
    
    function closeDeposit(){
        document.getElementById('depositModal').style.display = 'none';
    }
    
    document.getElementById('depositRequestBtn').onclick = async () => {
        let amount = selectedAmount;
        let customAmount = parseInt(document.getElementById('customAmount').value);
        if(customAmount >= 200) amount = customAmount;
        if(amount < 200){
            document.getElementById('depositMsg').innerHTML = '❌ Minimum deposit amount is ₹200';
            document.getElementById('depositMsg').style.color = '#f44336';
            return;
        }
        if(amount > 50000){
            document.getElementById('depositMsg').innerHTML = '❌ Maximum deposit amount is ₹50000';
            document.getElementById('depositMsg').style.color = '#f44336';
            return;
        }
        
        document.getElementById('depositMsg').innerHTML = '⏳ Creating deposit request...';
        document.getElementById('depositMsg').style.color = '#ff9800';
        
        await db.collection('transactions').add({
            userId: currentUser.uid,
            type: 'credit',
            amount: amount,
            status: 'Pending',
            date: new Date(),
            description: 'Deposit Request'
        });
        
        document.getElementById('depositMsg').innerHTML = '✅ Deposit request created! Admin will approve after payment.';
        document.getElementById('depositMsg').style.color = '#4caf50';
        
        // Show UPI intent
        setTimeout(() => {
            let upiUrl = `upi://pay?pa=win777@okhdfcbank&pn=WIN777&am=${amount}&cu=INR`;
            if(confirm(`Pay ₹${amount} using UPI? Click OK to open UPI app.`)){
                window.open(upiUrl, '_blank');
            }
        }, 1000);
        
        setTimeout(() => {
            closeDeposit();
            loadTransactions();
        }, 3000);
    };
    
    // Withdraw Functions
    async function showWithdraw(){
        if(!userData?.bankDetails){
            alert('Please add bank details first in Profile > Bank Details');
            showPage('bank');
            return;
        }
        let select = document.getElementById('bankSelect');
        select.innerHTML = '';
        select.innerHTML += `<option value="saved">${userData.bankDetails.bankName} - ${userData.bankDetails.accNumber}</option>`;
        select.innerHTML += `<option value="new">+ Add New Bank</option>`;
        document.getElementById('withdrawModal').style.display = 'flex';
        document.getElementById('withdrawMsg').innerHTML = '';
    }
    
    function closeWithdraw(){
        document.getElementById('withdrawModal').style.display = 'none';
    }
    
    document.getElementById('withdrawRequestBtn').onclick = async () => {
        let amount = parseInt(document.getElementById('withdrawAmount').value);
        if(amount < 500){
            document.getElementById('withdrawMsg').innerHTML = '❌ Minimum withdrawal amount is ₹500';
            document.getElementById('withdrawMsg').style.color = '#f44336';
            return;
        }
        if(amount > userData.balance){
            document.getElementById('withdrawMsg').innerHTML = `❌ Insufficient balance! Your balance is ₹${userData.balance}`;
            document.getElementById('withdrawMsg').style.color = '#f44336';
            return;
        }
        
        let bankDetails = userData.bankDetails;
        if(document.getElementById('bankSelect').value === 'new'){
            bankDetails = {
                accName: prompt('Enter Account Holder Name'),
                bankName: prompt('Enter Bank Name'),
                accNumber: prompt('Enter Account Number'),
                ifsc: prompt('Enter IFSC Code')
            };
            if(!bankDetails.accName){
                document.getElementById('withdrawMsg').innerHTML = '❌ Cancelled';
                return;
            }
        }
        
        document.getElementById('withdrawMsg').innerHTML = '⏳ Sending withdrawal request...';
        document.getElementById('withdrawMsg').style.color = '#ff9800';
        
        await db.collection('withdrawRequests').add({
            userId: currentUser.uid,
            amount: amount,
            bankDetails: bankDetails,
            status: 'Pending',
            date: new Date()
        });
        
        await db.collection('transactions').add({
            userId: currentUser.uid,
            type: 'debit',
            amount: amount,
            status: 'Pending',
            date: new Date(),
            description: 'Withdrawal Request'
        });
        
        document.getElementById('withdrawMsg').innerHTML = '✅ Withdrawal request sent! Admin will approve soon.';
        document.getElementById('withdrawMsg').style.color = '#4caf50';
        
        setTimeout(() => {
            closeWithdraw();
            loadTransactions();
        }, 2000);
    };
    
    auth.onAuthStateChanged(async (user) => {
        if(!user) window.location.href = 'index.html';
        else { await loadUser(); await loadMarkets(); setInterval(loadMarkets, 30000); }
    });
</script>
</body>
</html>
