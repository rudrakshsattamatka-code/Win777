<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WIN777 - Dashboard</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0a0a0f; padding-bottom: 70px; }
        .app-container { max-width: 500px; margin: 0 auto; background: #0a0a0f; min-height: 100vh; }
        .header { background: #0a0a0f; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #00b4ff; }
        .logo { color: #00b4ff; font-size: 22px; font-weight: bold; }
        .balance { background: #00b4ff; padding: 5px 12px; border-radius: 20px; color: #000; font-weight: bold; font-size: 14px; }
        .profile-row { display: flex; align-items: center; gap: 12px; background: #1a1a2e; margin: 10px; padding: 12px 15px; border-radius: 16px; border: 1px solid #00b4ff; }
        .profile-avatar { width: 50px; height: 50px; background: linear-gradient(135deg, #00b4ff, #0099cc); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #000; }
        .profile-info { flex: 1; }
        .profile-name { color: white; font-size: 16px; font-weight: bold; }
        .profile-phone { color: #888; font-size: 12px; }
        .notice-board { background: linear-gradient(135deg, #00b4ff, #0099cc); margin: 10px; padding: 12px; border-radius: 12px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .notice-icon { font-size: 24px; }
        .notice-text { flex: 1; color: #000; font-weight: bold; font-size: 13px; }
        .close-notice { background: none; border: none; color: #000; font-size: 18px; cursor: pointer; }
        .games-row { display: flex; justify-content: space-around; background: #1a1a2e; margin: 10px; padding: 12px; border-radius: 12px; }
        .game-icon { text-align: center; color: #aaa; font-size: 12px; cursor: pointer; }
        .game-icon span { font-size: 24px; display: block; margin-bottom: 4px; }
        .market-card { background: #1a1a2e; margin: 12px; border-radius: 16px; padding: 16px; border: 1px solid #00b4ff; }
        .market-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .market-name { color: #00b4ff; font-size: 16px; font-weight: bold; }
        .market-numbers { color: white; font-size: 14px; font-family: monospace; }
        .market-time { color: #888; font-size: 11px; margin-bottom: 8px; }
        .market-status { font-size: 11px; padding: 4px 8px; border-radius: 12px; display: inline-block; }
        .status-closed { background: #f4433620; color: #f44336; border: 1px solid #f44336; }
        .status-close { background: #00b4ff20; color: #00b4ff; border: 1px solid #00b4ff; }
        .status-open { background: #4caf5020; color: #4caf50; border: 1px solid #4caf50; }
        .play-btn { width: 100%; margin-top: 12px; padding: 10px; background: #00b4ff; border: none; border-radius: 12px; color: #000; font-weight: bold; cursor: pointer; }
        .play-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; max-width: 500px; margin: 0 auto; background: #1a1a2e; display: flex; justify-content: space-around; padding: 12px; border-top: 1px solid #00b4ff; }
        .nav-item { text-align: center; color: #aaa; cursor: pointer; font-size: 11px; }
        .nav-item span { font-size: 22px; display: block; }
        .hidden { display: none; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; }
        .modal-content { background: #1a1a2e; border-radius: 24px; padding: 25px; width: 90%; max-width: 350px; border: 1px solid #00b4ff; }
        .modal-content h3 { color: #00b4ff; margin-bottom: 15px; text-align: center; }
        .modal-content input, .modal-content select { width: 100%; padding: 12px; margin: 10px 0; background: #0a0a0f; border: 1px solid #00b4ff; border-radius: 12px; color: white; }
        .modal-btn { width: 100%; padding: 12px; background: #00b4ff; border: none; border-radius: 12px; color: #000; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .close-modal { background: #333; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header"><div class="logo">WIN777</div><div class="balance">₹<span id="userBalance">0</span></div></div>
    
    <div class="profile-row">
        <div class="profile-avatar">👤</div>
        <div class="profile-info"><div class="profile-name" id="profileName">Loading...</div><div class="profile-phone" id="profilePhone">Loading...</div></div>
        <div style="color:#00b4ff; font-size:12px; cursor:pointer;" onclick="viewProfile()">View Profile →</div>
    </div>
    
    <div id="noticeBoard" class="notice-board" onclick="showNoticeModal()">
        <div class="notice-icon">📢</div>
        <div class="notice-text" id="noticeText">Welcome to WIN777! Play big · Win big · Unlimited</div>
        <button class="close-notice" onclick="event.stopPropagation(); closeNotice()">✕</button>
    </div>
    
    <div class="games-row">
        <div class="game-icon" onclick="showGames()"><span>🎮</span><p>Games</p></div>
        <div class="game-icon" onclick="window.location.href='deposit.html'"><span>💰</span><p>Deposit</p></div>
        <div class="game-icon" onclick="window.location.href='withdraw.html'"><span>💸</span><p>Withdraw</p></div>
        <div class="game-icon" onclick="window.location.href='mybids.html'"><span>📋</span><p>My Bids</p></div>
    </div>
    
    <div id="marketsList"></div>
    
    <div class="bottom-nav">
        <div class="nav-item" onclick="location.reload()"><span>🏠</span><p>Home</p></div>
        <div class="nav-item" onclick="window.location.href='mybids.html'"><span>📘</span><p>Passbook</p></div>
        <div class="nav-item" onclick="window.location.href='mybids.html'"><span>📋</span><p>My Bids</p></div>
        <div class="nav-item" onclick="window.location.href='funds.html'"><span>🏦</span><p>Fund</p></div>
        <div class="nav-item" onclick="alert('Chat Support: WhatsApp +919876543210')"><span>💬</span><p>Support</p></div>
    </div>
</div>

<!-- Notice Modal -->
<div id="noticeModal" class="modal">
    <div class="modal-content">
        <h3>📢 Notice Board</h3>
        <div id="noticeModalText" style="color:white; margin-bottom:15px; line-height:1.5;"></div>
        <button class="modal-btn close-modal" onclick="closeNoticeModal()">Close</button>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyBeGpb7V0i5GN1opY9JECHxQIGvHFDPX38", authDomain: "win777-ed482.firebaseapp.com", projectId: "win777-ed482", storageBucket: "win777-ed482.firebasestorage.app", messagingSenderId: "843686112399", appId: "1:843686112399:web:9c20a96831e6a94cd814fa" };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    
    let marketsData = [];
    
    // Real-time listener for markets
    function listenToMarkets() {
        db.collection('markets').onSnapshot((snapshot) => {
            marketsData = [];
            snapshot.forEach(doc => marketsData.push({ id: doc.id, ...doc.data() }));
            renderMarkets();
        });
    }
    
    // Real-time listener for notice board
    function listenToNotice() {
        db.collection('settings').doc('notice').onSnapshot((doc) => {
            if (doc.exists) {
                document.getElementById('noticeText').innerHTML = doc.data().text || 'Welcome to WIN777! Play big · Win big · Unlimited';
                document.getElementById('noticeModalText').innerHTML = doc.data().text || 'Welcome to WIN777! Play big · Win big · Unlimited';
            }
        });
    }
    
    function getStatusText(status) {
        if (status === 'open') return '🟢 Running For Open';
        if (status === 'close') return '🟡 Running For Close';
        return '🔴 Closed For Today';
    }
    
    function getStatusClass(status) {
        if (status === 'open') return 'status-open';
        if (status === 'close') return 'status-close';
        return 'status-closed';
    }
    
    function openBetting(market) {
        window.location.href = `betting.html?market=${encodeURIComponent(market.name)}&status=${market.status}&marketId=${market.id}`;
    }
    
    function renderMarkets() {
        const container = document.getElementById('marketsList');
        if (marketsData.length === 0) {
            container.innerHTML = '<div style="text-align:center; color:#888; padding:40px;">No markets available. Admin will add soon.</div>';
            return;
        }
        container.innerHTML = '';
        marketsData.forEach(market => {
            const isPlayable = market.status === 'open' || market.status === 'close';
            container.innerHTML += `
                <div class="market-card">
                    <div class="market-header"><span class="market-name">${market.name}</span><span class="market-numbers">${market.numbers || '***-***-***'}</span></div>
                    <div class="market-time">Open Bids : ${market.openBid || '--:--'} &nbsp;|&nbsp; Close Bids : ${market.closeBid || '--:--'}</div>
                    <div><span class="market-status ${getStatusClass(market.status)}">${getStatusText(market.status)}</span></div>
                    <button class="play-btn" onclick='openBetting(${JSON.stringify(market)})' ${!isPlayable ? 'disabled' : ''}>${isPlayable ? '🎲 PLAY NOW' : '🔒 CLOSED'}</button>
                </div>
            `;
        });
    }
    
    async function loadUserData() {
        const user = auth.currentUser;
        if (!user) { window.location.href = 'index.html'; return; }
        const doc = await db.collection('users').doc(user.uid).get();
        if (doc.exists) {
            document.getElementById('userBalance').innerText = doc.data().balance || 0;
            document.getElementById('profileName').innerHTML = doc.data().name || 'User';
            document.getElementById('profilePhone').innerHTML = doc.data().phone || '';
        }
    }
    
    function viewProfile() {
        const user = auth.currentUser;
        if (user) {
            db.collection('users').doc(user.uid).get().then(doc => {
                if (doc.exists) {
                    alert(`📱 Profile\nName: ${doc.data().name}\nPhone: ${doc.data().phone}\nBalance: ₹${doc.data().balance || 0}\nMPIN: ${doc.data().pin}`);
                }
            });
        }
    }
    
    function showNoticeModal() {
        document.getElementById('noticeModal').style.display = 'flex';
    }
    function closeNoticeModal() { document.getElementById('noticeModal').style.display = 'none'; }
    function closeNotice() { document.getElementById('noticeBoard').style.display = 'none'; }
    function showGames() { alert('Games coming soon!'); }
    
    auth.onAuthStateChanged(user => { if (!user) window.location.href = 'index.html'; else { loadUserData(); listenToMarkets(); listenToNotice(); } });
</script>
</body>
</html>
