<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WIN777 - Dashboard</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
        }

        body {
            background: #0a0a0f;
            min-height: 100vh;
            position: relative;
        }

        /* Animated Background */
        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            background: radial-gradient(circle, rgba(255,152,0,0.15), transparent);
            border-radius: 50%;
            animation: floatParticle 20s infinite ease-in-out;
        }

        @keyframes floatParticle {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0.3; }
            25% { transform: translateY(-80px) translateX(40px); opacity: 0.6; }
            50% { transform: translateY(-160px) translateX(-40px); opacity: 0.3; }
            75% { transform: translateY(-80px) translateX(40px); opacity: 0.6; }
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 1;
            max-width: 500px;
            margin: 0 auto;
            padding: 15px;
            padding-bottom: 30px;
        }

        /* Top Header */
        .top-header {
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1a 100%);
            border-radius: 25px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid rgba(255,152,0,0.2);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .top-header h1 {
            color: #ff9800;
            font-size: 32px;
            letter-spacing: 3px;
        }

        .top-header h1 span {
            color: #ff5722;
        }

        .top-header p {
            color: #aaa;
            font-size: 12px;
            margin-top: 5px;
        }

        /* User Bar */
        .user-bar {
            background: rgba(26,26,46,0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 12px 18px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,152,0,0.2);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #ff9800, #ff5722);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .user-details {
            display: flex;
            flex-direction: column;
        }

        .user-name {
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        .user-balance {
            color: #ff9800;
            font-size: 12px;
        }

        .logout-btn {
            background: rgba(244,67,54,0.2);
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            color: #ff6b6b;
            font-size: 12px;
            cursor: pointer;
        }

        /* Menu Buttons */
        .menu-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        .menu-btn {
            background: linear-gradient(135deg, #1a1a2e, #0f0f1a);
            border: 1px solid rgba(255,152,0,0.3);
            border-radius: 16px;
            padding: 12px 5px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .menu-btn span {
            font-size: 24px;
            display: block;
            margin-bottom: 5px;
        }

        .menu-btn p {
            color: #ff9800;
            font-size: 12px;
            font-weight: bold;
        }

        .menu-btn:active {
            transform: scale(0.95);
        }

        .menu-btn.whatsapp {
            background: linear-gradient(135deg, #075e54, #128c7e);
            border-color: #25D366;
        }

        .menu-btn.call {
            background: linear-gradient(135deg, #1a5d1a, #2e7d32);
            border-color: #4caf50;
        }

        /* Section Title */
        .section-title {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .section-title h2 {
            color: white;
            font-size: 18px;
        }

        .section-title h3 {
            color: #ff9800;
            font-size: 14px;
            font-weight: normal;
        }

        .new-badge {
            background: #ff5722;
            color: white;
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 20px;
        }

        /* Market Card */
        .market-card {
            background: linear-gradient(135deg, #1a1a2e, #12121f);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 15px;
            border: 1px solid rgba(255,152,0,0.15);
            position: relative;
            overflow: hidden;
            transition: 0.2s;
        }

        .market-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, #ff9800, #ff5722);
        }

        .market-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .market-name {
            font-size: 18px;
            font-weight: bold;
            color: #ff9800;
        }

        .market-numbers {
            font-size: 20px;
            font-weight: bold;
            color: white;
            letter-spacing: 2px;
        }

        .market-timing {
            color: #aaa;
            font-size: 12px;
            margin-bottom: 10px;
            display: flex;
            gap: 15px;
        }

        .market-status {
            display: inline-block;
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 20px;
            margin-top: 10px;
        }

        .status-open {
            background: rgba(76,175,80,0.2);
            color: #4caf50;
            border: 1px solid #4caf50;
        }

        .status-closed {
            background: rgba(244,67,54,0.2);
            color: #f44336;
            border: 1px solid #f44336;
        }

        /* Bid Section */
        .bid-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,152,0,0.2);
        }

        .bid-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .bid-input {
            flex: 1;
            padding: 12px;
            background: #0a0a0f;
            border: 1px solid #333;
            border-radius: 12px;
            color: white;
            font-size: 14px;
        }

        .bid-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ff9800, #ff5722);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        .bid-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #1a1a2e;
            border-radius: 30px;
            padding: 25px;
            width: 90%;
            max-width: 350px;
            border: 1px solid #ff9800;
        }

        .modal-content h3 {
            color: #ff9800;
            margin-bottom: 15px;
        }

        .modal-content input {
            width: 100%;
            padding: 12px;
            background: #0a0a0f;
            border: 1px solid #333;
            border-radius: 12px;
            color: white;
            margin-bottom: 15px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        .close-modal {
            background: #f44336;
            color: white;
        }

        .confirm-modal {
            background: #ff9800;
            color: #1a1a2e;
            font-weight: bold;
        }

        /* CDIDEVI Footer */
        .footer {
            text-align: center;
            padding: 20px;
            margin-top: 20px;
        }

        .footer p {
            color: #ff9800;
            font-size: 12px;
            letter-spacing: 2px;
        }

        .hidden {
            display: none;
        }

        /* Transaction Modal */
        .transaction-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .transaction-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            color: #ddd;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="bg-particles" id="bgParticles"></div>

    <div class="container">
        <!-- Header -->
        <div class="top-header">
            <h1>WIN<span>777</span></h1>
            <p>Matka Live Now on WIN777!</p>
        </div>

        <!-- User Bar -->
        <div class="user-bar">
            <div class="user-info">
                <div class="user-avatar">👤</div>
                <div class="user-details">
                    <span class="user-name" id="userName">Loading...</span>
                    <span class="user-balance">💰 ₹<span id="userBalance">0</span></span>
                </div>
            </div>
            <button class="logout-btn" id="logoutBtn">Logout</button>
        </div>

        <!-- Menu Buttons -->
        <div class="menu-buttons">
            <div class="menu-btn" onclick="openDeposit()">
                <span>💰</span>
                <p>Deposit</p>
            </div>
            <div class="menu-btn" onclick="openWithdraw()">
                <span>💸</span>
                <p>Withdraw</p>
            </div>
            <div class="menu-btn whatsapp" onclick="openWhatsApp()">
                <span>📱</span>
                <p>WhatsApp</p>
            </div>
            <div class="menu-btn call" onclick="openCall()">
                <span>📞</span>
                <p>Call Us</p>
            </div>
        </div>

        <!-- Main Markets Section -->
        <div class="section-title">
            <h2>Main Markets</h2>
            <div class="new-badge">NEW</div>
        </div>

        <!-- Markets List -->
        <div id="marketsList"></div>

        <!-- Footer -->
        <div class="footer">
            <p>WIN777</p>
        </div>
    </div>

    <!-- Deposit Modal -->
    <div id="depositModal" class="modal">
        <div class="modal-content">
            <h3>💰 Deposit Money</h3>
            <input type="number" id="depositAmount" placeholder="Enter amount (₹)">
            <div class="modal-buttons">
                <button class="close-modal" onclick="closeDeposit()">Cancel</button>
                <button class="confirm-modal" onclick="confirmDeposit()">Deposit</button>
            </div>
            <div id="depositMsg" style="color:#f44336; font-size:12px; margin-top:10px;"></div>
        </div>
    </div>

    <!-- Withdraw Modal -->
    <div id="withdrawModal" class="modal">
        <div class="modal-content">
            <h3>💸 Withdraw Money</h3>
            <input type="number" id="withdrawAmount" placeholder="Enter amount (₹)">
            <div class="modal-buttons">
                <button class="close-modal" onclick="closeWithdraw()">Cancel</button>
                <button class="confirm-modal" onclick="confirmWithdraw()">Withdraw</button>
            </div>
            <div id="withdrawMsg" style="color:#f44336; font-size:12px; margin-top:10px;"></div>
        </div>
    </div>

    <!-- Bid Modal -->
    <div id="bidModal" class="modal">
        <div class="modal-content">
            <h3 id="bidModalTitle">Place Bid</h3>
            <input type="number" id="bidAmount" placeholder="Enter bid amount (₹)">
            <div class="modal-buttons">
                <button class="close-modal" onclick="closeBidModal()">Cancel</button>
                <button class="confirm-modal" onclick="confirmBid()">Place Bid</button>
            </div>
            <div id="bidMsg" style="color:#f44336; font-size:12px; margin-top:10px;"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBeGpb7V0i5GN1opY9JECHxQIGvHFDPX38",
            authDomain: "win777-ed482.firebaseapp.com",
            projectId: "win777-ed482",
            storageBucket: "win777-ed482.firebasestorage.app",
            messagingSenderId: "843686112399",
            appId: "1:843686112399:web:9c20a96831e6a94cd814fa"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        let currentUser = null;
        let userData = null;
        let selectedMarket = null;
        
        // Create animated background particles
        for (let i = 0; i < 30; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.width = Math.random() * 200 + 50 + 'px';
            particle.style.height = particle.style.width;
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 20 + 's';
            particle.style.animationDuration = Math.random() * 25 + 15 + 's';
            document.getElementById('bgParticles').appendChild(particle);
        }
        
        // Market data
        let markets = [
            { 
                id: 'm1', 
                name: 'SHREE GANESH', 
                numbers: '340-76-349',
                openTime: '09:00 AM', 
                closeTime: '10:00 AM', 
                status: 'closed' 
            },
            { 
                id: 'm2', 
                name: 'OMKAR MORNING', 
                numbers: '126-92-570',
                openTime: '09:40 AM', 
                closeTime: '10:40 AM', 
                status: 'closed' 
            },
            { 
                id: 'm3', 
                name: 'GOA MORNING', 
                numbers: '244-01-678',
                openTime: '10:15 AM', 
                closeTime: '12:15 PM', 
                status: 'closed' 
            },
            { 
                id: 'm4', 
                name: 'KALYAN MORNING', 
                numbers: '123-45-678',
                openTime: '11:00 AM', 
                closeTime: '01:00 PM', 
                status: 'open' 
            },
            { 
                id: 'm5', 
                name: 'RAJDHANI DAY', 
                numbers: '234-56-789',
                openTime: '12:00 PM', 
                closeTime: '02:00 PM', 
                status: 'open' 
            },
            { 
                id: 'm6', 
                name: 'MAIN BAZAR', 
                numbers: '345-67-890',
                openTime: '03:00 PM', 
                closeTime: '05:00 PM', 
                status: 'open' 
            }
        ];
        
        function renderMarkets() {
            const container = document.getElementById('marketsList');
            if (!container) return;
            
            container.innerHTML = markets.map(market => `
                <div class="market-card">
                    <div class="market-header">
                        <span class="market-name">${market.name}</span>
                        <span class="market-numbers">${market.numbers}</span>
                    </div>
                    <div class="market-timing">
                        <span>🕐 Open Bids: ${market.openTime}</span>
                        <span>⏰ Close Bids: ${market.closeTime}</span>
                    </div>
                    <div>
                        <span class="market-status ${market.status === 'open' ? 'status-open' : 'status-closed'}">
                            ${market.status === 'open' ? '🟢 Open Now' : '🔴 Closed for Today'}
                        </span>
                    </div>
                    ${market.status === 'open' ? `
                        <div class="bid-section">
                            <div class="bid-input-group">
                                <input type="number" id="bid-${market.id}" class="bid-input" placeholder="Enter bid amount (₹)">
                            </div>
                            <button class="bid-btn" onclick="openBidModal('${market.id}', '${market.name}')">Place Bid</button>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }
        
        function openBidModal(marketId, marketName) {
            selectedMarket = { id: marketId, name: marketName };
            document.getElementById('bidModalTitle').innerHTML = `🎲 ${marketName}`;
            document.getElementById('bidAmount').value = '';
            document.getElementById('bidMsg').innerHTML = '';
            document.getElementById('bidModal').style.display = 'flex';
        }
        
        function closeBidModal() {
            document.getElementById('bidModal').style.display = 'none';
            selectedMarket = null;
        }
        
        async function confirmBid() {
            const amount = parseInt(document.getElementById('bidAmount').value);
            
            if (!amount || amount <= 0) {
                document.getElementById('bidMsg').innerHTML = 'Enter valid amount';
                return;
            }
            if (!currentUser) return;
            if (userData.balance < amount) {
                document.getElementById('bidMsg').innerHTML = 'Insufficient balance!';
                return;
            }
            
            const newBalance = userData.balance - amount;
            
            await db.collection('users').doc(currentUser.uid).update({ balance: newBalance });
            await db.collection('bids').add({
                userId: currentUser.uid,
                marketId: selectedMarket.id,
                marketName: selectedMarket.name,
                amount: amount,
                status: 'pending',
                createdAt: new Date()
            });
            await addTransaction('debit', amount, `Bid on ${selectedMarket.name}`);
            await loadUserData();
            
            alert(`✅ Bid placed successfully!\nAmount: ₹${amount}\nMarket: ${selectedMarket.name}`);
            closeBidModal();
            document.getElementById(`bid-${selectedMarket.id}`).value = '';
        }
        
        function openDeposit() {
            document.getElementById('depositAmount').value = '';
            document.getElementById('depositMsg').innerHTML = '';
            document.getElementById('depositModal').style.display = 'flex';
        }
        
        function closeDeposit() {
            document.getElementById('depositModal').style.display = 'none';
        }
        
        async function confirmDeposit() {
            const amount = parseInt(document.getElementById('depositAmount').value);
            if (!amount || amount <= 0) {
                document.getElementById('depositMsg').innerHTML = 'Enter valid amount';
                return;
            }
            
            const newBalance = (userData.balance || 0) + amount;
            await db.collection('users').doc(currentUser.uid).update({ balance: newBalance });
            await addTransaction('credit', amount, 'Deposit');
            await loadUserData();
            
            document.getElementById('depositMsg').innerHTML = '<span style="color:#4caf50;">✅ Deposit successful!</span>';
            setTimeout(() => closeDeposit(), 1500);
        }
        
        function openWithdraw() {
            document.getElementById('withdrawAmount').value = '';
            document.getElementById('withdrawMsg').innerHTML = '';
            document.getElementById('withdrawModal').style.display = 'flex';
        }
        
        function closeWithdraw() {
            document.getElementById('withdrawModal').style.display = 'none';
        }
        
        async function confirmWithdraw() {
            const amount = parseInt(document.getElementById('withdrawAmount').value);
            if (!amount || amount <= 0) {
                document.getElementById('withdrawMsg').innerHTML = 'Enter valid amount';
                return;
            }
            if (userData.balance < amount) {
                document.getElementById('withdrawMsg').innerHTML = 'Insufficient balance';
                return;
            }
            
            const newBalance = userData.balance - amount;
            await db.collection('users').doc(currentUser.uid).update({ balance: newBalance });
            await addTransaction('debit', amount, 'Withdrawal Request');
            await loadUserData();
            
            document.getElementById('withdrawMsg').innerHTML = '<span style="color:#4caf50;">✅ Withdrawal request submitted!</span>';
            setTimeout(() => closeWithdraw(), 1500);
        }
        
        function openWhatsApp() {
            window.open('https://wa.me/919876543210', '_blank');
        }
        
        function openCall() {
            window.location.href = 'tel:+919876543210';
        }
        
        async function loadUserData() {
            const user = auth.currentUser;
            if (!user) return;
            currentUser = user;
            const userDoc = await db.collection('users').doc(user.uid).get();
            userData = userDoc.data();
            document.getElementById('userBalance').innerText = userData?.balance || 0;
            document.getElementById('userName').innerHTML = userData?.name || 'User';
        }
        
        async function addTransaction(type, amount, description) {
            await db.collection('transactions').add({
                userId: currentUser.uid,
                type: type,
                amount: amount,
                description: description,
                date: new Date()
            });
        }
        
        document.getElementById('logoutBtn')?.addEventListener('click', async () => {
            await auth.signOut();
            window.location.href = 'index.html';
        });
        
        auth.onAuthStateChanged(async (user) => {
            if (!user) window.location.href = 'index.html';
            else { await loadUserData(); renderMarkets(); }
        });
    </script>
</body>
</html>
