<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WIN777 - Games Rates</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0a0a0f; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: #ff9800; font-size: 28px; }
        .card {
            background: linear-gradient(135deg, #1a1a2e, #12121f);
            border-radius: 30px;
            padding: 25px;
            border: 1px solid rgba(255,152,0,0.2);
        }
        .section-title {
            color: #ff9800;
            font-size: 16px;
            margin-bottom: 15px;
            text-align: center;
        }
        .subtitle {
            color: #aaa;
            font-size: 12px;
            text-align: center;
            margin-bottom: 20px;
        }
        .rate-item {
            display: flex;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .game-name {
            color: white;
            font-size: 14px;
        }
        .game-price {
            color: #ff9800;
            font-weight: bold;
            font-size: 14px;
        }
        .back-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff9800, #ff5722);
            border: none;
            border-radius: 16px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Games Rates</h1>
        </div>
        <div class="card">
            <div class="section-title">Game Win Ratio For All Bids</div>
            <div class="subtitle">Game Price (per ₹10 bet)</div>
            
            <div class="rate-item"><span class="game-name">Single Digit</span><span class="game-price">₹100</span></div>
            <div class="rate-item"><span class="game-name">Jodi Digit</span><span class="game-price">₹1,000</span></div>
            <div class="rate-item"><span class="game-name">Single Pana</span><span class="game-price">₹160</span></div>
            <div class="rate-item"><span class="game-name">Double Pana</span><span class="game-price">₹320</span></div>
            <div class="rate-item"><span class="game-name">Triple Pana</span><span class="game-price">₹1,000</span></div>
            <div class="rate-item"><span class="game-name">Red Brackets</span><span class="game-price">₹100</span></div>
            <div class="rate-item"><span class="game-name">Half Sangam A</span><span class="game-price">₹1,000</span></div>
            <div class="rate-item"><span class="game-name">Half Sangam B</span><span class="game-price">₹1,000</span></div>
            <div class="rate-item"><span class="game-name">Full Sangam Digits</span><span class="game-price">₹10,000</span></div>
        </div>
        <button class="back-btn" onclick="goBack()">← Back to Dashboard</button>
    </div>

    <script>
        function goBack() { window.location.href = 'dashboard.html'; }
    </script>
</body>
</html>
