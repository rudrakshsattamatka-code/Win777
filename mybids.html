<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WIN777 - My Bids & History</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f5f7fa; padding-bottom: 70px; }
        .app-container { max-width: 500px; margin: 0 auto; background: #f5f7fa; min-height: 100vh; }
        
        .header { background: #fff; padding: 15px 20px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #e9ecef; }
        .logo-img { width: 40px; height: 40px; border-radius: 50%; border: 1px solid #ffd700; }
        .logo-text { color: #1a1a2e; font-size: 20px; font-weight: bold; flex: 1; text-align: center; }
        .back-btn { background: none; border: none; color: #1a1a2e; font-size: 24px; cursor: pointer; }
        
        .bid-card { background: #fff; margin: 12px; border-radius: 16px; overflow: hidden; border: 1px solid #e9ecef; transition: all 0.3s; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .bid-card:hover { border-color: #ffd700; }
        .bid-header { padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e9ecef; }
        .market-name { color: #1a1a2e; font-size: 16px; font-weight: bold; }
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .status-won { background: #d4edda; color: #28a745; border: 1px solid #c3e6cb; }
        .status-lost { background: #fee2e2; color: #dc3545; border: 1px solid #ffcdcd; }
        .status-pending { background: #fff3cd; color: #ffc107; border: 1px solid #ffeeba; }
        .bid-body { padding: 15px; }
        .bid-row { display: flex; justify-content: space-between; margin-bottom: 10px; padding: 5px 0; border-bottom: 1px solid #e9ecef; }
        .bid-label { color: #6c757d; font-size: 13px; }
        .bid-value { color: #1a1a2e; font-weight: 600; font-size: 14px; }
        .win-amount { color: #28a745; font-size: 18px; font-weight: bold; }
        .bid-footer { background: #f8f9fa; padding: 10px 15px; font-size: 11px; color: #6c757d; text-align: right; border-top: 1px solid #e9ecef; }
        .no-data { text-align: center; color: #6c757d; padding: 60px 20px; }
        
        .tab-bar { display: flex; background: #fff; margin: 12px; border-radius: 12px; padding: 4px; gap: 4px; border: 1px solid #e9ecef; }
        .tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; border-radius: 10px; transition: all 0.3s; color: #6c757d; font-weight: 500; }
        .tab.active { background: linear-gradient(135deg, #ffd700, #ffcd38); color: #1a1a2e; font-weight: bold; }
        
        .clear-btn { background: #dc3545; color: #fff; border: none; padding: 10px 20px; border-radius: 30px; margin: 10px; cursor: pointer; font-weight: bold; }
        .clear-btn:hover { background: #c82333; transform: scale(1.02); }
        
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; max-width: 500px; margin: 0 auto; background: #fff; display: flex; justify-content: space-around; padding: 8px 10px; border-top: 1px solid #e9ecef; }
        .nav-item { text-align: center; color: #6c757d; cursor: pointer; font-size: 10px; transition: all 0.3s; flex: 1; }
        .nav-item:hover { color: #ffd700; transform: translateY(-3px); }
        .nav-item img { width: 24px; height: 24px; display: block; margin: 0 auto 3px; border-radius: 8px; filter: brightness(0.8); }
        .nav-item:hover img { filter: brightness(1); transform: scale(1.05); }
        .nav-item span { font-size: 10px; display: block; }
        .nav-item.active { color: #ffd700; }
        
        .hidden { display: none; }
        .error-box { background: #fee2e2; color: #dc3545; padding: 15px; margin: 12px; border-radius: 12px; text-align: center; border: 1px solid #ffcdcd; }
        
        .delete-info {
            background: #e3f2fd;
            color: #1565c0;
            font-size: 11px;
            padding: 8px 12px;
            margin: 0 12px;
            border-radius: 8px;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <button class="back-btn" onclick="location.href='dashboard.html'">←</button>
        <img src="https://i.imgur.com/V4pMmxP.jpeg" alt="WIN777" class="logo-img">
        <div class="logo-text">MY BIDS</div>
        <div style="width:30px;"></div>
    </div>
    
    <div class="tab-bar">
        <div class="tab active" onclick="showTab('bids')">My Bids</div>
        <div class="tab" onclick="showTab('transactions')">Transactions</div>
        <div class="tab" onclick="showTab('rates')">Game Rates</div>
    </div>
    
    <div id="bidsTab">
        <div style="text-align: center;">
            <button class="clear-btn" onclick="clearAllBids()">🗑️ Clear All Bids</button>
        </div>
        <div class="delete-info">
            📋 Bids older than 24 hours are automatically deleted
        </div>
        <div id="bidsList"></div>
    </div>
    
    <div id="transactionsTab" class="hidden">
        <div style="text-align: center;">
            <button class="clear-btn" onclick="clearAllTransactions()">🗑️ Clear All Transactions</button>
        </div>
        <div id="transactionsList"></div>
    </div>
    
    <div id="ratesTab" class="hidden">
        <div class="bid-card">
            <div class="bid-header"><span class="market-name">🎲 GAME RATES</span></div>
            <div class="bid-body">
                <div class="bid-row"><span class="bid-label">Single Digit</span><span class="bid-value">10x</span></div>
                <div class="bid-row"><span class="bid-label">Jodi</span><span class="bid-value">100x</span></div>
                <div class="bid-row"><span class="bid-label">Single Pana</span><span class="bid-value">160x</span></div>
                <div class="bid-row"><span class="bid-label">Double Pana</span><span class="bid-value">320x</span></div>
                <div class="bid-row"><span class="bid-label">Triple Pana</span><span class="bid-value">1000x</span></div>
                <div class="bid-row"><span class="bid-label">Half Sangam A</span><span class="bid-value">1000x</span></div>
                <div class="bid-row"><span class="bid-label">Half Sangam B</span><span class="bid-value">1000x</span></div>
                <div class="bid-row"><span class="bid-label">Full Sangam</span><span class="bid-value">10000x</span></div>
            </div>
        </div>
    </div>
    
    <div class="bottom-nav">
        <div class="nav-item" onclick="location.href='dashboard.html'">
            <img src="https://i.imgur.com/StGZq3Y.png" alt="Home">
            <span>Home</span>
        </div>
        <div class="nav-item active" onclick="location.href='mybids.html'">
            <img src="https://i.imgur.com/rUWwMYm.png" alt="Passbook">
            <span>Passbook</span>
        </div>
        <div class="nav-item" onclick="location.href='dashboard.html'">
            <img src="https://i.imgur.com/QhfWXLI.jpeg" alt="My Bids">
            <span>My Bids</span>
        </div>
        <div class="nav-item" onclick="location.href='funds.html'">
            <img src="https://i.imgur.com/NvJCTli.png" alt="Fund">
            <span>Fund</span>
        </div>
        <div class="nav-item" onclick="location.href='chat.html'">
            <img src="https://i.imgur.com/ug9IprL.jpeg" alt="Support">
            <span>Support</span>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBeGpb7V0i5GN1opY9JECHxQIGvHFDPX38",
        authDomain: "win777-ed482.firebaseapp.com",
        projectId: "win777-ed482",
        storageBucket: "win777-ed482.firebasestorage.app",
        messagingSenderId: "843686112399",
        appId: "1:843686112399:web:9c20a96831e6a94cd814fa"
    };
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    
    const gameRates = {
        'Single Digit': 10, 'Jodi': 100, 'Single Pana': 160,
        'Double Pana': 320, 'Triple Pana': 1000,
        'Half Sangam A': 1000, 'Half Sangam B': 1000, 'Full Sangam': 10000
    };
    
    let currentUserId = null;
    let cleanupInterval = null;
    
    // Auto-delete bids older than 24 hours
    async function deleteOldBids() {
        const user = auth.currentUser;
        if (!user) return;
        
        const twentyFourHoursAgo = new Date();
        twentyFourHoursAgo.setHours(twentyFourHoursAgo.getHours() - 24);
        
        try {
            const oldBids = await db.collection('bids')
                .where('userId', '==', user.uid)
                .where('createdAt', '<=', twentyFourHoursAgo)
                .get();
            
            if (!oldBids.empty) {
                const batch = db.batch();
                oldBids.forEach(doc => batch.delete(doc.ref));
                await batch.commit();
                console.log(`Deleted ${oldBids.size} old bids`);
            }
        } catch (error) {
            console.error("Error deleting old bids:", error);
        }
    }
    
    // Auto-delete old transactions (older than 24 hours)
    async function deleteOldTransactions() {
        const user = auth.currentUser;
        if (!user) return;
        
        const twentyFourHoursAgo = new Date();
        twentyFourHoursAgo.setHours(twentyFourHoursAgo.getHours() - 24);
        
        try {
            const oldTransactions = await db.collection('transactions')
                .where('userId', '==', user.uid)
                .where('date', '<=', twentyFourHoursAgo)
                .get();
            
            if (!oldTransactions.empty) {
                const batch = db.batch();
                oldTransactions.forEach(doc => batch.delete(doc.ref));
                await batch.commit();
                console.log(`Deleted ${oldTransactions.size} old transactions`);
            }
        } catch (error) {
            console.error("Error deleting old transactions:", error);
        }
    }
    
    function showTab(tab) {
        document.getElementById('bidsTab').classList.add('hidden');
        document.getElementById('transactionsTab').classList.add('hidden');
        document.getElementById('ratesTab').classList.add('hidden');
        document.getElementById(`${tab}Tab`).classList.remove('hidden');
        
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');
        
        if (tab === 'transactions') loadTransactions();
        if (tab === 'bids') loadBids();
    }
    
    async function clearAllBids() {
        const user = auth.currentUser;
        if (!user) return;
        if (confirm("⚠️ WARNING: This will delete ALL your bid history permanently!\n\nThis action cannot be undone!\n\nAre you sure?")) {
            const bids = await db.collection('bids').where('userId', '==', user.uid).get();
            const batch = db.batch();
            bids.forEach(doc => batch.delete(doc.ref));
            await batch.commit();
            alert(`✅ Deleted ${bids.size} bids!`);
            loadBids();
        }
    }
    
    async function clearAllTransactions() {
        const user = auth.currentUser;
        if (!user) return;
        if (confirm("⚠️ WARNING: This will delete ALL your transaction history permanently!\n\nThis action cannot be undone!\n\nAre you sure?")) {
            const transactions = await db.collection('transactions').where('userId', '==', user.uid).get();
            const batch = db.batch();
            transactions.forEach(doc => batch.delete(doc.ref));
            await batch.commit();
            alert(`✅ Deleted ${transactions.size} transactions!`);
            loadTransactions();
        }
    }
    
    async function loadBids() {
        const user = auth.currentUser;
        if (!user) { window.location.href = 'index.html'; return; }
        
        currentUserId = user.uid;
        const container = document.getElementById('bidsList');
        
        container.innerHTML = '<div class="no-data">🔄 Loading bids...</div>';
        
        try {
            // Run cleanup first
            await deleteOldBids();
            
            const bidsSnapshot = await db.collection('bids')
                .where('userId', '==', currentUserId)
                .orderBy('createdAt', 'desc')
                .get();
            
            if (bidsSnapshot.empty) {
                container.innerHTML = '<div class="no-data">👑 No bids placed yet<br><small>Go to dashboard and place your first royal bid!</small></div>';
                return;
            }
            
            let bids = [];
            bidsSnapshot.forEach(doc => { bids.push({ id: doc.id, ...doc.data() }); });
            
            let html = '';
            
            for (const b of bids) {
                const bidAmount = b.points || 0;
                
                let statusClass = '', statusText = '';
                
                if (b.status === 'won') {
                    statusClass = 'status-won';
                    statusText = '🏆 WON';
                } else if (b.status === 'lost') {
                    statusClass = 'status-lost';
                    statusText = '❌ LOST';
                } else {
                    statusClass = 'status-pending';
                    statusText = '⏳ PENDING';
                }
                
                let bidDate = 'Pending';
                if (b.createdAt && b.createdAt.toDate) bidDate = b.createdAt.toDate().toLocaleString();
                
                html += `
                    <div class="bid-card">
                        <div class="bid-header">
                            <span class="market-name">👑 ${b.market || 'Unknown Market'}</span>
                            <span class="status-badge ${statusClass}">${statusText}</span>
                        </div>
                        <div class="bid-body">
                            <div class="bid-row"><span class="bid-label">🎲 Game Type</span><span class="bid-value">${b.gameType || '-'}</span></div>
                            <div class="bid-row"><span class="bid-label">🔢 Your Number</span><span class="bid-value" style="color:#ff4757; font-size:16px; font-weight:bold;">${b.value || '-'}</span></div>
                            <div class="bid-row"><span class="bid-label">💰 Bid Amount</span><span class="bid-value">₹${bidAmount}</span></div>
                            ${b.bidType ? `<div class="bid-row"><span class="bid-label">🎲 Bid Type</span><span class="bid-value">${b.bidType}</span></div>` : ''}
                        </div>
                        <div class="bid-footer">📅 ${bidDate}</div>
                    </div>
                `;
            }
            
            container.innerHTML = html;
        } catch (error) {
            container.innerHTML = `<div class="error-box">❌ Error loading bids: ${error.message}</div>`;
        }
    }
    
    async function loadTransactions() {
        const user = auth.currentUser;
        if (!user) return;
        
        const container = document.getElementById('transactionsList');
        container.innerHTML = '<div class="no-data">🔄 Loading transactions...</div>';
        
        try {
            // Run cleanup on transactions
            await deleteOldTransactions();
            
            const transactionsSnapshot = await db.collection('transactions')
                .where('userId', '==', user.uid)
                .orderBy('date', 'desc')
                .get();
            
            if (transactionsSnapshot.empty) {
                container.innerHTML = '<div class="no-data">👑 No transactions yet</div>';
                return;
            }
            
            let transactions = [];
            transactionsSnapshot.forEach(doc => { transactions.push({ id: doc.id, ...doc.data() }); });
            
            let html = '';
            for (const t of transactions) {
                const date = t.date?.toDate().toLocaleString() || 'Pending';
                const isCredit = t.type === 'credit';
                let statusColor = '#ffc107', statusText = '⏳ Pending';
                if (t.status === 'Completed') { statusColor = '#28a745'; statusText = '✅ Completed'; }
                else if (t.status === 'Rejected') { statusColor = '#dc3545'; statusText = '❌ Rejected'; }
                
                html += `
                    <div class="bid-card">
                        <div class="bid-header">
                            <span class="market-name">${isCredit ? '💰 DEPOSIT' : '💸 WITHDRAWAL'}</span>
                            <span style="color:${statusColor};">${statusText}</span>
                        </div>
                        <div class="bid-body">
                            <div class="bid-row"><span class="bid-label">Amount</span><span class="bid-value" style="color:${isCredit ? '#28a745' : '#1a1a2e'}; font-size:18px; font-weight:bold;">${isCredit ? '+' : '-'} ₹${t.amount}</span></div>
                            <div class="bid-row"><span class="bid-label">Date</span><span class="bid-value">${date}</span></div>
                            ${t.description ? `<div class="bid-row"><span class="bid-label">Description</span><span class="bid-value">${t.description}</span></div>` : ''}
                        </div>
                    </div>
                `;
            }
            container.innerHTML = html;
        } catch (error) {
            container.innerHTML = `<div class="error-box">❌ Error loading transactions: ${error.message}</div>`;
        }
    }
    
    // Run cleanup every hour
    function startAutoCleanup() {
        if (cleanupInterval) clearInterval(cleanupInterval);
        cleanupInterval = setInterval(() => {
            if (auth.currentUser) {
                deleteOldBids();
                deleteOldTransactions();
            }
        }, 3600000); // Every hour
    }
    
    auth.onAuthStateChanged(user => {
        if (!user) window.location.href = 'index.html';
        else { 
            loadBids(); 
            startAutoCleanup();
        }
    });
    
    window.showTab = showTab;
    window.clearAllBids = clearAllBids;
    window.clearAllTransactions = clearAllTransactions;
</script>
</body>
</html>
