<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WIN777 - My Bids & History</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #e8f4f8; padding-bottom: 70px; }
        .app-container { max-width: 500px; margin: 0 auto; background: #e8f4f8; min-height: 100vh; }
        
        .header { background: #fff; padding: 15px 20px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #d4eaf5; }
        .logo { color: #00b4ff; font-size: 20px; font-weight: bold; flex: 1; text-align: center; }
        .back-btn { background: none; border: none; color: #00b4ff; font-size: 24px; cursor: pointer; }
        
        .bid-card { background: #fff; margin: 12px; border-radius: 16px; overflow: hidden; border: 1px solid #d4eaf5; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .bid-header { padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e8f4f8; }
        .market-name { color: #00b4ff; font-size: 16px; font-weight: bold; }
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .status-won { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status-lost { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .status-pending { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .bid-body { padding: 15px; }
        .bid-row { display: flex; justify-content: space-between; margin-bottom: 10px; padding: 5px 0; border-bottom: 1px solid #f0f0f0; }
        .bid-label { color: #888; font-size: 13px; }
        .bid-value { color: #333; font-weight: bold; font-size: 14px; }
        .win-amount { color: #28a745; font-size: 18px; font-weight: bold; }
        .bid-footer { background: #f8f9fa; padding: 10px 15px; font-size: 11px; color: #888; text-align: right; }
        .no-data { text-align: center; color: #888; padding: 60px 20px; }
        .summary-bar { background: linear-gradient(135deg, #28a745, #1e7e34); margin: 12px; padding: 15px; border-radius: 16px; text-align: center; color: #fff; }
        .summary-title { font-size: 12px; opacity: 0.9; }
        .summary-value { font-size: 28px; font-weight: bold; }
        
        .tab-bar { display: flex; background: #fff; margin: 12px; border-radius: 12px; padding: 4px; gap: 4px; }
        .tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; border-radius: 10px; transition: all 0.3s; color: #666; }
        .tab.active { background: #00b4ff; color: #fff; }
        
        .clear-btn { background: #dc3545; color: white; border: none; padding: 8px 16px; border-radius: 8px; margin: 10px; cursor: pointer; }
        .clear-btn:hover { background: #c82333; }
        
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; max-width: 500px; margin: 0 auto; background: #fff; display: flex; justify-content: space-around; padding: 12px; border-top: 1px solid #d4eaf5; }
        .nav-item { text-align: center; color: #aaa; cursor: pointer; font-size: 11px; transition: all 0.3s; }
        .nav-item.active { color: #00b4ff; }
        .nav-item span { font-size: 22px; display: block; }
        
        .hidden { display: none; }
        .btn-warning { background: #ffc107; color: #333; margin: 5px; padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <button class="back-btn" onclick="location.href='dashboard.html'">←</button>
        <div class="logo">MY BIDS</div>
        <div style="width:30px;"></div>
    </div>
    
    <div class="tab-bar">
        <div class="tab active" onclick="showTab('bids')">My Bids</div>
        <div class="tab" onclick="showTab('transactions')">Transactions</div>
        <div class="tab" onclick="showTab('rates')">Game Rates</div>
    </div>
    
    <div id="bidsTab">
        <div id="summary" class="summary-bar hidden">
            <div class="summary-title">Total Winnings</div>
            <div class="summary-value">₹<span id="totalWon">0</span></div>
        </div>
        <div style="text-align: center;">
            <button class="clear-btn" onclick="clearAllBids()">🗑️ Clear All Bids</button>
        </div>
        <div id="bidsList"></div>
    </div>
    
    <div id="transactionsTab" class="hidden">
        <div style="text-align: center;">
            <button class="clear-btn" onclick="clearAllTransactions()">🗑️ Clear All Transactions</button>
        </div>
        <div id="transactionsList"></div>
    </div>
    
    <div id="ratesTab" class="hidden">
        <div class="bid-card">
            <div class="bid-header"><span class="market-name">🎲 GAME RATES</span></div>
            <div class="bid-body">
                <div class="bid-row"><span class="bid-label">Single Digit</span><span class="bid-value">10x</span></div>
                <div class="bid-row"><span class="bid-label">Jodi</span><span class="bid-value">100x</span></div>
                <div class="bid-row"><span class="bid-label">Single Pana</span><span class="bid-value">160x</span></div>
                <div class="bid-row"><span class="bid-label">Double Pana</span><span class="bid-value">320x</span></div>
                <div class="bid-row"><span class="bid-label">Triple Pana</span><span class="bid-value">1000x</span></div>
                <div class="bid-row"><span class="bid-label">Half Sangam A</span><span class="bid-value">1600x</span></div>
                <div class="bid-row"><span class="bid-label">Half Sangam B</span><span class="bid-value">1600x</span></div>
                <div class="bid-row"><span class="bid-label">Full Sangam</span><span class="bid-value">25000x</span></div>
            </div>
        </div>
    </div>
    
    <div class="bottom-nav">
        <div class="nav-item" onclick="location.href='dashboard.html'"><span>🏠</span><p>Home</p></div>
        <div class="nav-item active" onclick="location.href='mybids.html'"><span>📘</span><p>Passbook</p></div>
        <div class="nav-item" onclick="location.href='dashboard.html'"><span>📋</span><p>My Bids</p></div>
        <div class="nav-item" onclick="location.href='funds.html'"><span>🏦</span><p>Fund</p></div>
        <div class="nav-item" onclick="alert('Support: WhatsApp +919876543210')"><span>💬</span><p>Support</p></div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBeGpb7V0i5GN1opY9JECHxQIGvHFDPX38",
        authDomain: "win777-ed482.firebaseapp.com",
        projectId: "win777-ed482",
        storageBucket: "win777-ed482.firebasestorage.app",
        messagingSenderId: "843686112399",
        appId: "1:843686112399:web:9c20a96831e6a94cd814fa"
    };
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    
    const gameRates = {
        'Single Digit': 10, 'Jodi': 100, 'Single Pana': 160,
        'Double Pana': 320, 'Triple Pana': 1000,
        'Half Sangam A': 1600, 'Half Sangam B': 1600, 'Full Sangam': 25000
    };
    
    function showTab(tab) {
        document.getElementById('bidsTab').classList.add('hidden');
        document.getElementById('transactionsTab').classList.add('hidden');
        document.getElementById('ratesTab').classList.add('hidden');
        document.getElementById(`${tab}Tab`).classList.remove('hidden');
        
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');
        
        if (tab === 'transactions') loadTransactions();
        if (tab === 'bids') loadBids();
    }
    
    async function clearAllBids() {
        const user = auth.currentUser;
        if (!user) return;
        
        if (confirm("⚠️ WARNING: This will delete ALL your bid history permanently!\n\nThis action cannot be undone!\n\nAre you sure?")) {
            const bids = await db.collection('bids').where('userId', '==', user.uid).get();
            const batch = db.batch();
            bids.forEach(doc => batch.delete(doc.ref));
            await batch.commit();
            alert(`✅ Deleted ${bids.size} bids!`);
            loadBids();
        }
    }
    
    async function clearAllTransactions() {
        const user = auth.currentUser;
        if (!user) return;
        
        if (confirm("⚠️ WARNING: This will delete ALL your transaction history permanently!\n\nThis action cannot be undone!\n\nAre you sure?")) {
            const transactions = await db.collection('transactions').where('userId', '==', user.uid).get();
            const batch = db.batch();
            transactions.forEach(doc => batch.delete(doc.ref));
            await batch.commit();
            alert(`✅ Deleted ${transactions.size} transactions!`);
            loadTransactions();
        }
    }
    
    async function loadBids() {
        const user = auth.currentUser;
        if (!user) { 
            window.location.href = 'index.html'; 
            return; 
        }
        
        const container = document.getElementById('bidsList');
        const summaryDiv = document.getElementById('summary');
        
        container.innerHTML = '<div style="text-align:center; color:#888; padding:40px;">🔄 Loading bids...</div>';
        
        try {
            const bidsSnapshot = await db.collection('bids')
                .where('userId', '==', user.uid)
                .get();
            
            if (bidsSnapshot.empty) {
                container.innerHTML = '<div class="no-data">📭 No bids placed yet</div>';
                summaryDiv.classList.add('hidden');
                return;
            }
            
            let bids = [];
            bidsSnapshot.forEach(doc => {
                bids.push({ id: doc.id, ...doc.data() });
            });
            
            bids.sort((a, b) => {
                const dateA = a.createdAt?.toDate() || new Date(0);
                const dateB = b.createdAt?.toDate() || new Date(0);
                return dateB - dateA;
            });
            
            let totalWonAmount = 0;
            let html = '';
            
            for (const b of bids) {
                const bidAmount = b.points || 0;
                const multiplier = gameRates[b.gameType] || 10;
                
                let statusClass = '', statusText = '', winAmount = 0, winAmountHtml = '';
                let displayBidType = '';
                
                if (b.status === 'won') {
                    statusClass = 'status-won';
                    statusText = '🏆 WON';
                    winAmount = bidAmount * multiplier;
                    totalWonAmount += winAmount;
                    winAmountHtml = `<div class="bid-row"><span class="bid-label">🏆 Winning Amount</span><span class="win-amount">+ ₹${winAmount}</span></div>`;
                    // Show correct bid type based on win
                    if (b.bidType) {
                        displayBidType = `<div class="bid-row"><span class="bid-label">🎲 Won on</span><span class="bid-value">${b.bidType} Bid</span></div>`;
                    }
                } else if (b.status === 'lost') {
                    statusClass = 'status-lost';
                    statusText = '❌ LOST';
                    winAmountHtml = `<div class="bid-row"><span class="bid-label">💰 Amount Lost</span><span class="bid-value" style="color:#dc3545;">- ₹${bidAmount}</span></div>`;
                } else {
                    statusClass = 'status-pending';
                    statusText = '⏳ PENDING';
                    winAmountHtml = `<div class="bid-row"><span class="bid-label">🎯 Possible Win</span><span class="bid-value">₹${bidAmount * multiplier}</span></div>`;
                }
                
                let bidDate = 'Pending';
                if (b.createdAt && b.createdAt.toDate) {
                    bidDate = b.createdAt.toDate().toLocaleString();
                }
                
                html += `
                    <div class="bid-card">
                        <div class="bid-header">
                            <span class="market-name">📊 ${b.market || 'Unknown Market'}</span>
                            <span class="status-badge ${statusClass}">${statusText}</span>
                        </div>
                        <div class="bid-body">
                            <div class="bid-row"><span class="bid-label">🎲 Game Type</span><span class="bid-value">${b.gameType || '-'}</span></div>
                            <div class="bid-row"><span class="bid-label">🔢 Your Number</span><span class="bid-value" style="color:#00b4ff; font-size:16px;">${b.value || '-'}</span></div>
                            <div class="bid-row"><span class="bid-label">💰 Bid Amount</span><span class="bid-value">₹${bidAmount}</span></div>
                            ${displayBidType}
                            ${winAmountHtml}
                            <div class="bid-row"><span class="bid-label">📊 Rate</span><span class="bid-value">${multiplier}x</span></div>
                        </div>
                        <div class="bid-footer">📅 ${bidDate}</div>
                    </div>
                `;
            }
            
            if (totalWonAmount > 0) {
                summaryDiv.classList.remove('hidden');
                document.getElementById('totalWon').innerText = totalWonAmount;
            } else {
                summaryDiv.classList.add('hidden');
            }
            
            container.innerHTML = html;
            
        } catch (error) {
            console.error("Error loading bids:", error);
            container.innerHTML = `<div class="no-data" style="color:#dc3545;">❌ Error loading bids: ${error.message}</div>`;
        }
    }
    
    async function loadTransactions() {
        const user = auth.currentUser;
        if (!user) return;
        
        const container = document.getElementById('transactionsList');
        container.innerHTML = '<div style="text-align:center; color:#888; padding:40px;">🔄 Loading transactions...</div>';
        
        try {
            const transactionsSnapshot = await db.collection('transactions')
                .where('userId', '==', user.uid)
                .get();
            
            if (transactionsSnapshot.empty) {
                container.innerHTML = '<div class="no-data">📭 No transactions yet</div>';
                return;
            }
            
            let transactions = [];
            transactionsSnapshot.forEach(doc => {
                transactions.push({ id: doc.id, ...doc.data() });
            });
            
            transactions.sort((a, b) => {
                const dateA = a.date?.toDate() || new Date(0);
                const dateB = b.date?.toDate() || new Date(0);
                return dateB - dateA;
            });
            
            let html = '';
            for (const t of transactions) {
                const date = t.date?.toDate() || new Date();
                const dateStr = date.toLocaleDateString();
                const timeStr = date.toLocaleTimeString();
                const isCredit = t.type === 'credit';
                let statusColor = '#ff9800', statusText = '⏳ Pending';
                
                if (t.status === 'Completed') {
                    statusColor = '#28a745';
                    statusText = '✅ Completed';
                } else if (t.status === 'Rejected') {
                    statusColor = '#dc3545';
                    statusText = '❌ Rejected';
                }
                
                html += `
                    <div class="bid-card">
                        <div class="bid-header">
                            <span class="market-name">${isCredit ? '💰 DEPOSIT' : '💸 WITHDRAWAL'}</span>
                            <span style="color:${statusColor};">${statusText}</span>
                        </div>
                        <div class="bid-body">
                            <div class="bid-row"><span class="bid-label">Amount</span><span class="bid-value" style="color:${isCredit ? '#28a745' : '#ff9800'}; font-size:18px;">${isCredit ? '+' : '-'} ₹${t.amount}</span></div>
                            <div class="bid-row"><span class="bid-label">Date</span><span class="bid-value">${dateStr}</span></div>
                            <div class="bid-row"><span class="bid-label">Time</span><span class="bid-value">${timeStr}</span></div>
                            ${t.description ? `<div class="bid-row"><span class="bid-label">Description</span><span class="bid-value">${t.description}</span></div>` : ''}
                        </div>
                        <div class="bid-footer">📅 Transaction ID: ${t.id.substring(0, 8)}...</div>
                    </div>
                `;
            }
            container.innerHTML = html;
            
        } catch (error) {
            console.error("Error loading transactions:", error);
            container.innerHTML = `<div class="no-data" style="color:#dc3545;">❌ Error loading transactions: ${error.message}</div>`;
        }
    }
    
    auth.onAuthStateChanged(user => {
        if (!user) {
            window.location.href = 'index.html';
        } else {
            loadBids();
        }
    });
    
    window.showTab = showTab;
    window.clearAllBids = clearAllBids;
    window.clearAllTransactions = clearAllTransactions;
</script>
</body>
</html>
