<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WIN777 - My Bids</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0a0a0f; padding-bottom: 70px; }
        .app-container { max-width: 500px; margin: 0 auto; background: #0a0a0f; min-height: 100vh; }
        .header { background: #0a0a0f; padding: 15px 20px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #00b4ff; }
        .logo { color: #00b4ff; font-size: 20px; font-weight: bold; flex: 1; text-align: center; }
        .back-btn { background: none; border: none; color: #00b4ff; font-size: 24px; cursor: pointer; }
        .bid-card { background: #1a1a2e; margin: 12px; border-radius: 16px; overflow: hidden; border: 1px solid #00b4ff; }
        .bid-header { padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #00b4ff20; }
        .market-name { color: #00b4ff; font-size: 16px; font-weight: bold; }
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .status-won { background: #4caf5020; color: #4caf50; border: 1px solid #4caf50; }
        .status-lost { background: #f4433620; color: #f44336; border: 1px solid #f44336; }
        .status-pending { background: #ff980020; color: #ff9800; border: 1px solid #ff9800; }
        .bid-body { padding: 15px; }
        .bid-row { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .bid-label { color: #888; font-size: 13px; }
        .bid-value { color: white; font-weight: bold; font-size: 14px; }
        .win-amount { color: #4caf50; font-size: 18px; font-weight: bold; }
        .lost-amount { color: #f44336; }
        .bid-footer { background: #0a0a0f; padding: 10px 15px; font-size: 11px; color: #666; text-align: right; }
        .no-data { text-align: center; color: #888; padding: 60px 20px; }
        .summary-bar { background: linear-gradient(135deg, #00b4ff, #0099cc); margin: 12px; padding: 15px; border-radius: 16px; text-align: center; }
        .summary-title { color: #000; font-size: 12px; opacity: 0.8; }
        .summary-value { color: #000; font-size: 24px; font-weight: bold; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; max-width: 500px; margin: 0 auto; background: #1a1a2e; display: flex; justify-content: space-around; padding: 12px; border-top: 1px solid #00b4ff; }
        .nav-item { text-align: center; color: #aaa; cursor: pointer; font-size: 11px; }
        .nav-item span { font-size: 22px; display: block; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <button class="back-btn" onclick="location.href='dashboard.html'">←</button>
        <div class="logo">MY BIDS</div>
        <div style="width:30px;"></div>
    </div>
    
    <div id="summary" class="summary-bar hidden">
        <div class="summary-title">Total Won</div>
        <div class="summary-value">₹<span id="totalWon">0</span></div>
    </div>
    
    <div id="bidsList"></div>
    
    <div class="bottom-nav">
        <div class="nav-item" onclick="location.href='dashboard.html'"><span>🏠</span><p>Home</p></div>
        <div class="nav-item" onclick="location.href='mybids.html'"><span>📘</span><p>My Bids</p></div>
        <div class="nav-item" onclick="location.href='deposit.html'"><span>💰</span><p>Deposit</p></div>
        <div class="nav-item" onclick="alert('Support: WhatsApp +919876543210')"><span>💬</span><p>Support</p></div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBeGpb7V0i5GN1opY9JECHxQIGvHFDPX38",
        authDomain: "win777-ed482.firebaseapp.com",
        projectId: "win777-ed482",
        storageBucket: "win777-ed482.firebasestorage.app",
        messagingSenderId: "843686112399",
        appId: "1:843686112399:web:9c20a96831e6a94cd814fa"
    };
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    
    const gameRates = {
        'Single Digit': 10, 'Jodi': 100, 'Single Pana': 160,
        'Double Pana': 320, 'Triple Pana': 1000,
        'Half Sangam A': 1600, 'Half Sangam B': 1600, 'Full Sangam': 25000
    };
    
    async function loadBids() {
        const user = auth.currentUser;
        if (!user) { window.location.href = 'index.html'; return; }
        
        const bids = await db.collection('bids')
            .where('userId', '==', user.uid)
            .orderBy('createdAt', 'desc')
            .get();
        
        const container = document.getElementById('bidsList');
        const summaryDiv = document.getElementById('summary');
        
        if (bids.empty) {
            container.innerHTML = '<div class="no-data">📭 No bids placed yet<br><small>Go to dashboard and place your first bid!</small></div>';
            summaryDiv.classList.add('hidden');
            return;
        }
        
        let totalWonAmount = 0;
        let html = '';
        
        for (const doc of bids.docs) {
            const b = doc.data();
            const bidAmount = b.points || 0;
            const multiplier = gameRates[b.gameType] || 10;
            const possibleWin = bidAmount * multiplier;
            
            let statusClass = '';
            let statusText = '';
            let winAmount = 0;
            let winAmountHtml = '';
            
            if (b.status === 'won') {
                statusClass = 'status-won';
                statusText = '🏆 WON';
                winAmount = bidAmount * multiplier;
                totalWonAmount += winAmount;
                winAmountHtml = `
                    <div class="bid-row">
                        <span class="bid-label">🏆 Winning Amount</span>
                        <span class="win-amount">+ ₹${winAmount}</span>
                    </div>
                `;
            } else if (b.status === 'lost') {
                statusClass = 'status-lost';
                statusText = '❌ LOST';
                winAmountHtml = `
                    <div class="bid-row">
                        <span class="bid-label">💰 Amount Lost</span>
                        <span class="lost-amount">- ₹${bidAmount}</span>
                    </div>
                `;
            } else {
                statusClass = 'status-pending';
                statusText = '⏳ PENDING';
                winAmountHtml = `
                    <div class="bid-row">
                        <span class="bid-label">🎯 Possible Win</span>
                        <span class="bid-value">₹${possibleWin}</span>
                    </div>
                `;
            }
            
            // Format date
            let bidDate = 'Pending';
            if (b.createdAt && b.createdAt.toDate) {
                bidDate = b.createdAt.toDate().toLocaleString();
            }
            
            html += `
                <div class="bid-card">
                    <div class="bid-header">
                        <span class="market-name">${b.market || 'Unknown Market'}</span>
                        <span class="status-badge ${statusClass}">${statusText}</span>
                    </div>
                    <div class="bid-body">
                        <div class="bid-row">
                            <span class="bid-label">🎲 Game Type</span>
                            <span class="bid-value">${b.gameType || '-'}</span>
                        </div>
                        <div class="bid-row">
                            <span class="bid-label">🔢 Your Number</span>
                            <span class="bid-value" style="color:#00b4ff; font-size:16px;">${b.value || '-'}</span>
                        </div>
                        <div class="bid-row">
                            <span class="bid-label">💰 Bid Amount</span>
                            <span class="bid-value">₹${bidAmount}</span>
                        </div>
                        ${winAmountHtml}
                        ${b.bidType ? `<div class="bid-row">
                            <span class="bid-label">🎲 Bid Type</span>
                            <span class="bid-value">${b.bidType}</span>
                        </div>` : ''}
                    </div>
                    <div class="bid-footer">
                        📅 ${bidDate}
                    </div>
                </div>
            `;
        }
        
        if (totalWonAmount > 0) {
            summaryDiv.classList.remove('hidden');
            document.getElementById('totalWon').innerText = totalWonAmount;
        } else {
            summaryDiv.classList.add('hidden');
        }
        
        container.innerHTML = html;
    }
    
    auth.onAuthStateChanged(user => {
        if (!user) window.location.href = 'index.html';
        else loadBids();
    });
</script>
</body>
</html>
