<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WIN777 - Change MPIN</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0a0a0f; padding: 20px; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { max-width: 400px; width: 100%; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: #ff9800; font-size: 28px; }
        .card {
            background: linear-gradient(135deg, #1a1a2e, #12121f);
            border-radius: 30px;
            padding: 30px;
            border: 1px solid rgba(255,152,0,0.2);
        }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; color: #aaa; margin-bottom: 8px; font-size: 13px; }
        .input-group input {
            width: 100%;
            padding: 14px;
            background: #0a0a0f;
            border: 1px solid #333;
            border-radius: 16px;
            color: white;
            font-size: 18px;
            text-align: center;
            letter-spacing: 8px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff9800, #ff5722);
            border: none;
            border-radius: 16px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .back-btn {
            background: transparent;
            border: 1px solid #ff9800;
            margin-top: 10px;
        }
        .message {
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
        }
        .error { color: #f44336; }
        .success { color: #4caf50; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Change MPIN</h1>
        </div>
        <div class="card">
            <div class="input-group">
                <label>Old MPIN</label>
                <input type="password" id="oldMpin" maxlength="4" placeholder="••••">
            </div>
            <div class="input-group">
                <label>New MPIN</label>
                <input type="password" id="newMpin" maxlength="4" placeholder="••••">
            </div>
            <button id="saveBtn">Save</button>
            <button class="back-btn" onclick="goBack()">← Back</button>
            <div id="message" class="message"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBeGpb7V0i5GN1opY9JECHxQIGvHFDPX38",
            authDomain: "win777-ed482.firebaseapp.com",
            projectId: "win777-ed482",
            storageBucket: "win777-ed482.firebasestorage.app",
            messagingSenderId: "843686112399",
            appId: "1:843686112399:web:9c20a96831e6a94cd814fa"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        document.getElementById('saveBtn').addEventListener('click', async () => {
            const oldMpin = document.getElementById('oldMpin').value;
            const newMpin = document.getElementById('newMpin').value;
            const msgDiv = document.getElementById('message');
            
            if (!oldMpin || oldMpin.length !== 4) { msgDiv.innerHTML = 'Enter old MPIN'; msgDiv.className = 'message error'; return; }
            if (!newMpin || newMpin.length !== 4) { msgDiv.innerHTML = 'Enter new MPIN (4 digits)'; msgDiv.className = 'message error'; return; }
            
            const user = auth.currentUser;
            if (!user) { window.location.href = 'index.html'; return; }
            
            const userDoc = await db.collection('users').doc(user.uid).get();
            if (userDoc.data().pin !== oldMpin) {
                msgDiv.innerHTML = '❌ Old MPIN is incorrect';
                msgDiv.className = 'message error';
                return;
            }
            
            await db.collection('users').doc(user.uid).update({ pin: newMpin });
            msgDiv.innerHTML = '✅ MPIN changed successfully!';
            msgDiv.className = 'message success';
            setTimeout(() => goBack(), 1500);
        });
        
        function goBack() { window.location.href = 'dashboard.html'; }
        
        auth.onAuthStateChanged((user) => { if (!user) window.location.href = 'index.html'; });
    </script>
</body>
</html>
