<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WIN777 - Add Fund</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
        body{background:#0a0a0f;min-height:100vh;padding:20px}
        .container{max-width:450px;margin:0 auto}
        .header{display:flex;align-items:center;gap:15px;margin-bottom:20px}
        .back-btn{background:#1a1a2e;border:none;color:#0096ff;font-size:24px;width:40px;height:40px;border-radius:12px;cursor:pointer;border:1px solid #0096ff}
        .header h1{color:#0096ff;font-size:24px;flex:1}
        .user-card{background:#1a1a2e;border-radius:20px;padding:15px 20px;margin-bottom:20px;border:1px solid #0096ff;display:flex;justify-content:space-between;align-items:center}
        .user-name{color:white;font-size:16px;font-weight:bold}
        .user-phone{color:#888;font-size:12px;margin-top:4px}
        .balance-amount{color:#0096ff;font-size:20px;font-weight:bold}
        .balance-card{background:linear-gradient(135deg,#0096ff,#00ffaa);border-radius:20px;padding:20px;text-align:center;margin-bottom:25px}
        .balance-card .label{color:rgba(255,255,255,0.8);font-size:14px}
        .balance-card .amount{color:white;font-size:36px;font-weight:bold;margin-top:5px}
        .amount-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:25px}
        .amount-btn{background:#1a1a2e;border:1px solid #0096ff;border-radius:16px;padding:14px;text-align:center;color:white;font-size:18px;font-weight:bold;cursor:pointer}
        .amount-btn.active{background:#0096ff;color:#1a1a2e}
        .custom-amount{margin-bottom:25px}
        .custom-amount input{width:100%;padding:14px;background:#1a1a2e;border:1px solid #0096ff;border-radius:16px;color:white;font-size:16px;text-align:center}
        .upi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin-bottom:25px}
        .upi-btn{background:#1a1a2e;border:1px solid #0096ff;border-radius:16px;padding:15px;text-align:center;cursor:pointer}
        .upi-icon{font-size:32px;margin-bottom:8px}
        .upi-name{color:white;font-size:14px;font-weight:bold}
        .add-fund-btn{width:100%;padding:16px;background:linear-gradient(135deg,#0096ff,#00ffaa);border:none;border-radius:20px;color:#1a1a2e;font-size:18px;font-weight:bold;cursor:pointer;margin-bottom:15px}
        .timer-box{background:#1a1a2e;border-radius:16px;padding:15px;text-align:center;margin-top:20px;border:1px solid #ff9800}
        .timer-text{color:#ff9800;font-size:28px;font-weight:bold;font-family:monospace}
        .timer-label{color:#aaa;font-size:12px;margin-top:5px}
        .message{padding:12px;border-radius:12px;text-align:center;margin-top:15px;font-size:13px}
        .message-success{background:#4caf5020;color:#4caf50;border:1px solid #4caf50}
        .message-error{background:#f4433620;color:#f44336;border:1px solid #f44336}
        .message-pending{background:#ff980020;color:#ff9800;border:1px solid #ff9800}
        .hidden{display:none}
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <button class="back-btn" onclick="goBack()">←</button>
        <h1>ADD FUND</h1>
    </div>

    <div class="user-card">
        <div><div class="user-name" id="userName">Loading...</div><div class="user-phone" id="userPhone">Loading...</div></div>
        <div><div class="balance-label">Balance</div><div class="balance-amount">₹<span id="userBalance">0</span></div></div>
    </div>

    <div class="balance-card"><div class="label">Available Balance</div><div class="amount">₹<span id="balanceAmount">0</span></div></div>

    <div class="amount-grid">
        <div class="amount-btn" onclick="selectAmount(100)">₹100</div>
        <div class="amount-btn" onclick="selectAmount(500)">₹500</div>
        <div class="amount-btn" onclick="selectAmount(1000)">₹1000</div>
        <div class="amount-btn" onclick="selectAmount(2000)">₹2000</div>
        <div class="amount-btn" onclick="selectAmount(5000)">₹5000</div>
        <div class="amount-btn" onclick="selectAmount(7000)">₹7000</div>
    </div>

    <div class="custom-amount"><input type="number" id="customAmount" placeholder="Enter custom amount"></div>

    <div class="upi-grid">
        <div class="upi-btn" onclick="payWithUPI('PhonePe')"><div class="upi-icon">📱</div><div class="upi-name">PhonePe</div></div>
        <div class="upi-btn" onclick="payWithUPI('Paytm')"><div class="upi-icon">📱</div><div class="upi-name">Paytm</div></div>
        <div class="upi-btn" onclick="payWithUPI('GooglePay')"><div class="upi-icon">📱</div><div class="upi-name">Google Pay</div></div>
        <div class="upi-btn" onclick="payWithUPI('JioFinance')"><div class="upi-icon">📱</div><div class="upi-name">JioFinance</div></div>
    </div>

    <button class="add-fund-btn" id="addFundBtn">Add Fund</button>

    <div id="timerBox" class="timer-box hidden">
        <div class="timer-text" id="countdownTimer">05:00</div>
        <div class="timer-label">⏳ Waiting for admin approval...</div>
    </div>
    <div id="message" class="message hidden"></div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBeGpb7V0i5GN1opY9JECHxQIGvHFDPX38",
        authDomain: "win777-ed482.firebaseapp.com",
        projectId: "win777-ed482",
        storageBucket: "win777-ed482.firebasestorage.app",
        messagingSenderId: "843686112399",
        appId: "1:843686112399:web:9c20a96831e6a94cd814fa"
    };
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    
    let currentUser = null;
    let userData = null;
    let selectedAmount = 100;
    let currentTransactionId = null;
    let timerInterval = null;
    const UPI_ID = "savithakcanara@ybl";
    
    async function loadUserData() {
        const user = auth.currentUser;
        if (!user) { window.location.href = 'index.html'; return; }
        currentUser = user;
        const doc = await db.collection('users').doc(user.uid).get();
        if (doc.exists) {
            userData = doc.data();
            document.getElementById('userName').innerHTML = userData?.name || 'User';
            document.getElementById('userPhone').innerHTML = userData?.phone || '';
            document.getElementById('userBalance').innerText = userData?.balance || 0;
            document.getElementById('balanceAmount').innerText = userData?.balance || 0;
        }
    }
    
    function selectAmount(amount) {
        selectedAmount = amount;
        document.querySelectorAll('.amount-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById('customAmount').value = '';
    }
    
    function showMessage(msg, type) {
        const msgDiv = document.getElementById('message');
        msgDiv.innerText = msg;
        msgDiv.className = `message message-${type}`;
        msgDiv.classList.remove('hidden');
        setTimeout(() => msgDiv.classList.add('hidden'), 5000);
    }
    
    async function createDepositRequest(amount) {
        const transactionRef = await db.collection('transactions').add({
            userId: currentUser.uid, type: 'credit', amount: amount, status: 'Pending', date: new Date(), upiId: UPI_ID
        });
        currentTransactionId = transactionRef.id;
        return transactionRef.id;
    }
    
    function startTimerAndWait() {
        const timerBox = document.getElementById('timerBox');
        timerBox.classList.remove('hidden');
        let timeLeft = 300;
        const timerDisplay = document.getElementById('countdownTimer');
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            if (timeLeft <= 0) { clearInterval(timerInterval); timerBox.classList.add('hidden'); }
        }, 1000);
        
        if (currentTransactionId) {
            db.collection('transactions').doc(currentTransactionId).onSnapshot((doc) => {
                if (doc.exists && doc.data().status === 'Completed') {
                    clearInterval(timerInterval);
                    timerBox.classList.add('hidden');
                    showMessage('✅ Payment successful! Balance updated.', 'success');
                    loadUserData();
                    setTimeout(() => window.location.href = 'dashboard.html', 2000);
                }
            });
        }
    }
    
    async function payWithUPI(appName) {
        let amount = selectedAmount;
        const customAmount = parseInt(document.getElementById('customAmount').value);
        if (customAmount >= 100) amount = customAmount;
        if (amount < 100) { showMessage('Minimum deposit is ₹100', 'error'); return; }
        if (amount > 50000) { showMessage('Maximum deposit is ₹50000', 'error'); return; }
        
        showMessage('Creating deposit request...', 'pending');
        await createDepositRequest(amount);
        showMessage(`✅ Deposit request of ₹${amount} created!`, 'success');
        
        setTimeout(() => {
            const upiIntent = `upi://pay?pa=${UPI_ID}&pn=WIN777&am=${amount}&cu=INR`;
            window.location.href = upiIntent;
        }, 1500);
        
        setTimeout(() => {
            if (confirm(`Did you successfully pay ₹${amount}?`)) {
                startTimerAndWait();
            } else {
                showMessage('Payment not confirmed. Request pending for admin approval.', 'pending');
                startTimerAndWait();
            }
        }, 5000);
    }
    
    document.getElementById('addFundBtn').onclick = async () => {
        let amount = selectedAmount;
        const customAmount = parseInt(document.getElementById('customAmount').value);
        if (customAmount >= 100) amount = customAmount;
        if (amount < 100) { showMessage('Minimum deposit is ₹100', 'error'); return; }
        if (amount > 50000) { showMessage('Maximum deposit is ₹50000', 'error'); return; }
        
        showMessage('Creating deposit request...', 'pending');
        await createDepositRequest(amount);
        showMessage(`✅ Deposit request of ₹${amount} created!`, 'success');
        
        setTimeout(() => {
            const upiIntent = `upi://pay?pa=${UPI_ID}&pn=WIN777&am=${amount}&cu=INR`;
            window.location.href = upiIntent;
        }, 1500);
        
        setTimeout(() => {
            if (confirm(`Did you successfully pay ₹${amount}?`)) {
                startTimerAndWait();
            } else {
                showMessage('Payment not confirmed. Request pending for admin approval.', 'pending');
                startTimerAndWait();
            }
        }, 5000);
    };
    
    function goBack() { window.location.href = 'dashboard.html'; }
    
    auth.onAuthStateChanged(async (user) => {
        if (!user) window.location.href = 'index.html';
        else { await loadUserData(); document.querySelector('.amount-btn').classList.add('active'); }
    });
</script>
</body>
</html>
