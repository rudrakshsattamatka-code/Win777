<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WIN777 - Deposit</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #e8f4f8; padding-bottom: 70px; }
        .container { max-width: 450px; margin: 0 auto; padding: 20px; }
        
        .header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .back-btn { background: #fff; border: none; color: #00b4ff; font-size: 24px; width: 40px; height: 40px; border-radius: 12px; cursor: pointer; border: 1px solid #d4eaf5; }
        .header h1 { color: #00b4ff; font-size: 24px; flex: 1; text-align: center; }
        
        .amount-card { background: #fff; border-radius: 20px; padding: 20px; margin-bottom: 20px; border: 1px solid #d4eaf5; }
        .amount-card h3 { color: #333; margin-bottom: 15px; }
        
        .amount-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
        .amount-btn { background: #f8f9fa; border: 1px solid #d4eaf5; border-radius: 16px; padding: 14px; text-align: center; color: #333; font-size: 18px; font-weight: bold; cursor: pointer; }
        .amount-btn.active { background: #00b4ff; color: #fff; }
        
        .custom-amount input { width: 100%; padding: 14px; background: #fff; border: 1px solid #d4eaf5; border-radius: 12px; color: #333; font-size: 16px; }
        
        .bonus-box { background: #fff; border-radius: 16px; padding: 15px; margin: 15px 0; border: 1px solid #d4eaf5; display: flex; align-items: center; justify-content: space-between; }
        .bonus-text { color: #28a745; font-size: 12px; margin-top: 5px; }
        
        .pay-btn { width: 100%; padding: 18px; background: #00b4ff; border: none; border-radius: 16px; color: #fff; font-size: 18px; font-weight: bold; cursor: pointer; margin: 15px 0; }
        .pay-btn:hover { background: #0099cc; }
        
        .upi-info { background: #fff; border-radius: 16px; padding: 15px; margin: 15px 0; text-align: center; border: 1px solid #d4eaf5; }
        .upi-id { font-size: 20px; font-weight: bold; color: #00b4ff; margin: 10px 0; }
        
        .timer-box { background: #fff; border-radius: 16px; padding: 15px; text-align: center; margin-top: 20px; border: 1px solid #ffe0b3; }
        .timer-text { color: #ff9800; font-size: 32px; font-weight: bold; }
        
        .message { padding: 12px; border-radius: 12px; text-align: center; margin-top: 15px; }
        .message-success { background: #d4edda; color: #155724; }
        .message-error { background: #f8d7da; color: #721c24; }
        
        .hidden { display: none; }
        .summary { background: #f0f8ff; padding: 12px; border-radius: 12px; text-align: center; margin: 10px 0; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <button class="back-btn" onclick="goBack()">←</button>
        <h1>ADD FUNDS</h1>
        <div style="width:40px;"></div>
    </div>
    
    <div class="amount-card">
        <h3>💰 Select Amount</h3>
        <div class="amount-grid">
            <div class="amount-btn" onclick="selectAmount(100)">₹100</div>
            <div class="amount-btn" onclick="selectAmount(500)">₹500</div>
            <div class="amount-btn" onclick="selectAmount(1000)">₹1000</div>
            <div class="amount-btn" onclick="selectAmount(2000)">₹2000</div>
            <div class="amount-btn" onclick="selectAmount(5000)">₹5000</div>
            <div class="amount-btn" onclick="selectAmount(10000)">₹10000</div>
        </div>
        <div class="custom-amount">
            <input type="number" id="customAmount" placeholder="Enter custom amount" oninput="updateSummary()">
        </div>
    </div>
    
    <div class="bonus-box">
        <div>
            <label>🎁 Apply 10% Bonus</label>
            <div class="bonus-text">Get 10% extra on deposit above ₹500</div>
        </div>
        <input type="checkbox" id="applyBonus" onchange="updateSummary()">
    </div>
    
    <div class="summary" id="summaryBox">
        💰 You will receive: ₹<span id="totalAmount">100</span>
    </div>
    
    <div class="upi-info">
        <div>📱 Send payment to this UPI ID</div>
        <div class="upi-id" id="upiIdDisplay">ganeshpatil99@slc</div>
        <div style="font-size: 12px; color: #888;">Payee: Ganesh Siddharth Patil</div>
    </div>
    
    <button class="pay-btn" id="payBtn" onclick="directPay()">
        💳 PAY ₹<span id="payAmount">100</span> NOW
    </button>
    
    <div id="message" class="message hidden"></div>
    <div id="timerBox" class="timer-box hidden">
        <div class="timer-text" id="countdownTimer">05:00</div>
        <div>⏳ Waiting for admin confirmation...</div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBeGpb7V0i5GN1opY9JECHxQIGvHFDPX38",
        authDomain: "win777-ed482.firebaseapp.com",
        projectId: "win777-ed482",
        storageBucket: "win777-ed482.firebasestorage.app",
        messagingSenderId: "843686112399",
        appId: "1:843686112399:web:9c20a96831e6a94cd814fa"
    };
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    
    let currentUser = null;
    let selectedAmount = 100;
    let currentTransactionId = null;
    let timerInterval = null;
    let upiId = "ganeshpatil99@slc";
    let upiName = "Ganesh Siddharth Patil";
    
    async function loadUpiId() {
        const doc = await db.collection('settings').doc('upi').get();
        if (doc.exists && doc.data().upiId) {
            upiId = doc.data().upiId;
            document.getElementById('upiIdDisplay').innerText = upiId;
        }
    }
    
    auth.onAuthStateChanged(async (user) => {
        if (!user) {
            window.location.href = 'index.html';
        } else {
            currentUser = user;
            await loadUpiId();
            updateSummary();
        }
    });
    
    function selectAmount(amount) {
        selectedAmount = amount;
        document.querySelectorAll('.amount-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById('customAmount').value = '';
        updateSummary();
    }
    
    function updateSummary() {
        let amount = selectedAmount;
        const custom = parseInt(document.getElementById('customAmount').value);
        if (custom && custom >= 100) amount = custom;
        
        const applyBonus = document.getElementById('applyBonus').checked;
        let bonus = 0;
        if (applyBonus && amount >= 500) {
            bonus = Math.floor(amount * 0.10);
        }
        const total = amount + bonus;
        document.getElementById('totalAmount').innerText = total;
        document.getElementById('payAmount').innerText = amount;
    }
    
    function getAmount() {
        let amount = selectedAmount;
        const custom = parseInt(document.getElementById('customAmount').value);
        if (custom && custom >= 100) amount = custom;
        return amount;
    }
    
    function getBonusAmount(amount) {
        const applyBonus = document.getElementById('applyBonus').checked;
        if (applyBonus && amount >= 500) {
            return Math.floor(amount * 0.10);
        }
        return 0;
    }
    
    function showMessage(msg, type) {
        const msgDiv = document.getElementById('message');
        msgDiv.innerText = msg;
        msgDiv.className = `message message-${type}`;
        msgDiv.classList.remove('hidden');
        setTimeout(() => msgDiv.classList.add('hidden'), 5000);
    }
    
    async function createDepositRequest(amount, bonusAmount) {
        const totalAmount = amount + bonusAmount;
        const transactionRef = await db.collection('transactions').add({
            userId: currentUser.uid,
            type: 'credit',
            amount: totalAmount,
            requestedAmount: amount,
            bonusAmount: bonusAmount,
            status: 'Pending',
            date: new Date(),
            upiId: upiId
        });
        currentTransactionId = transactionRef.id;
        return transactionRef.id;
    }
    
    function startTimerAndWait() {
        const timerBox = document.getElementById('timerBox');
        timerBox.classList.remove('hidden');
        let timeLeft = 300;
        const timerDisplay = document.getElementById('countdownTimer');
        
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                timerBox.classList.add('hidden');
                showMessage('Time expired! Please create new request.', 'error');
            }
        }, 1000);
        
        if (currentTransactionId) {
            db.collection('transactions').doc(currentTransactionId).onSnapshot((doc) => {
                if (doc.exists && doc.data().status === 'Completed') {
                    clearInterval(timerInterval);
                    timerBox.classList.add('hidden');
                    showMessage(`✅ ₹${doc.data().amount} added successfully!`, 'success');
                    setTimeout(() => window.location.href = 'dashboard.html', 2000);
                }
            });
        }
    }
    
    function directPay() {
        const amount = getAmount();
        
        if (amount < 100) {
            showMessage('Minimum amount is ₹100', 'error');
            return;
        }
        if (amount > 50000) {
            showMessage('Maximum amount is ₹50,000', 'error');
            return;
        }
        
        const bonusAmount = getBonusAmount(amount);
        
        // Create the UPI link with correct format
        // This is the standard format that works on all UPI apps
        const upiLink = `upi://pay?pa=${upiId}&pn=${encodeURIComponent(upiName)}&am=${amount}&cu=INR&tn=Deposit%20to%20WIN777`;
        
        // Show confirmation
        const confirmMsg = `💰 PAYMENT DETAILS\n\nAmount: ₹${amount}\nBonus: +₹${bonusAmount}\nTotal You Get: ₹${amount + bonusAmount}\n\nUPI ID: ${upiId}\nPayee: ${upiName}\n\nClick OK to open UPI app and pay ₹${amount}`;
        
        if (!confirm(confirmMsg)) return;
        
        // Create deposit request
        createDepositRequest(amount, bonusAmount).then(() => {
            // Open UPI app
            window.location.href = upiLink;
            
            // Ask for confirmation after returning
            setTimeout(() => {
                if (confirm(`✅ Did you successfully pay ₹${amount}?\n\nClick OK after completing the payment.`)) {
                    showMessage(`✅ Payment recorded! Waiting for admin approval...`, 'success');
                    startTimerAndWait();
                } else {
                    showMessage(`⏳ Payment pending. Admin will verify.`, 'success');
                    startTimerAndWait();
                }
            }, 8000);
        }).catch(err => {
            showMessage('Error: ' + err.message, 'error');
        });
    }
    
    function goBack() {
        window.location.href = 'dashboard.html';
    }
    
    document.getElementById('customAmount').addEventListener('input', updateSummary);
    
    window.selectAmount = selectAmount;
    window.updateSummary = updateSummary;
    window.directPay = directPay;
</script>
</body>
</html>
