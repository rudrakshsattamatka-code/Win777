<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WIN777 - Withdraw</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
        body{background:#0a0a0f;min-height:100vh;padding:20px}
        .container{max-width:450px;margin:0 auto}
        .header{display:flex;align-items:center;gap:15px;margin-bottom:20px}
        .back-btn{background:#1a1a2e;border:none;color:#0096ff;font-size:24px;width:40px;height:40px;border-radius:12px;cursor:pointer;border:1px solid #0096ff}
        .header h1{color:#0096ff;font-size:24px;flex:1}
        .user-card{background:#1a1a2e;border-radius:20px;padding:15px 20px;margin-bottom:20px;border:1px solid #0096ff;display:flex;justify-content:space-between;align-items:center}
        .user-name{color:white;font-size:16px;font-weight:bold}
        .user-phone{color:#888;font-size:12px;margin-top:4px}
        .balance-amount{color:#0096ff;font-size:20px;font-weight:bold}
        .balance-card{background:linear-gradient(135deg,#0096ff,#00ffaa);border-radius:20px;padding:20px;text-align:center;margin-bottom:25px}
        .balance-card .amount{color:white;font-size:36px;font-weight:bold}
        .bank-select{margin-bottom:20px}
        .bank-select select{width:100%;padding:14px;background:#1a1a2e;border:1px solid #0096ff;border-radius:16px;color:white;font-size:16px}
        .amount-input{margin-bottom:20px}
        .amount-input input{width:100%;padding:14px;background:#1a1a2e;border:1px solid #0096ff;border-radius:16px;color:white;font-size:16px;text-align:center}
        .withdraw-btn{width:100%;padding:16px;background:linear-gradient(135deg,#0096ff,#00ffaa);border:none;border-radius:20px;color:#1a1a2e;font-size:18px;font-weight:bold;cursor:pointer}
        .message{padding:12px;border-radius:12px;text-align:center;margin-top:15px;font-size:13px}
        .message-success{background:#4caf5020;color:#4caf50;border:1px solid #4caf50}
        .message-error{background:#f4433620;color:#f44336;border:1px solid #f44336}
        .message-pending{background:#ff980020;color:#ff9800;border:1px solid #ff9800}
        .hidden{display:none}
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <button class="back-btn" onclick="goBack()">←</button>
        <h1>WITHDRAW FUND</h1>
    </div>

    <div class="user-card">
        <div><div class="user-name" id="userName">Loading...</div><div class="user-phone" id="userPhone">Loading...</div></div>
        <div><div class="balance-label">Balance</div><div class="balance-amount">₹<span id="userBalance">0</span></div></div>
    </div>

    <div class="balance-card"><div class="amount">₹<span id="balanceAmount">0</span></div></div>

    <div class="bank-select">
        <select id="bankSelect">
            <option value="">Select Bank Account</option>
        </select>
    </div>

    <div class="amount-input">
        <input type="number" id="withdrawAmount" placeholder="Enter amount (Min ₹500)">
    </div>

    <button class="withdraw-btn" id="withdrawBtn">Request Withdrawal</button>
    <div id="message" class="message hidden"></div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBeGpb7V0i5GN1opY9JECHxQIGvHFDPX38",
        authDomain: "win777-ed482.firebaseapp.com",
        projectId: "win777-ed482",
        storageBucket: "win777-ed482.firebasestorage.app",
        messagingSenderId: "843686112399",
        appId: "1:843686112399:web:9c20a96831e6a94cd814fa"
    };
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    
    let currentUser = null;
    let userData = null;
    
    async function loadUserData() {
        const user = auth.currentUser;
        if (!user) { window.location.href = 'index.html'; return; }
        currentUser = user;
        const doc = await db.collection('users').doc(user.uid).get();
        if (doc.exists) {
            userData = doc.data();
            document.getElementById('userName').innerHTML = userData?.name || 'User';
            document.getElementById('userPhone').innerHTML = userData?.phone || '';
            document.getElementById('userBalance').innerText = userData?.balance || 0;
            document.getElementById('balanceAmount').innerText = userData?.balance || 0;
            
            if (userData?.bankDetails) {
                const select = document.getElementById('bankSelect');
                select.innerHTML = `<option value="saved">${userData.bankDetails.bankName} - ${userData.bankDetails.accNumber}</option>`;
                select.innerHTML += `<option value="new">+ Add New Bank</option>`;
            } else {
                document.getElementById('bankSelect').innerHTML = '<option value="">Please add bank details first</option>';
            }
        }
    }
    
    function showMessage(msg, type) {
        const msgDiv = document.getElementById('message');
        msgDiv.innerText = msg;
        msgDiv.className = `message message-${type}`;
        msgDiv.classList.remove('hidden');
        setTimeout(() => msgDiv.classList.add('hidden'), 5000);
    }
    
    document.getElementById('withdrawBtn').onclick = async () => {
        const amount = parseInt(document.getElementById('withdrawAmount').value);
        if (amount < 500) { showMessage('Minimum withdrawal is ₹500', 'error'); return; }
        if (amount > (userData?.balance || 0)) { showMessage(`Insufficient balance! You have ₹${userData?.balance || 0}`, 'error'); return; }
        
        let bankDetails = userData?.bankDetails;
        if (document.getElementById('bankSelect').value === 'new') {
            bankDetails = {
                accName: prompt('Account Holder Name'),
                bankName: prompt('Bank Name'),
                accNumber: prompt('Account Number'),
                ifsc: prompt('IFSC Code')
            };
            if (!bankDetails.accName) return;
        }
        
        if (!bankDetails) { showMessage('Please add bank details first', 'error'); return; }
        
        showMessage('Sending withdrawal request...', 'pending');
        
        await db.collection('withdrawRequests').add({
            userId: currentUser.uid, amount: amount, bankDetails: bankDetails, status: 'Pending', date: new Date()
        });
        await db.collection('transactions').add({
            userId: currentUser.uid, type: 'debit', amount: amount, status: 'Pending', date: new Date()
        });
        
        showMessage('✅ Withdrawal request sent! Admin will approve.', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 2000);
    };
    
    function goBack() { window.location.href = 'dashboard.html'; }
    
    auth.onAuthStateChanged(async (user) => {
        if (!user) window.location.href = 'index.html';
        else { await loadUserData(); }
    });
</script>
</body>
</html>
