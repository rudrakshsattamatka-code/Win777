    // Get current server time

    let lastServerTimeFetch = 0;
    
    async function getServerTime() {
        const now = Date.now();
        if (cachedServerTime && (now - lastServerTimeFetch) < 5000) {
            const elapsed = (now - lastServerTimeFetch) / 1000;
            return new Date(cachedServerTime.getTime() + (elapsed * 1000));
        }
        try {
            const docRef = db.collection('settings').doc('servertime');
            await docRef.set({ timestamp: firebase.firestore.FieldValue.serverTimestamp() });
            const doc = await docRef.get();
            cachedServerTime = doc.data().timestamp.toDate();
            lastServerTimeFetch = now;
            return cachedServerTime;
        } catch (error) {
            return cachedServerTime || new Date();
        }
    }
    
    // Check if betting is allowed based on current time
    async function isBettingAllowed() {
        const serverTime = await getServerTime();
        const currentMinutes = serverTime.getHours() * 60 + serverTime.getMinutes();
        
        if (currentStatus === 'open') {
            if (marketOpenEndTime && currentMinutes >= marketOpenEndTime) {
                return { allowed: false, message: '⚠️ Open bidding time is over! Please select CLOSE bidding if available.' };
            }
            return { allowed: true, message: null };
        } 
        else if (currentStatus === 'close') {
            if (marketCloseEndTime && currentMinutes >= marketCloseEndTime) {
                return { allowed: false, message: '⚠️ Close bidding time is over! Market is now closed.' };
            }
            return { allowed: true, message: null };
        }
        return { allowed: true, message: null };
    }
    
    function timeToMinutes(timeStr) {
        if (!timeStr) return null;
        const parts = timeStr.split(':');
        return parseInt(parts[0]) * 60 + parseInt(parts[1]);
    }

        const warningDiv = document.getElementById('timeWarning');

            warningDiv.innerHTML = bettingAllowed.message;
            warningDiv.classList.remove('hidden');
        } else {
            warningDiv.classList.add('hidden');
        }
    }
    
    function getAvailableGameTypes() {

            return;
        }
        
        currentGameType = type;
        selectedDigits = [];
        selectedJodis = [];
        document.getElementById('selectedGameTitle').innerHTML = currentGameType;
        document.getElementById('selectedGameRate').innerHTML = `${gameRates[currentGameType]}x`;
        document.getElementById('gameSelectionScreen').style.display = 'none';
        document.getElementById('biddingPanel').style.display = 'block';
        renderGamePanel();
        updateTimeWarning();
        
        // Start time check interval
        if (window.timeCheckInterval) clearInterval(window.timeCheckInterval);
        window.timeCheckInterval = setInterval(async () => {
            const allowed = await isBettingAllowed();
            if (!allowed.allowed) {
                updateTimeWarning();
                // Disable add buttons if time is over
                const addBtns = document.querySelectorAll('.add-btn');
                addBtns.forEach(btn => btn.disabled = true);
            }
        }, 5000);
    }
    
    function showGameSelection() {
        if (window.timeCheckInterval) clearInterval(window.timeCheckInterval);
        document.getElementById('biddingPanel').style.display = 'none';
        document.getElementById('gameSelectionScreen').style.display = 'block';
        bids = [];
        updateSummary();
    }
    
    function updatePoints() {
        const pointsInput = document.getElementById('pointsInput');
        if (pointsInput) {
            let pts = parseInt(pointsInput.value);
            if (isNaN(pts)) {
                pts = null;
            }
            // Only validate minimum, don't auto-change the value
            if (pts !== null && pts < 5) {
                alert('Minimum points is ₹5');
                pointsInput.value = '';
                currentPoints = null;
                return;
            }
            currentPoints = pts;
        }
    }
    
    function getCurrentPoints() {
        const pointsInput = document.getElementById('pointsInput');
        if (pointsInput) {
            let pts = parseInt(pointsInput.value);
            if (isNaN(pts) || pts === '' || pts === null) {
                alert('Please enter points amount (Minimum ₹5)');
                return null;
            }
            if (pts < 5) {
                alert('Minimum points is ₹5');
                return null;
            }
            currentPoints = pts;
            return currentPoints;
        }
        return null;
    }
    
    function toggleDigit(digit) {
        const index = selectedDigits.indexOf(digit);
        if (index === -1) selectedDigits.push(digit);
        else selectedDigits.splice(index, 1);
        updateDigitButtons();
    }
    
    function updateDigitButtons() {
        for(let i = 0; i <= 9; i++) {
            const btn = document.getElementById(`digit_${i}`);
            if(btn) {
                if(selectedDigits.includes(i.toString())) btn.classList.add('selected');
                else btn.classList.remove('selected');
            }
        }
    }
    
    function toggleJodi(jodi) {
        const index = selectedJodis.indexOf(jodi);
        if (index === -1) selectedJodis.push(jodi);
        else selectedJodis.splice(index, 1);
        updateJodiButtons();
    }
    
    function updateJodiButtons() {
        for(let i = 0; i <= 99; i++) {
            const jodiStr = i.toString().padStart(2, '0');
            const btn = document.getElementById(`jodi_${jodiStr}`);
            if(btn) {
                if(selectedJodis.includes(jodiStr)) btn.classList.add('selected');
                else btn.classList.remove('selected');
            }
        }
    }
    
    async function addSelectedNumbers() {
        const bettingAllowed = await isBettingAllowed();
        if (!bettingAllowed.allowed) {
            showMessage(bettingAllowed.message, true);
            return;
        }
        
        const points = getCurrentPoints();
        if(points === null) return;
        
        if(currentGameType === 'Single Digit') {
            if(selectedDigits.length === 0) { alert('Please select at least one digit'); return; }
            for(const digit of selectedDigits) addToBids(currentGameType, digit, points);
            selectedDigits = [];
            updateDigitButtons();
        } 
        else if(currentGameType === 'Jodi') {
            if(selectedJodis.length === 0) { alert('Please select at least one Jodi'); return; }
            for(const jodi of selectedJodis) addToBids(currentGameType, jodi, points);
            selectedJodis = [];
            updateJodiButtons();
        }
        updateSummary();
        renderGamePanel();
    }
    
    function addToBids(gameType, value, points) {
        let bidOption = null;
        if (gameType === 'Single Digit' || gameType === 'Single Pana' || gameType === 'Double Pana' || gameType === 'Triple Pana') {
            bidOption = (currentStatus === 'close') ? 'Close' : selectedOpenClose;
        }
        
        const existingIndex = bids.findIndex(b => b.type === gameType && b.value === value && b.option === bidOption);
        if(existingIndex !== -1) bids[existingIndex].points += points;
        else bids.push({ type: gameType, option: bidOption, value: value, points: points, market: currentMarket, marketId: currentMarketId });
        
        updateSummary();
        renderGamePanel();
    }
    
    async function addManualNumber() {
        const bettingAllowed = await isBettingAllowed();
        if (!bettingAllowed.allowed) {
            showMessage(bettingAllowed.message, true);
            return;
        }
        
        const points = getCurrentPoints();
        if(points === null) return;
        const value = document.getElementById('manualValue')?.value.trim();
        if(!value) { alert('Please enter a number'); return; }
        
        if(currentGameType === 'Single Pana' && !validSinglePanaList.includes(value)) { alert('❌ Invalid Single Pana!'); return; }
        if(currentGameType === 'Double Pana' && !validDoublePanaList.includes(value)) { alert('❌ Invalid Double Pana!'); return; }
        if(currentGameType === 'Triple Pana' && !validTriplePanaList.includes(value)) { alert('❌ Invalid Triple Pana!'); return; }
        if(currentGameType === 'Half Sangam A' && !/^\d{3}-\d$/.test(value)) { alert('❌ Invalid Half Sangam A format!\n\nFormat: 123-5'); return; }
        if(currentGameType === 'Half Sangam B' && !/^\d-\d{3}$/.test(value)) { alert('❌ Invalid Half Sangam B format!\n\nFormat: 5-123'); return; }
        if(currentGameType === 'Full Sangam' && !/^\d{3}-\d{3}$/.test(value)) { alert('❌ Invalid Full Sangam format!\n\nFormat: 123-456'); return; }
        
        addToBids(currentGameType, value, points);
        document.getElementById('manualValue').value = '';
        updateSummary();
        renderGamePanel();
    }
    
    async function addHalfSangamA() {
        const bettingAllowed = await isBettingAllowed();
        if (!bettingAllowed.allowed) {
            showMessage(bettingAllowed.message, true);
            return;
        }
        
        const points = getCurrentPoints();
        if(points === null) return;
        const open = document.getElementById('halfSangamAOpen')?.value.trim();
        const close = document.getElementById('halfSangamAClose')?.value.trim();
        if(!open || !close) { alert('Please enter both fields'); return; }
        if(open.length !== 3 || !/^\d{3}$/.test(open)) { alert('Open Pana must be 3 digits'); return; }
        if(close.length !== 1 || !/^\d$/.test(close)) { alert('Close Digit must be 0-9'); return; }
        addToBids(currentGameType, `${open}-${close}`, points);
        document.getElementById('halfSangamAOpen').value = '';
        document.getElementById('halfSangamAClose').value = '';
        updateSummary();
        renderGamePanel();
    }
    
    async function addHalfSangamB() {
        const bettingAllowed = await isBettingAllowed();
        if (!bettingAllowed.allowed) {
            showMessage(bettingAllowed.message, true);
            return;
        }
        
        const points = getCurrentPoints();
        if(points === null) return;
        const open = document.getElementById('halfSangamBOpen')?.value.trim();
        const close = document.getElementById('halfSangamBClose')?.value.trim();
        if(!open || !close) { alert('Please enter both fields'); return; }
        if(open.length !== 1 || !/^\d$/.test(open)) { alert('Open Digit must be 0-9'); return; }
        if(close.length !== 3 || !/^\d{3}$/.test(close)) { alert('Close Pana must be 3 digits'); return; }
        addToBids(currentGameType, `${open}-${close}`, points);
        document.getElementById('halfSangamBOpen').value = '';
        document.getElementById('halfSangamBClose').value = '';
        updateSummary();
        renderGamePanel();
    }
    
    async function addFullSangam() {
        const bettingAllowed = await isBettingAllowed();
        if (!bettingAllowed.allowed) {
            showMessage(bettingAllowed.message, true);
            return;
        }
        
        const points = getCurrentPoints();
        if(points === null) return;
        const open = document.getElementById('fullSangamOpen')?.value.trim();
        const close = document.getElementById('fullSangamClose')?.value.trim();
        if(!open || !close) { alert('Please enter both fields'); return; }
        if(open.length !== 3 || !/^\d{3}$/.test(open)) { alert('Open Pana must be 3 digits'); return; }
        if(close.length !== 3 || !/^\d{3}$/.test(close)) { alert('Close Pana must be 3 digits'); return; }
        addToBids(currentGameType, `${open}-${close}`, points);
        document.getElementById('fullSangamOpen').value = '';
        document.getElementById('fullSangamClose').value = '';
        updateSummary();
        renderGamePanel();
    }
    
    function renderBidItems() {
        if(bids.length === 0) return '<div class="bids-section" style="text-align:center; color:#6c757d;">No bids added yet</div>';
        return `<div class="bids-section">${bids.map((b,i)=>`
            <div class="bid-item">
                <div class="bid-info">
                    <div class="bid-type">${b.type}${b.option ? ` (${b.option})` : ''}</div>
                    <div class="bid-value">${b.value}</div>
                    <div class="bid-points">₹${b.points} × ${gameRates[b.type] || 10}x = ₹${b.points * (gameRates[b.type] || 10)}</div>
                </div>
                <button class="remove-bid" onclick="removeBid(${i})">✕</button>
            </div>
        `).join('')}</div>`;
    }
    
    function updateSummary() {
        const total = bids.reduce((s,b)=>s+b.points,0);
        document.getElementById('totalBids').innerText = bids.length;
        document.getElementById('totalPoints').innerHTML = `₹${total}`;
    }
    
    function removeBid(i) { 
        bids.splice(i,1); 
        updateSummary(); 
        renderGamePanel(); 
    }
    
    function showMessage(msg, isError) {
        const d = document.getElementById('message');
        d.innerText = msg;
        d.className = `message ${isError ? 'error' : 'success'}`;
        d.classList.remove('hidden');
        setTimeout(() => d.classList.add('hidden'), 4000);
    }
    
    async function submitBids() {
        if(bids.length === 0) { showMessage('No bids to place', true); return; }
        if(!currentUser) return;
        
        // Final time check before submitting
        const bettingAllowed = await isBettingAllowed();
        if (!bettingAllowed.allowed) {
            showMessage(bettingAllowed.message, true);
            return;
        }
        
        const total = bids.reduce((s,b)=>s+b.points,0);
        if(userData.balance < total) { showMessage(`Insufficient balance! Need ₹${total}`, true); return; }
        const newBalance = userData.balance - total;
        try {
            await db.collection('users').doc(currentUser.uid).update({ balance: newBalance });
            for(let b of bids) { 
                await db.collection('bids').add({ 
                    userId: currentUser.uid, market: b.market, marketId: b.marketId, gameType: b.type,
                    bidType: b.option || (currentStatus === 'open' ? 'Open' : 'Close'), value: b.value,
                    points: b.points, status: 'pending', createdAt: firebase.firestore.FieldValue.serverTimestamp()
                }); 
            }
            await db.collection('transactions').add({ 
                userId: currentUser.uid, type: 'debit', amount: total, status: 'Completed',
                description: `Bid placed on ${currentMarket} (${bids.length} bids)`, date: firebase.firestore.FieldValue.serverTimestamp()
            });
            showMessage(`✅ ₹${total} bids placed successfully!`, false);
            bids = []; updateSummary();
            renderGamePanel();
            const updatedUser = await db.collection('users').doc(currentUser.uid).get();
            userData = updatedUser.data();
            document.getElementById('userBalance').innerText = userData?.balance || 0;
        } catch(e) { showMessage('Error: ' + e.message, true); }
    }
    
    function setOpenClose(value) { 
        selectedOpenClose = value; 
        renderGamePanel(); 
    }
    
    function renderGamePanel() {
        const panel = document.getElementById('gamePanel');
        const rate = gameRates[currentGameType];
        const gameType = allGameTypes.find(g => g.name === currentGameType);
        const showOpenClose = gameType ? gameType.hasOpenClose : false;
        
        let validationMsg = '';
        switch(currentGameType) {
            case 'Single Digit': validationMsg = 'Click on digits to select multiple numbers'; break;
            case 'Jodi': validationMsg = 'Click on Jodi numbers to select multiple'; break;
            case 'Single Pana': validationMsg = 'Enter valid Single Pana (3 digits)'; break;
            case 'Double Pana': validationMsg = 'Enter valid Double Pana (3 digits)'; break;
            case 'Triple Pana': validationMsg = 'Valid: 000,111,222,333,444,555,666,777,888,999'; break;
            case 'Half Sangam A': validationMsg = 'Format: Open Pana (3 digits) + Close Digit (0-9)'; break;
            case 'Half Sangam B': validationMsg = 'Format: Open Digit (0-9) + Close Pana (3 digits)'; break;
            case 'Full Sangam': validationMsg = 'Format: Open Pana (3 digits) + Close Pana (3 digits)'; break;
        }
        
        if(currentGameType === 'Single Digit') {
            let digitsHtml = '';
            for(let i = 0; i <= 9; i++) {
                digitsHtml += `<div class="number-btn ${selectedDigits.includes(i.toString()) ? 'selected' : ''}" id="digit_${i}" onclick="toggleDigit('${i}')">${i}</div>`;
            }
            panel.innerHTML = `
                <div class="game-panel-content">
                    ${showOpenClose && currentStatus === 'open' ? `
                    <div class="toggle-section">
                        <label class="toggle-option"><input type="radio" name="openClose" value="Open" ${selectedOpenClose === 'Open' ? 'checked' : ''} onchange="setOpenClose('Open')"> 🟢 Open</label>
                        <label class="toggle-option"><input type="radio" name="openClose" value="Close" ${selectedOpenClose === 'Close' ? 'checked' : ''} onchange="setOpenClose('Close')"> 🟡 Close</label>
                    </div>` : showOpenClose && currentStatus === 'close' ? '<div class="toggle-section"><span style="color:#ff4757;">🔒 Close Only Bidding</span></div>' : ''}
                    <div class="points-section">
                        <label class="points-label">💰 Bid Amount (₹)</label>
                        <input type="number" id="pointsInput" class="points-input" placeholder="Enter amount" min="5" step="1" onchange="updatePoints()" oninput="updatePoints()" inputmode="numeric">
                        <div class="points-hint">Minimum ₹5 | No maximum limit</div>
                    </div>
                    <div class="number-grid">${digitsHtml}</div>
                    <button class="add-btn" onclick="addSelectedNumbers()">➕ Add Selected (${selectedDigits.length} digits)</button>
                    ${renderBidItems()}
                    <div class="rate-info">💰 Win ${rate}x your bid amount!</div>
                </div>
            `;
        }
        else if(currentGameType === 'Jodi') {
            let jodiHtml = '';
            for(let i = 0; i <= 99; i++) {
                const jodiStr = i.toString().padStart(2, '0');
                jodiHtml += `<div class="jodi-btn ${selectedJodis.includes(jodiStr) ? 'selected' : ''}" id="jodi_${jodiStr}" onclick="toggleJodi('${jodiStr}')">${jodiStr}</div>`;
            }
            panel.innerHTML = `
                <div class="game-panel-content">
                    <div class="points-section">
                        <label class="points-label">💰 Bid Amount (₹)</label>
                        <input type="number" id="pointsInput" class="points-input" placeholder="Enter amount" min="5" step="1" onchange="updatePoints()" oninput="updatePoints()" inputmode="numeric">
                        <div class="points-hint">Minimum ₹5 | No maximum limit</div>
                    </div>
                    <div class="jodi-grid">${jodiHtml}</div>
                    <button class="add-btn" onclick="addSelectedNumbers()">➕ Add Selected (${selectedJodis.length} Jodis)</button>
                    ${renderBidItems()}
                    <div class="rate-info">💰 Win ${rate}x your bid amount!</div>
                </div>
            `;
        }
        else if(currentGameType === 'Single Pana' || currentGameType === 'Double Pana' || currentGameType === 'Triple Pana') {
            panel.innerHTML = `
                <div class="game-panel-content">
                    ${showOpenClose && currentStatus === 'open' ? `
                    <div class="toggle-section">
                        <label class="toggle-option"><input type="radio" name="openClose" value="Open" ${selectedOpenClose === 'Open' ? 'checked' : ''} onchange="setOpenClose('Open')"> 🟢 Open</label>
                        <label class="toggle-option"><input type="radio" name="openClose" value="Close" ${selectedOpenClose === 'Close' ? 'checked' : ''} onchange="setOpenClose('Close')"> 🟡 Close</label>
                    </div>` : showOpenClose && currentStatus === 'close' ? '<div class="toggle-section"><span style="color:#ff4757;">🔒 Close Only Bidding</span></div>' : ''}
                    <div class="points-section">
                        <label class="points-label">💰 Bid Amount (₹)</label>
                        <input type="number" id="pointsInput" class="points-input" placeholder="Enter amount" min="5" step="1" onchange="updatePoints()" oninput="updatePoints()" inputmode="numeric">
                        <div class="points-hint">Minimum ₹5 | No maximum limit</div>
                    </div>
                    <div class="manual-entry">
                        <div class="manual-row">
                            <span class="manual-label">Enter Number:</span>
                            <input type="text" id="manualValue" placeholder="Enter 3-digit ${currentGameType}" maxlength="3" inputmode="numeric">
                        </div>
                    </div>
                    <button class="add-btn" onclick="addManualNumber()">➕ Add to Bids</button>
                    ${renderBidItems()}
                    <div class="rate-info">💰 Win ${rate}x your bid amount!</div>
                </div>
            `;
        }
        else if(currentGameType === 'Half Sangam A') {
            panel.innerHTML = `
                <div class="game-panel-content">
                    <div class="points-section">
                        <label class="points-label">💰 Bid Amount (₹)</label>
                        <input type="number" id="pointsInput" class="points-input" placeholder="Enter amount" min="5" step="1" onchange="updatePoints()" oninput="updatePoints()" inputmode="numeric">
                        <div class="points-hint">Minimum ₹5 | No maximum limit</div>
                    </div>
                    <div class="manual-entry">
                        <div class="manual-row"><span class="manual-label">Open Pana:</span><input type="text" id="halfSangamAOpen" placeholder="3-digit Open Pana" maxlength="3" inputmode="numeric"></div>
                        <div class="manual-row"><span class="manual-label">Close Digit:</span><input type="text" id="halfSangamAClose" placeholder="Close Digit (0-9)" maxlength="1" inputmode="numeric"></div>
                    </div>
                    <button class="add-btn" onclick="addHalfSangamA()">➕ Add to Bids</button>
                    ${renderBidItems()}
                    <div class="rate-info">💰 Win ${rate}x your bid amount!</div>
                </div>
            `;
        }
        else if(currentGameType === 'Half Sangam B') {
            panel.innerHTML = `
                <div class="game-panel-content">
                    <div class="points-section">
                        <label class="points-label">💰 Bid Amount (₹)</label>
                        <input type="number" id="pointsInput" class="points-input" placeholder="Enter amount" min="5" step="1" onchange="updatePoints()" oninput="updatePoints()" inputmode="numeric">
                        <div class="points-hint">Minimum ₹5 | No maximum limit</div>
                    </div>
                    <div class="manual-entry">
                        <div class="manual-row"><span class="manual-label">Open Digit:</span><input type="text" id="halfSangamBOpen" placeholder="Open Digit (0-9)" maxlength="1" inputmode="numeric"></div>
                        <div class="manual-row"><span class="manual-label">Close Pana:</span><input type="text" id="halfSangamBClose" placeholder="3-digit Close Pana" maxlength="3" inputmode="numeric"></div>
                    </div>
                    <button class="add-btn" onclick="addHalfSangamB()">➕ Add to Bids</button>
                    ${renderBidItems()}
                    <div class="rate-info">💰 Win ${rate}x your bid amount!</div>
                </div>
            `;
        }
        else if(currentGameType === 'Full Sangam') {
            panel.innerHTML = `
                <div class="game-panel-content">
                    <div class="points-section">
                        <label class="points-label">💰 Bid Amount (₹)</label>
                        <input type="number" id="pointsInput" class="points-input" placeholder="Enter amount" min="5" step="1" onchange="updatePoints()" oninput="updatePoints()" inputmode="numeric">
                        <div class="points-hint">Minimum ₹5 | No maximum limit</div>
                    </div>
                    <div class="manual-entry">
                        <div class="manual-row"><span class="manual-label">Open Pana:</span><input type="text" id="fullSangamOpen" placeholder="3-digit Open Pana" maxlength="3" inputmode="numeric"></div>
                        <div class="manual-row"><span class="manual-label">Close Pana:</span><input type="text" id="fullSangamClose" placeholder="3-digit Close Pana" maxlength="3" inputmode="numeric"></div>
                    </div>
                    <button class="add-btn" onclick="addFullSangam()">➕ Add to Bids</button>
                    ${renderBidItems()}
                    <div class="rate-info">💰 Win ${rate}x your bid amount!</div>
                </div>
            `;
        }
        
        const pointsInput = document.getElementById('pointsInput');
        if (pointsInput && currentPoints) pointsInput.value = currentPoints;
    }
    
    async function loadMarketData() {
        const marketDoc = await db.collection('markets').doc(currentMarketId).get();
        if (marketDoc.exists) {
            const data = marketDoc.data();
            marketOpenEndTime = timeToMinutes(data.openBidEnd);
            marketCloseEndTime = timeToMinutes(data.closeBidEnd);
        }
    }
    
    async function loadUserData() {
        const user = auth.currentUser;
        if(!user) { window.location.href = 'index.html'; return; }
        currentUser = user;
        const doc = await db.collection('users').doc(user.uid).get();
        userData = doc.data();
        document.getElementById('userBalance').innerText = userData?.balance || 0;
    }
    
    function goBack() { window.location.href = 'dashboard.html'; }
    
    const urlParams = new URLSearchParams(window.location.search);
    currentMarket = decodeURIComponent(urlParams.get('market') || 'Main Bazar');
    currentMarketId = urlParams.get('marketId') || '';
    currentStatus = urlParams.get('status') || 'open';
    document.getElementById('marketName').innerHTML = currentMarket;
    document.getElementById('bidTypeBadge').innerHTML = currentStatus === 'open' ? 'OPEN BIDDING' : 'CLOSE BIDDING';
    
    loadMarketData();
    renderGameTypeSelection();
    
    window.selectGameTypeFromCard = selectGameTypeFromCard;
    window.showGameSelection = showGameSelection;
    window.setOpenClose = setOpenClose;
    window.addManualNumber = addManualNumber;
    window.removeBid = removeBid;
    window.addHalfSangamA = addHalfSangamA;
    window.addHalfSangamB = addHalfSangamB;
    window.addFullSangam = addFullSangam;
    window.submitBids = submitBids;
    window.updatePoints = updatePoints;
    window.toggleDigit = toggleDigit;
    window.toggleJodi = toggleJodi;
    window.addSelectedNumbers = addSelectedNumbers;
    
    auth.onAuthStateChanged(async (user) => {
        if(!user) window.location.href = 'index.html';
        else await loadUserData();
    });
</script>
