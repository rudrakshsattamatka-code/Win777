    }
    
    function addFullSangam() {
        const open = document.getElementById('fullSangamOpen')?.value.trim();
        const close = document.getElementById('fullSangamClose')?.value.trim();
        const points = parseInt(document.getElementById('pointsInput')?.value || 10);
        if(!open || !close) { alert('Please enter both Open Pana and Close Pana'); return; }
        if(open.length !== 3 || !/^\d{3}$/.test(open)) { alert('Open Pana must be 3 digits'); return; }
        if(close.length !== 3 || !/^\d{3}$/.test(close)) { alert('Close Pana must be 3 digits'); return; }
        if(points < 5) { alert('Minimum points is ₹5'); return; }
        bids.push({ type: currentGameType, option: null, value: `${open}-${close}`, points: points, market: currentMarket, marketId: currentMarketId });
        document.getElementById('fullSangamOpen').value = ''; document.getElementById('fullSangamClose').value = '';
        updateSummary(); renderGamePanel();
    }
    
    function renderBidItems() {
        if(bids.length === 0) return '<div class="bids-section" style="text-align:center; color:#aa9c7a; padding:20px;">No bids added</div>';
        return `<div class="bids-section">${bids.map((b,i)=>`<div class="bid-item"><div class="bid-info"><div class="bid-type">${b.type}${b.option ? ` (${b.option})` : ''}</div><div class="bid-value">${b.value}</div><div class="bid-points">₹${b.points} × ${gameRates[b.type] || 10}x = ₹${b.points * (gameRates[b.type] || 10)}</div></div><button class="remove-bid" onclick="removeBid(${i})">✕</button></div>`).join('')}</div>`;
    }
    
    function updateSummary() {
        const total = bids.reduce((s,b)=>s+b.points,0);
        document.getElementById('totalBids').innerText = bids.length;
        document.getElementById('totalPoints').innerText = total;
    }
    
    function removeBid(i) { bids.splice(i,1); updateSummary(); renderGamePanel(); }
    
    function showMessage(msg, isError) {
        const d = document.getElementById('message');
        d.innerText = msg;
        d.className = `message ${isError ? 'error' : 'success'}`;
        d.classList.remove('hidden');
        setTimeout(() => d.classList.add('hidden'), 3000);
    }
    
    async function submitBids() {
        if(bids.length === 0) { showMessage('No bids to place', true); return; }
        if(!currentUser) return;
        const total = bids.reduce((s,b)=>s+b.points,0);
        if(userData.balance < total) { showMessage(`Insufficient balance! Need ₹${total}`, true); return; }
        const newBalance = userData.balance - total;
        try {
            await db.collection('users').doc(currentUser.uid).update({ balance: newBalance });
            for(let b of bids) { await db.collection('bids').add({ userId: currentUser.uid, market: b.market, marketId: b.marketId, gameType: b.type, bidType: b.option || (currentStatus === 'open' ? 'Open' : 'Close'), value: b.value, points: b.points, status: 'pending', createdAt: new Date() }); }
            await db.collection('transactions').add({ userId: currentUser.uid, type: 'debit', amount: total, status: 'Completed', description: `Bid placed on ${currentMarket} (${bids.length} bids)`, date: new Date() });
            showMessage(`✅ ₹${total} bids placed!`, false);
            bids = []; updateSummary(); renderGamePanel();
            const updatedUser = await db.collection('users').doc(currentUser.uid).get();
            userData = updatedUser.data();
            document.getElementById('userBalance').innerText = userData?.balance || 0;
        } catch(e) { showMessage('Error: ' + e.message, true); }
    }
    
    async function loadUserData() {
        const user = auth.currentUser;
        if(!user) return;
        currentUser = user;
        const doc = await db.collection('users').doc(user.uid).get();
        userData = doc.data();
        document.getElementById('userBalance').innerText = userData?.balance || 0;
    }
    
    function goBack() { window.location.href = 'dashboard.html'; }
    
    const urlParams = new URLSearchParams(window.location.search);
    currentMarket = decodeURIComponent(urlParams.get('market') || 'Main Bazar');
    currentMarketId = urlParams.get('marketId') || '';
    currentStatus = urlParams.get('status') || 'open';
    document.getElementById('marketName').innerHTML = currentMarket;
    document.getElementById('bidTypeBadge').innerHTML = currentStatus === 'open' ? '🎲 OPEN BIDDING' : '🔒 CLOSE BIDDING';
    
    renderGameTypeSelector();
    renderGamePanel();
    
    window.selectGameType = selectGameType;
    window.setOpenClose = setOpenClose;
    window.addManualNumber = addManualNumber;
    window.removeBid = removeBid;
    window.addHalfSangamA = addHalfSangamA;
    window.addHalfSangamB = addHalfSangamB;
    window.addFullSangam = addFullSangam;
    window.submitBids = submitBids;
    
    auth.onAuthStateChanged(async (user) => {
        if(!user) window.location.href = 'index.html';
        else { await loadUserData(); }
    });
</script>
</body>
</html>
