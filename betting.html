<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WIN777 - Place Bet</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Poppins', sans-serif;
        }

        body {
            background: #0a0a0f;
            min-height: 100vh;
            padding-bottom: 30px;
        }

        .header {
            background: linear-gradient(135deg, #1a1a2e, #0f0f1a);
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255,152,0,0.3);
        }

        .header h1 {
            color: #ff9800;
            font-size: 22px;
        }

        .header p {
            color: #aaa;
            font-size: 11px;
            margin-top: 3px;
        }

        .back-btn {
            position: absolute;
            left: 15px;
            top: 18px;
            background: rgba(255,152,0,0.2);
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 12px;
            color: #ff9800;
            font-size: 20px;
            cursor: pointer;
        }

        .balance-bar {
            background: rgba(26,26,46,0.95);
            margin: 15px;
            padding: 12px 20px;
            border-radius: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,152,0,0.2);
        }

        .balance-label {
            color: #aaa;
            font-size: 13px;
        }

        .balance-amount {
            color: #ff9800;
            font-size: 20px;
            font-weight: bold;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 0 15px;
        }

        .game-type-selector {
            display: flex;
            overflow-x: auto;
            gap: 8px;
            margin-bottom: 20px;
            padding-bottom: 5px;
            -webkit-overflow-scrolling: touch;
        }

        .game-type-btn {
            background: #1a1a2e;
            border: 1px solid #333;
            padding: 10px 16px;
            border-radius: 30px;
            color: #aaa;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }

        .game-type-btn.active {
            background: linear-gradient(135deg, #ff9800, #ff5722);
            color: white;
            border-color: transparent;
        }

        .game-panel {
            background: linear-gradient(135deg, #1a1a2e, #12121f);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,152,0,0.2);
        }

        .game-title {
            font-size: 18px;
            color: #ff9800;
            margin-bottom: 5px;
            text-align: center;
        }

        .game-subtitle {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 20px;
            text-align: center;
        }

        .game-type-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .game-type-option {
            display: flex;
            align-items: center;
            gap: 8px;
            color: white;
            font-size: 14px;
        }

        .game-type-option input {
            width: 18px;
            height: 18px;
            accent-color: #ff9800;
        }

        /* Manual Entry Section */
        .manual-entry {
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
        }

        .manual-label {
            color: #ff9800;
            font-size: 13px;
            margin-bottom: 8px;
            display: block;
        }

        .manual-input {
            width: 100%;
            padding: 12px;
            background: #0a0a0f;
            border: 1px solid #333;
            border-radius: 12px;
            color: white;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .manual-input::placeholder {
            color: #555;
        }

        .add-manual-btn {
            background: rgba(255,152,0,0.2);
            border: 1px solid #ff9800;
            padding: 10px;
            border-radius: 12px;
            color: #ff9800;
            width: 100%;
            cursor: pointer;
            font-size: 14px;
        }

        .points-row {
            text-align: center;
            margin-bottom: 20px;
        }

        .points-label {
            color: #aaa;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .points-input {
            width: 150px;
            padding: 10px;
            background: #0a0a0f;
            border: 1px solid #333;
            border-radius: 12px;
            color: white;
            text-align: center;
            font-size: 16px;
            margin: 0 auto;
            display: block;
        }

        /* Selection Mode Toggle */
        .selection-mode {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .mode-btn {
            background: #1a1a2e;
            border: 1px solid #333;
            padding: 8px 20px;
            border-radius: 30px;
            color: #aaa;
            font-size: 12px;
            cursor: pointer;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #ff9800, #ff5722);
            color: white;
            border-color: transparent;
        }

        .selected-count {
            text-align: center;
            color: #ff9800;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .pana-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 25px;
            max-height: 350px;
            overflow-y: auto;
            padding: 5px;
        }

        .pana-btn {
            background: #0a0a0f;
            border: 1px solid #333;
            padding: 12px 5px;
            border-radius: 12px;
            color: white;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .pana-btn.selected {
            background: linear-gradient(135deg, #ff9800, #ff5722);
            border-color: transparent;
            color: white;
        }

        .add-selected-btn {
            background: linear-gradient(135deg, #ff9800, #ff5722);
            border: none;
            padding: 12px;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .add-more-btn {
            background: transparent;
            border: 1px dashed #ff9800;
            padding: 12px;
            border-radius: 12px;
            color: #ff9800;
            width: 100%;
            cursor: pointer;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .bid-items {
            margin-bottom: 20px;
            max-height: 250px;
            overflow-y: auto;
        }

        .bid-item {
            background: rgba(255,152,0,0.1);
            border-radius: 12px;
            padding: 10px 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .bid-item-info {
            flex: 1;
        }

        .bid-item-value {
            color: #ff9800;
            font-weight: bold;
        }

        .remove-bid {
            background: rgba(244,67,54,0.2);
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            color: #f44336;
            cursor: pointer;
            font-size: 16px;
        }

        .summary-bar {
            background: #1a1a2e;
            border-radius: 20px;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border: 1px solid rgba(255,152,0,0.2);
        }

        .summary-item {
            text-align: center;
        }

        .summary-label {
            color: #aaa;
            font-size: 11px;
        }

        .summary-value {
            color: #ff9800;
            font-size: 20px;
            font-weight: bold;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ff9800, #ff5722);
            border: none;
            border-radius: 16px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            padding: 10px;
            border-radius: 12px;
            font-size: 12px;
        }

        .error { background: rgba(244,67,54,0.2); color: #f44336; }
        .success { background: rgba(76,175,80,0.2); color: #4caf50; }

        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="header">
        <button class="back-btn" onclick="goBack()">←</button>
        <h1 id="marketName">MAIN BAZAR</h1>
        <p id="gameTypeDisplay">Select numbers to place bet</p>
    </div>

    <div class="balance-bar">
        <span class="balance-label">Your Balance</span>
        <span class="balance-amount">₹<span id="userBalance">0</span></span>
    </div>

    <div class="container">
        <div class="game-type-selector" id="gameTypeSelector"></div>
        <div id="gamePanel"></div>

        <div class="summary-bar">
            <div class="summary-item">
                <div class="summary-label">Total Bids</div>
                <div class="summary-value" id="totalBids">0</div>
            </div>
            <div class="summary-item">
                <div class="summary-label">Total Points</div>
                <div class="summary-value" id="totalPoints">0</div>
            </div>
        </div>

        <button class="submit-btn" onclick="submitBids()">Place Bets</button>
        <div id="message" class="message hidden"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBeGpb7V0i5GN1opY9JECHxQIGvHFDPX38",
            authDomain: "win777-ed482.firebaseapp.com",
            projectId: "win777-ed482",
            storageBucket: "win777-ed482.firebasestorage.app",
            messagingSenderId: "843686112399",
            appId: "1:843686112399:web:9c20a96831e6a94cd814fa"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        let currentUser = null;
        let userData = null;
        let currentMarket = 'MAIN BAZAR';
        let currentGameType = 'Single Pana';
        let bids = [];
        let selectedGameOption = 'Open';
        let selectedNumbers = new Set(); // For multiple selection
        let selectionMode = 'multiple'; // 'single' or 'multiple'

        const gameTypes = [
            'Single Pana', 'Single Pana Bulk', 'Double Pana', 'Double Pana Bulk', 'Triple Pana',
            'Triple Pana Bulk'
        ];

        // Pana Lists
        const singlePanaList = [
            '127', '136', '145', '190', '235', '280', '370', '389', '460', '479', '569', '578',
            '128', '137', '146', '236', '245', '290', '380', '470', '489', '560', '579', '678',
            '129', '138', '147', '156', '237', '246', '345', '390', '480', '570', '589', '679',
            '120', '139', '148', '157', '238', '247', '256', '346', '490', '580', '670', '689',
            '130', '149', '158', '167', '239', '248', '257', '347', '356', '590', '680', '789',
            '140', '159', '168', '230', '249', '258', '267', '348', '357', '456', '690', '780',
            '123', '150', '169', '178', '240', '259', '268', '349', '358', '367', '457', '790',
            '124', '160', '278', '179', '250', '269', '340', '359', '368', '458', '467', '890',
            '125', '134', '170', '189', '260', '279', '350', '369', '468', '378', '459', '567',
            '126', '135', '180', '234', '270', '289', '360', '379', '450', '469', '478', '568'
        ];

        const doublePanaList = [
            '100', '119', '155', '227', '335', '344', '399', '588', '669',
            '110', '200', '228', '255', '366', '499', '660', '688', '778',
            '166', '229', '300', '337', '355', '445', '599', '779', '788',
            '112', '220', '266', '338', '400', '446', '455', '699', '770',
            '113', '122', '177', '339', '366', '447', '500', '799', '889',
            '600', '114', '277', '330', '448', '466', '556', '880', '899',
            '115', '133', '188', '223', '377', '449', '557', '566', '700',
            '116', '224', '233', '288', '440', '477', '558', '800', '990',
            '117', '144', '199', '225', '388', '559', '577', '667', '900',
            '118', '226', '244', '299', '334', '488', '550', '668', '677'
        ];

        const triplePanaList = ['111', '222', '333', '444', '555', '666', '777', '888', '999', '000'];

        function renderGameTypeSelector() {
            const container = document.getElementById('gameTypeSelector');
            container.innerHTML = gameTypes.map(type => `
                <button class="game-type-btn ${currentGameType === type ? 'active' : ''}" onclick="selectGameType('${type}')">
                    ${type}
                </button>
            `).join('');
        }

        function selectGameType(type) {
            currentGameType = type;
            selectedNumbers.clear();
            bids = [];
            updateSummary();
            renderGameTypeSelector();
            renderGamePanel();
        }

        function getPanaList() {
            if (currentGameType.includes('Single Pana')) return singlePanaList;
            if (currentGameType.includes('Double Pana')) return doublePanaList;
            if (currentGameType.includes('Triple Pana')) return triplePanaList;
            return [];
        }

        function toggleSelectionMode() {
            selectionMode = selectionMode === 'multiple' ? 'single' : 'multiple';
            selectedNumbers.clear();
            renderGamePanel();
        }

        function toggleNumber(number) {
            if (selectionMode === 'single') {
                selectedNumbers.clear();
                selectedNumbers.add(number);
            } else {
                if (selectedNumbers.has(number)) {
                    selectedNumbers.delete(number);
                } else {
                    selectedNumbers.add(number);
                }
            }
            renderGamePanel();
        }

        function addManualNumber() {
            const manualValue = document.getElementById('manualValue')?.value.trim();
            if (!manualValue) {
                showMessage('Please enter a number', true);
                return;
            }
            if (selectedNumbers.has(manualValue)) {
                showMessage('Number already selected', true);
                return;
            }
            selectedNumbers.add(manualValue);
            document.getElementById('manualValue').value = '';
            renderGamePanel();
            showMessage(`Added ${manualValue} to selection`, false);
        }

        function addSelectedToBids() {
            if (selectedNumbers.size === 0) {
                showMessage('Please select at least one number', true);
                return;
            }
            
            const points = document.getElementById('pointsInput')?.value || 10;
            if (!points || points <= 0) {
                showMessage('Enter valid points', true);
                return;
            }

            const numbersArray = Array.from(selectedNumbers);
            for (const number of numbersArray) {
                bids.push({
                    type: currentGameType,
                    option: selectedGameOption,
                    value: number,
                    points: parseInt(points),
                    market: currentMarket
                });
            }
            
            selectedNumbers.clear();
            updateSummary();
            renderGamePanel();
            showMessage(`Added ${numbersArray.length} numbers with ${points} points each`, false);
        }

        function setGameOption(option) {
            selectedGameOption = option;
            renderGamePanel();
        }

        function removeBid(index) {
            bids.splice(index, 1);
            updateSummary();
            renderGamePanel();
        }

        function renderGamePanel() {
            const panel = document.getElementById('gamePanel');
            const panaList = getPanaList();
            
            panel.innerHTML = `
                <div class="game-panel">
                    <div class="game-title">${currentMarket} - ${currentGameType}</div>
                    <div class="game-subtitle">₹ 0.00</div>
                    
                    <div class="game-type-row">
                        <label class="game-type-option">
                            <input type="radio" name="gameType" value="Open" ${selectedGameOption === 'Open' ? 'checked' : ''} onchange="setGameOption('Open')"> Open
                        </label>
                        <label class="game-type-option">
                            <input type="radio" name="gameType" value="Close" ${selectedGameOption === 'Close' ? 'checked' : ''} onchange="setGameOption('Close')"> Close
                        </label>
                    </div>
                    
                    <div class="points-row">
                        <div class="points-label">Points per bet</div>
                        <input type="number" id="pointsInput" class="points-input" placeholder="Enter points" value="10">
                    </div>
                    
                    <!-- Manual Entry -->
                    <div class="manual-entry">
                        <label class="manual-label">✏️ Manual Entry</label>
                        <input type="text" id="manualValue" class="manual-input" placeholder="Enter number manually (e.g., 127)">
                        <button class="add-manual-btn" onclick="addManualNumber()">+ Add Manual Number</button>
                    </div>
                    
                    <!-- Selection Mode Toggle -->
                    <div class="selection-mode">
                        <button class="mode-btn ${selectionMode === 'multiple' ? 'active' : ''}" onclick="toggleSelectionMode()">🔘 Multiple Select</button>
                        <button class="mode-btn ${selectionMode === 'single' ? 'active' : ''}" onclick="toggleSelectionMode()">⚫ Single Select</button>
                    </div>
                    
                    <div class="selected-count">
                        📌 Selected: ${selectedNumbers.size} number${selectedNumbers.size !== 1 ? 's' : ''}
                        ${selectionMode === 'multiple' ? '(Tap to select multiple)' : '(Tap to select one)'}
                    </div>
                    
                    <!-- Numbers Grid -->
                    <div class="pana-grid" id="numbersGrid"></div>
                    
                    <!-- Add Selected Button -->
                    <button class="add-selected-btn" onclick="addSelectedToBids()">
                        📦 Add ${selectedNumbers.size} Selected Number${selectedNumbers.size !== 1 ? 's' : ''} to Bids
                    </button>
                    
                    ${renderBidItems()}
                </div>
            `;
            
            renderNumbersGrid(panaList);
        }

        function renderNumbersGrid(panaList) {
            const grid = document.getElementById('numbersGrid');
            if (!grid) return;
            
            grid.innerHTML = '';
            panaList.forEach(number => {
                const isSelected = selectedNumbers.has(number);
                grid.innerHTML += `
                    <div class="pana-btn ${isSelected ? 'selected' : ''}" onclick="toggleNumber('${number}')">
                        ${number}
                    </div>
                `;
            });
        }

        function renderBidItems() {
            if (bids.length === 0) {
                return '<div style="color:#666; text-align:center; padding:20px;">No bids added yet</div>';
            }
            
            // Group bids by value for display
            const bidMap = new Map();
            for (const bid of bids) {
                const key = `${bid.value}`;
                if (bidMap.has(key)) {
                    bidMap.get(key).points += bid.points;
                } else {
                    bidMap.set(key, { ...bid });
                }
            }
            
            return `
                <div class="bid-items">
                    <div style="color:#ff9800; font-size:12px; margin-bottom:8px;">📋 Current Bids (${bids.length} items)</div>
                    ${Array.from(bidMap.values()).map((bid, i) => `
                        <div class="bid-item">
                            <div class="bid-item-info">
                                <div><strong>${bid.type}</strong>: ${bid.value} ${bid.option ? `(${bid.option})` : ''}</div>
                                <div style="font-size:11px; color:#aaa;">Points: ${bid.points}</div>
                            </div>
                            <button class="remove-bid" onclick="removeBid(${i})">✕</button>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function updateSummary() {
            const totalPoints = bids.reduce((sum, bid) => sum + bid.points, 0);
            document.getElementById('totalBids').innerText = bids.length;
            document.getElementById('totalPoints').innerText = totalPoints;
        }

        function showMessage(msg, isError) {
            const msgDiv = document.getElementById('message');
            msgDiv.innerText = msg;
            msgDiv.className = `message ${isError ? 'error' : 'success'}`;
            msgDiv.classList.remove('hidden');
            setTimeout(() => msgDiv.classList.add('hidden'), 3000);
        }

        async function submitBids() {
            if (bids.length === 0) {
                showMessage('No bids to place', true);
                return;
            }
            if (!currentUser) return;
            
            const totalPoints = bids.reduce((sum, bid) => sum + bid.points, 0);
            if (userData.balance < totalPoints) {
                showMessage(`Insufficient balance! Need ₹${totalPoints}`, true);
                return;
            }

            const newBalance = userData.balance - totalPoints;
            
            try {
                await db.collection('users').doc(currentUser.uid).update({ balance: newBalance });
                
                for (const bid of bids) {
                    await db.collection('bids').add({
                        userId: currentUser.uid,
                        market: bid.market,
                        gameType: bid.type,
                        option: bid.option || null,
                        value: bid.value,
                        points: bid.points,
                        status: 'pending',
                        createdAt: new Date()
                    });
                }
                
                await db.collection('transactions').add({
                    userId: currentUser.uid,
                    type: 'debit',
                    amount: totalPoints,
                    description: `Bid on ${currentMarket} (${bids.length} items)`,
                    date: new Date()
                });
                
                await loadUserData();
                showMessage(`✅ ₹${totalPoints} bids placed successfully!`, false);
                bids = [];
                selectedNumbers.clear();
                updateSummary();
                renderGamePanel();
                
                setTimeout(() => {
                    if(confirm('Bids placed! Go back to dashboard?')) goBack();
                }, 1500);
            } catch(error) {
                showMessage('Error placing bets: ' + error.message, true);
            }
        }

        async function loadUserData() {
            const user = auth.currentUser;
            if (!user) return;
            currentUser = user;
            const userDoc = await db.collection('users').doc(user.uid).get();
            userData = userDoc.data();
            document.getElementById('userBalance').innerText = userData?.balance || 0;
        }

        function goBack() {
            window.location.href = 'dashboard.html';
        }

        const urlParams = new URLSearchParams(window.location.search);
        const marketParam = urlParams.get('market');
        if (marketParam) currentMarket = decodeURIComponent(marketParam);
        document.getElementById('marketName').innerHTML = currentMarket;

        auth.onAuthStateChanged(async (user) => {
            if (!user) window.location.href = 'index.html';
            else {
                await loadUserData();
                renderGameTypeSelector();
                renderGamePanel();
            }
        });
    </script>
</body>
</html>
