<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WIN777 - Admin Panel</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #0a0a0f; min-height: 100vh; }
        
        .admin-container {
            display: flex;
        }
        
        .sidebar {
            width: 260px;
            background: linear-gradient(180deg, #1a1a2e 0%, #0f0f1a 100%);
            min-height: 100vh;
            position: fixed;
        }
        
        .sidebar .logo {
            padding: 25px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .sidebar .logo h2 { color: #ff9800; }
        
        .nav-item {
            padding: 12px 25px;
            color: #aaa;
            cursor: pointer;
            transition: 0.2s;
        }
        
        .nav-item:hover, .nav-item.active {
            background: rgba(255,152,0,0.1);
            color: #ff9800;
            border-left: 3px solid #ff9800;
        }
        
        .main-content {
            margin-left: 260px;
            padding: 20px;
            width: calc(100% - 260px);
        }
        
        .top-bar {
            background: rgba(26,26,46,0.95);
            border-radius: 20px;
            padding: 15px 25px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .card {
            background: rgba(26,26,46,0.95);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
        }
        
        .card-title {
            font-size: 20px;
            color: #ff9800;
            margin-bottom: 20px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }
        
        .stat-card h3 { font-size: 32px; color: #ff9800; }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            color: #ddd;
        }
        
        th { color: #ff9800; }
        
        input, select {
            padding: 10px;
            background: #1a1a2e;
            border: 1px solid #333;
            border-radius: 8px;
            color: white;
            margin: 5px;
        }
        
        button {
            background: linear-gradient(135deg, #ff9800, #ff5722);
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
        }
        
        .btn-danger { background: #f44336; }
        .btn-success { background: #4caf50; }
        
        .hidden { display: none; }
        
        .user-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .market-item {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="sidebar">
            <div class="logo">
                <h2>WIN777<br><span style="font-size:12px;">Admin Panel</span></h2>
            </div>
            <div class="nav-item active" data-page="dashboard">📊 Dashboard</div>
            <div class="nav-item" data-page="markets">🎮 Manage Markets</div>
            <div class="nav-item" data-page="users">👥 Users</div>
            <div class="nav-item" data-page="bids">📋 Bids History</div>
            <div class="nav-item" data-page="settings">⚙️ Settings</div>
        </div>
        
        <div class="main-content">
            <div class="top-bar">
                <h2 style="color:white;" id="pageTitle">Dashboard</h2>
                <div>
                    <span style="color:white; margin-right:15px;" id="adminName">Admin</span>
                    <button id="logoutBtn" style="background:#f44336;">Logout</button>
                </div>
            </div>
            
            <!-- Dashboard Page -->
            <div id="dashboardPage">
                <div class="stats-grid" id="statsGrid"></div>
                <div class="card">
                    <div class="card-title">📊 Recent Activity</div>
                    <div id="recentActivity"></div>
                </div>
            </div>
            
            <!-- Markets Page -->
            <div id="marketsPage" class="hidden">
                <div class="card">
                    <div class="card-title">➕ Add New Market</div>
                    <input type="text" id="marketName" placeholder="Market Name">
                    <input type="time" id="openTime" placeholder="Open Time">
                    <input type="time" id="closeTime" placeholder="Close Time">
                    <button id="addMarketBtn">Add Market</button>
                </div>
                <div class="card">
                    <div class="card-title">📈 Active Markets</div>
                    <div id="marketsList"></div>
                </div>
            </div>
            
            <!-- Users Page -->
            <div id="usersPage" class="hidden">
                <div class="card">
                    <div class="card-title">👥 All Users</div>
                    <div id="usersList"></div>
                </div>
            </div>
            
            <!-- Bids Page -->
            <div id="bidsPage" class="hidden">
                <div class="card">
                    <div class="card-title">📋 All Bids</div>
                    <div id="allBidsList"></div>
                </div>
            </div>
            
            <!-- Settings Page -->
            <div id="settingsPage" class="hidden">
                <div class="card">
                    <div class="card-title">🔐 Change Admin Password</div>
                    <input type="password" id="currentPassword" placeholder="Current Password">
                    <input type="password" id="newPassword" placeholder="New Password">
                    <input type="password" id="confirmPassword" placeholder="Confirm Password">
                    <button id="changePasswordBtn">Change Password</button>
                    <div id="passwordMsg" style="margin-top:10px;"></div>
                </div>
                <div class="card">
                    <div class="card-title">🎨 Site Settings</div>
                    <div class="form-group">
                        <label>Site Logo Text</label>
                        <input type="text" id="siteLogo" placeholder="WIN777">
                    </div>
                    <div class="form-group">
                        <label>Primary Color</label>
                        <input type="color" id="primaryColor" value="#ff9800">
                    </div>
                    <button id="saveSettingsBtn">Save Settings</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = "Gani99@@";
        const firebaseConfig = {
            apiKey: "AIzaSyBeGpb7V0i5GN1opY9JECHxQIGvHFDPX38",
            authDomain: "win777-ed482.firebaseapp.com",
            projectId: "win777-ed482",
            storageBucket: "win777-ed482.firebasestorage.app",
            messagingSenderId: "843686112399",
            appId: "1:843686112399:web:9c20a96831e6a94cd814fa"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        let markets = [
            { id: 'm1', name: 'Cricket Match IND vs AUS', openTime: '10:00', closeTime: '18:00', status: 'open' },
            { id: 'm2', name: 'Football: Real Madrid vs Barcelona', openTime: '20:00', closeTime: '22:00', status: 'open' },
            { id: 'm3', name: 'Tennis: US Open Final', openTime: '14:00', closeTime: '16:00', status: 'closed' }
        ];
        
        function loadStats() {
            document.getElementById('statsGrid').innerHTML = `
                <div class="stat-card"><h3 id="totalUsers">0</h3><p>Total Users</p></div>
                <div class="stat-card"><h3 id="totalBids">0</h3><p>Total Bids</p></div>
                <div class="stat-card"><h3 id="totalVolume">0</h3><p>Total Volume (₹)</p></div>
            `;
            db.collection('users').get().then(snapshot => {
                document.getElementById('totalUsers').innerText = snapshot.size;
            });
            db.collection('bids').get().then(snapshot => {
                document.getElementById('totalBids').innerText = snapshot.size;
                let total = 0;
                snapshot.forEach(doc => total += doc.data().amount || 0);
                document.getElementById('totalVolume').innerText = total;
            });
        }
        
        function loadMarkets() {
            const container = document.getElementById('marketsList');
            container.innerHTML = markets.map((market, index) => `
                <div class="market-item">
                    <strong>${market.name}</strong><br>
                    Time: ${market.openTime} - ${market.closeTime}<br>
                    Status: ${market.status}
                    <button onclick="deleteMarket('${market.id}')" class="btn-danger" style="margin-left:10px;">Delete</button>
                </div>
            `).join('');
        }
        
        window.deleteMarket = function(id) {
            markets = markets.filter(m => m.id !== id);
            loadMarkets();
        };
        
        function loadUsers() {
            db.collection('users').get().then(snapshot => {
                const container = document.getElementById('usersList');
                container.innerHTML = '';
                snapshot.forEach(doc => {
                    const user = doc.data();
                    container.innerHTML += `
                        <div class="user-item">
                            <div>
                                <strong>${user.name || 'Unknown'}</strong><br>
                                <small>${user.phone || 'No phone'} | Balance: ₹${user.balance || 0}</small>
                            </div>
                            <div>
                                <button onclick="toggleBlockUser('${doc.id}')" class="${user.blocked ? 'btn-success' : 'btn-danger'}">
                                    ${user.blocked ? 'Unblock' : 'Block'}
                                </button>
                                <button onclick="clearUserHistory('${doc.id}')" class="btn-danger">Clear History</button>
                            </div>
                        </div>
                    `;
                });
            });
        }
        
        window.toggleBlockUser = async function(userId) {
            const userDoc = await db.collection('users').doc(userId).get();
            const blocked = userDoc.data().blocked || false;
            await db.collection('users').doc(userId).update({ blocked: !blocked });
            loadUsers();
        };
        
        window.clearUserHistory = async function(userId) {
            const bids = await db.collection('bids').where('userId', '==', userId).get();
            bids.forEach(doc => doc.ref.delete());
            const transactions = await db.collection('transactions').where('userId', '==', userId).get();
            transactions.forEach(doc => doc.ref.delete());
            alert('History cleared!');
        };
        
        function loadAllBids() {
            db.collection('bids').orderBy('createdAt', 'desc').get().then(snapshot => {
                const container = document.getElementById('allBidsList');
                if (snapshot.empty) { container.innerHTML = '<p>No bids yet</p>'; return; }
                container.innerHTML = `
                    <table>
                        <tr><th>User</th><th>Market</th><th>Amount</th><th>Status</th><th>Date</th><th>Action</th></tr>
                        ${snapshot.docs.map(async doc => {
                            const user = await db.collection('users').doc(doc.data().userId).get();
                            return `
                                <tr>
                                    <td>${user.data()?.name || 'Unknown'}</td>
                                    <td>${doc.data().marketName}</td>
                                    <td>₹${doc.data().amount}</td>
                                    <td>
                                        <select onchange="updateBidStatus('${doc.id}', this.value)">
                                            <option ${doc.data().status === 'pending' ? 'selected' : ''}>pending</option>
                                            <option ${doc.data().status === 'won' ? 'selected' : ''}>won</option>
                                            <option ${doc.data().status === 'lost' ? 'selected' : ''}>lost</option>
                                        </select>
                                    </td>
                                    <td>${doc.data().createdAt?.toDate().toLocaleString() || 'Pending'}</td>
                                    <td><button onclick="deleteBid('${doc.id}')" class="btn-danger">Delete</button></td>
                                </tr>
                            `;
                        }).join('')}
                    </table>
                `;
            });
        }
        
        window.updateBidStatus = async function(bidId, status) {
            await db.collection('bids').doc(bidId).update({ status: status });
            if (status === 'won') {
                const bid = await db.collection('bids').doc(bidId).get();
                const user = await db.collection('users').doc(bid.data().userId).get();
                const newBalance = (user.data().balance || 0) + (bid.data().amount * 2);
                await db.collection('users').doc(bid.data().userId).update({ balance: newBalance });
            }
            loadAllBids();
        };
        
        window.deleteBid = async function(bidId) {
            await db.collection('bids').doc(bidId).delete();
            loadAllBids();
        };
        
        document.getElementById('addMarketBtn')?.addEventListener('click', () => {
            const name = document.getElementById('marketName').value;
            const openTime = document.getElementById('openTime').value;
            const closeTime = document.getElementById('closeTime').value;
            if (!name || !openTime || !closeTime) { alert('Fill all fields'); return; }
            markets.push({ id: 'm' + Date.now(), name, openTime, closeTime, status: 'open' });
            loadMarkets();
            document.getElementById('marketName').value = '';
            document.getElementById('openTime').value = '';
            document.getElementById('closeTime').value = '';
            alert('Market added!');
        });
        
        document.getElementById('changePasswordBtn')?.addEventListener('click', () => {
            const current = document.getElementById('currentPassword').value;
            const newPass = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;
            if (current !== ADMIN_PASSWORD) { document.getElementById('passwordMsg').innerHTML = '<span style="color:#f44336;">Current password incorrect</span>'; return; }
            if (newPass !== confirm) { document.getElementById('passwordMsg').innerHTML = '<span style="color:#f44336;">Passwords do not match</span>'; return; }
            if (newPass.length < 6) { document.getElementById('passwordMsg').innerHTML = '<span style="color:#f44336;">Password must be at least 6 characters</span>'; return; }
            document.getElementById('passwordMsg').innerHTML = '<span style="color:#4caf50;">Password changed! (Note: Store this password safely)</span>';
            alert('Password changed successfully! New password: ' + newPass);
        });
        
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
                item.classList.add('active');
                const page = item.dataset.page;
                document.getElementById('pageTitle').innerText = item.innerText;
                document.getElementById('dashboardPage').classList.add('hidden');
                document.getElementById('marketsPage').classList.add('hidden');
                document.getElementById('usersPage').classList.add('hidden');
                document.getElementById('bidsPage').classList.add('hidden');
                document.getElementById('settingsPage').classList.add('hidden');
                document.getElementById(`${page}Page`).classList.remove('hidden');
                if (page === 'dashboard') loadStats();
                if (page === 'markets') loadMarkets();
                if (page === 'users') loadUsers();
                if (page === 'bids') loadAllBids();
            });
        });
        
        document.getElementById('logoutBtn')?.addEventListener('click', async () => {
            await auth.signOut();
            window.location.href = 'index.html';
        });
        
        auth.onAuthStateChanged(async (user) => {
            if (!user) window.location.href = 'index.html';
            else {
                const userDoc = await db.collection('users').doc(user.uid).get();
                if (userDoc.data()?.role !== 'admin') window.location.href = 'dashboard.html';
                document.getElementById('adminName').innerHTML = `👑 ${userDoc.data()?.name || 'Admin'}`;
                loadStats();
            }
        });
    </script>
</body>
</html>
