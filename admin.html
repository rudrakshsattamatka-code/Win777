<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WIN777 - Admin</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
        body{background:#f0f0f0}
        .login-box{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;display:flex;justify-content:center;align-items:center}
        .login-card{background:#1a1a1a;padding:30px;border-radius:20px;width:300px;text-align:center}
        .login-card input{width:100%;padding:10px;margin:10px 0;background:#333;border:1px solid #555;border-radius:8px;color:white}
        .login-card button{background:#0096ff;padding:10px;width:100%;border:none;border-radius:8px;color:white;cursor:pointer}
        .admin-panel{display:none}
        .sidebar{width:250px;background:#000;min-height:100vh;position:fixed}
        .sidebar h2{color:#fff;padding:20px;text-align:center}
        .sidebar-item{padding:15px 20px;color:#ccc;cursor:pointer;border-bottom:1px solid #222}
        .sidebar-item:hover{background:#1a1a1a;color:#fff}
        .main{margin-left:250px;padding:20px}
        .card{background:#fff;border-radius:12px;padding:20px;margin-bottom:20px}
        .card h3{margin-bottom:15px}
        input,select{padding:8px;margin:5px;border:1px solid #ddd;border-radius:6px;width:calc(100% - 10px)}
        button{background:#0096ff;border:none;padding:8px 16px;border-radius:6px;color:white;cursor:pointer;margin:5px}
        .market-item,.user-item{background:#f9f9f9;padding:10px;margin:8px 0;border-radius:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
        .status-badge{padding:4px 12px;border-radius:20px;font-size:12px;cursor:pointer}
        .status-open{background:#4caf5020;color:#4caf50;border:1px solid #4caf50}
        .status-close{background:#ff980020;color:#ff9800;border:1px solid #ff9800}
        .status-closed{background:#f4433620;color:#f44336;border:1px solid #f44336}
        table{width:100%;border-collapse:collapse}
        th,td{padding:8px;text-align:left;border-bottom:1px solid #ddd}
        .hidden{display:none}
        .btn-danger{background:#dc3545}
        .btn-success{background:#28a745}
    </style>
</head>
<body>
<div id="loginScreen" class="login-box"><div class="login-card"><h2 style="color:#fff">Admin Login</h2><input type="password" id="adminPass" placeholder="Password"><button onclick="login()">Login</button><div id="loginError" style="color:red;margin-top:10px"></div></div></div>
<div id="adminPanel" class="admin-panel"><div class="sidebar"><h2>WIN777</h2><div class="sidebar-item" onclick="showSection('markets')">🎮 Markets</div><div class="sidebar-item" onclick="showSection('users')">👥 Users</div><div class="sidebar-item" onclick="showSection('deposits')">💰 Deposits</div><div class="sidebar-item" onclick="showSection('withdrawals')">💸 Withdrawals</div><div class="sidebar-item" onclick="showSection('settings')">⚙️ Settings</div><div class="sidebar-item" onclick="logout()">🚪 Logout</div></div><div class="main">
    <div id="marketsSection"><div class="card"><h3>Add Market</h3><input type="text" id="marketName" placeholder="Market Name"><input type="text" id="marketResult" placeholder="Result (e.g., 123-45-678)"><select id="marketStatus"><option value="open">OPEN - All Bets</option><option value="close">CLOSE - Close Bets Only</option><option value="closed">CLOSED - No Bets</option></select><button onclick="addMarket()">Add Market</button></div><div class="card"><h3>Markets (Click Status to Change)</h3><div id="marketsList"></div></div></div>
    <div id="usersSection" class="hidden"><div class="card"><h3>Users</h3><div id="usersList"></div></div></div>
    <div id="depositsSection" class="hidden"><div class="card"><h3>Deposit Requests</h3><div id="depositsList"></div></div></div>
    <div id="withdrawalsSection" class="hidden"><div class="card"><h3>Withdrawal Requests</h3><div id="withdrawalsList"></div></div></div>
    <div id="settingsSection" class="hidden"><div class="card"><h3>Change Password</h3><input type="password" id="oldPass" placeholder="Old Password"><input type="password" id="newPass" placeholder="New Password"><button onclick="changePass()">Update</button><div id="passMsg"></div></div><div class="card"><h3>UPI ID</h3><input type="text" id="upiId" placeholder="UPI ID"><button onclick="updateUPI()">Update UPI</button><div id="upiMsg"></div></div></div>
</div></div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBeGpb7V0i5GN1opY9JECHxQIGvHFDPX38",
        authDomain: "win777-ed482.firebaseapp.com",
        projectId: "win777-ed482",
        storageBucket: "win777-ed482.firebasestorage.app",
        messagingSenderId: "843686112399",
        appId: "1:843686112399:web:9c20a96831e6a94cd814fa"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    let adminPassword = 'Gani99@@';
    
    async function login(){
        let pwd = document.getElementById('adminPass').value;
        if(pwd === adminPassword){
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            loadMarkets();
            loadUsers();
            loadDeposits();
            loadWithdrawals();
        } else {
            document.getElementById('loginError').innerText = 'Wrong password';
        }
    }
    
    async function loadMarkets(){
        let snap = await db.collection('markets').get();
        let html = '';
        for(let doc of snap.docs){
            let m = doc.data();
            let statusClass = '', statusText = '';
            if(m.status === 'open'){ statusClass = 'status-open'; statusText = 'OPEN'; }
            else if(m.status === 'close'){ statusClass = 'status-close'; statusText = 'CLOSE'; }
            else{ statusClass = 'status-closed'; statusText = 'CLOSED'; }
            html += `<div class="market-item">
                <div><b>${m.name}</b><br>Result: ${m.result || '***'}</div>
                <div>
                    <span class="status-badge ${statusClass}" onclick="changeStatus('${doc.id}','${m.status}')">${statusText} ▼</span>
                    <button onclick="editMarket('${doc.id}','${m.name}','${m.result||''}')">Edit</button>
                    <button onclick="deleteMarket('${doc.id}')">Delete</button>
                </div>
            </div>`;
        }
        document.getElementById('marketsList').innerHTML = html;
    }
    
    async function changeStatus(id, current){
        let newStatus = '';
        if(current === 'open') newStatus = 'close';
        else if(current === 'close') newStatus = 'closed';
        else newStatus = 'open';
        await db.collection('markets').doc(id).update({status: newStatus});
        loadMarkets();
    }
    
    async function addMarket(){
        let name = document.getElementById('marketName').value;
        let result = document.getElementById('marketResult').value || '***-**-***';
        let status = document.getElementById('marketStatus').value;
        if(!name) return;
        await db.collection('markets').add({name, result, status});
        loadMarkets();
        document.getElementById('marketName').value = '';
        document.getElementById('marketResult').value = '';
    }
    
    async function editMarket(id, oldName, oldResult){
        let newName = prompt('New name', oldName);
        let newResult = prompt('New result', oldResult);
        if(newName) await db.collection('markets').doc(id).update({name: newName, result: newResult});
        loadMarkets();
    }
    
    async function deleteMarket(id){
        if(confirm('Delete this market?')){
            await db.collection('markets').doc(id).delete();
            loadMarkets();
        }
    }
    
    async function loadUsers(){
        let users = await db.collection('users').get();
        let html = '';
        for(let doc of users.docs){
            let u = doc.data();
            html += `<div class="user-item">
                <div><b>${u.name}</b><br>${u.phone}<br>Balance: ₹${u.balance || 0}</div>
                <div>
                    <button onclick="addBalance('${doc.id}')">Add ₹</button>
                    <button onclick="clearUserBids('${doc.id}')" class="btn-danger">Clear Bids</button>
                </div>
            </div>`;
        }
        document.getElementById('usersList').innerHTML = html;
    }
    
    async function addBalance(uid){
        let amt = prompt('Enter amount to add');
        if(amt && !isNaN(amt)){
            let user = await db.collection('users').doc(uid).get();
            let newBalance = (user.data().balance || 0) + parseInt(amt);
            await db.collection('users').doc(uid).update({balance: newBalance});
            loadUsers();
            alert('Balance added!');
        }
    }
    
    async function clearUserBids(uid){
        if(confirm('Clear all bid history for this user?')){
            let bids = await db.collection('bids').where('userId','==',uid).get();
            for(let bid of bids.docs) await bid.ref.delete();
            alert('History cleared!');
        }
    }
    
    async function loadDeposits(){
        let reqs = await db.collection('transactions').where('type','==','credit').where('status','==','Pending').get();
        let html = '<table><tr><th>User</th><th>Amount</th><th>Date</th><th>Action</th></tr>';
        for(let doc of reqs.docs){
            let d = doc.data();
            html += `<tr>
                <td>${d.userId.substring(0,10)}...</td>
                <td>₹${d.amount}</td>
                <td>${d.date?.toDate().toLocaleString() || 'Pending'}</td>
                <td><button class="btn-success" onclick="approveDeposit('${doc.id}','${d.amount}','${d.userId}')">Approve</button></td>
            </tr>`;
        }
        html += '</table>';
        document.getElementById('depositsList').innerHTML = html || '<p>No pending deposits</p>';
    }
    
    async function approveDeposit(id, amount, userId){
        let user = await db.collection('users').doc(userId).get();
        let newBalance = (user.data().balance || 0) + amount;
        await db.collection('users').doc(userId).update({balance: newBalance});
        await db.collection('transactions').doc(id).update({status: 'Completed'});
        alert('Deposit approved!');
        loadDeposits();
        loadUsers();
    }
    
    async function loadWithdrawals(){
        let reqs = await db.collection('withdrawRequests').where('status','==','Pending').get();
        let html = '<table><tr><th>User</th><th>Amount</th><th>Bank</th><th>Action</th></tr>';
        for(let doc of reqs.docs){
            let d = doc.data();
            html += `<tr>
                <td>${d.userId.substring(0,10)}...</td>
                <td>₹${d.amount}</td>
                <td>${d.bankDetails?.bankName || 'N/A'}</td>
                <td><button class="btn-success" onclick="approveWithdraw('${doc.id}','${d.amount}','${d.userId}')">Approve</button></td>
            </tr>`;
        }
        html += '</table>';
        document.getElementById('withdrawalsList').innerHTML = html || '<p>No pending withdrawals</p>';
    }
    
    async function approveWithdraw(id, amount, userId){
        let user = await db.collection('users').doc(userId).get();
        if(user.data().balance < amount){
            alert('Insufficient balance!');
            return;
        }
        let newBalance = user.data().balance - amount;
        await db.collection('users').doc(userId).update({balance: newBalance});
        await db.collection('withdrawRequests').doc(id).update({status: 'Completed'});
        await db.collection('transactions').add({
            userId: userId, type: 'debit', amount: amount, status: 'Completed', date: new Date()
        });
        alert('Withdrawal approved!');
        loadWithdrawals();
        loadUsers();
    }
    
    function changePass(){
        let old = document.getElementById('oldPass').value;
        let newP = document.getElementById('newPass').value;
        if(old === adminPassword){
            adminPassword = newP;
            document.getElementById('passMsg').innerHTML = 'Password changed!';
        } else {
            document.getElementById('passMsg').innerHTML = 'Wrong old password';
        }
    }
    
    async function updateUPI(){
        let upi = document.getElementById('upiId').value;
        await db.collection('settings').doc('upi').set({upiId: upi});
        document.getElementById('upiMsg').innerHTML = 'UPI ID updated!';
        setTimeout(()=>document.getElementById('upiMsg').innerHTML='',2000);
    }
    
    function showSection(section){
        document.getElementById('marketsSection').classList.add('hidden');
        document.getElementById('usersSection').classList.add('hidden');
        document.getElementById('depositsSection').classList.add('hidden');
        document.getElementById('withdrawalsSection').classList.add('hidden');
        document.getElementById('settingsSection').classList.add('hidden');
        document.getElementById(section + 'Section').classList.remove('hidden');
    }
    
    function logout(){
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('adminPanel').style.display = 'none';
    }
    
    async function loadUPI(){
        let doc = await db.collection('settings').doc('upi').get();
        if(doc.exists) document.getElementById('upiId').value = doc.data().upiId;
    }
    loadUPI();
</script>
</body>
</html>
