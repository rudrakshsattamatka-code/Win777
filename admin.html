<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WIN777 - Admin Panel</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0a0a0f; }
        .login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0a0a0f; display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .login-box { background: #1a1a2e; padding: 40px; border-radius: 30px; width: 300px; text-align: center; }
        .login-box input { width: 100%; padding: 12px; margin: 10px 0; background: #0a0a0f; border: 1px solid #333; border-radius: 12px; color: white; }
        .login-box button { background: #ff9800; border: none; padding: 12px; width: 100%; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .admin-container { display: none; }
        .sidebar { width: 250px; background: #1a1a2e; min-height: 100vh; position: fixed; }
        .sidebar h2 { color: #ff9800; padding: 20px; text-align: center; }
        .sidebar-item { padding: 15px 20px; color: #aaa; cursor: pointer; border-bottom: 1px solid #222; }
        .sidebar-item:hover { background: #ff980015; color: #ff9800; }
        .main-content { margin-left: 250px; padding: 20px; }
        .card { background: #1a1a2e; border-radius: 20px; padding: 20px; margin-bottom: 20px; border: 1px solid #ff980020; }
        .card-title { color: #ff9800; font-size: 20px; margin-bottom: 15px; }
        input, select { background: #0a0a0f; border: 1px solid #333; padding: 10px; border-radius: 10px; color: white; margin: 5px; }
        button { background: #ff9800; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: bold; margin: 5px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #333; color: #ddd; }
        th { color: #ff9800; }
        .hidden { display: none; }
        .user-item, .market-item { background: #0a0a0f; padding: 10px; margin: 5px 0; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
    <div id="adminLogin" class="login-screen"><div class="login-box"><h2 style="color:#ff9800;">Admin Login</h2><input type="password" id="adminPass" placeholder="Password"><button onclick="verifyAdmin()">Login</button><div id="loginError" style="color:red; margin-top:10px;"></div></div></div>
    <div id="adminPanel" class="admin-container"><div class="sidebar"><h2>WIN777 ADMIN</h2><div class="sidebar-item" onclick="showSection('markets')">🎮 Manage Markets</div><div class="sidebar-item" onclick="showSection('users')">👥 Users</div><div class="sidebar-item" onclick="showSection('deposits')">💰 Deposit Requests</div><div class="sidebar-item" onclick="showSection('withdrawals')">💸 Withdrawal Requests</div><div class="sidebar-item" onclick="showSection('settings')">⚙️ Settings</div><div class="sidebar-item" onclick="logoutAdmin()">🚪 Logout</div></div><div class="main-content"><div id="marketsSection"><div class="card"><div class="card-title">➕ Add/Edit Market</div><input type="text" id="marketName" placeholder="Market Name"><input type="time" id="openEnd" placeholder="Open Bid End"><input type="time" id="closeEnd" placeholder="Close Bid End"><input type="text" id="marketResult" placeholder="Result (e.g., 123-45-678)"><button onclick="addMarket()">Add Market</button></div><div class="card"><div class="card-title">📋 Markets List</div><div id="marketsListAdmin"></div></div></div><div id="usersSection" class="hidden"><div class="card"><div class="card-title">👥 All Users</div><div id="usersListAdmin"></div></div></div><div id="depositsSection" class="hidden"><div class="card"><div class="card-title">💰 Deposit Requests</div><div id="depositsList"></div></div></div><div id="withdrawalsSection" class="hidden"><div class="card"><div class="card-title">💸 Withdrawal Requests</div><div id="withdrawalsList"></div></div></div><div id="settingsSection" class="hidden"><div class="card"><div class="card-title">🔐 Change Password</div><input type="password" id="oldPass" placeholder="Old Password"><input type="password" id="newPass" placeholder="New Password"><button onclick="changeAdminPass()">Update Password</button><div id="passMsg"></div></div><div class="card"><div class="card-title">🏧 UPI Settings</div><input type="text" id="upiId" placeholder="UPI ID (e.g., win777@okhdfcbank)"><button onclick="updateUPI()">Update UPI ID</button></div><div class="card"><div class="card-title">🎨 Logo Settings</div><input type="text" id="logoUrl" placeholder="Logo Image URL"><button onclick="updateLogo()">Update Logo</button></div></div></div></div>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyBeGpb7V0i5GN1opY9JECHxQIGvHFDPX38", authDomain: "win777-ed482.firebaseapp.com", projectId: "win777-ed482", storageBucket: "win777-ed482.firebasestorage.app", messagingSenderId: "843686112399", appId: "1:843686112399:web:9c20a96831e6a94cd814fa" };
        firebase.initializeApp(firebaseConfig); const auth = firebase.auth(); const db = firebase.firestore();
        let adminPassword = 'Gani99@@', marketsData = [];
        async function verifyAdmin(){ const pwd = document.getElementById('adminPass').value; if(pwd === adminPassword){ document.getElementById('adminLogin').style.display='none'; document.getElementById('adminPanel').style.display='flex'; await loadData(); } else document.getElementById('loginError').innerText='Wrong Password'; }
        async function loadData(){ await loadMarkets(); await loadUsers(); await loadDeposits(); await loadWithdrawals(); }
        async function loadMarkets(){ const snap = await db.collection('markets').get(); if(snap.empty){ marketsData = [{name:'KALYAN MORNING', openBidEnd:'11:00', closeBidEnd:'11:30', result:'***-**-***'}]; renderMarketsList(); } else { marketsData = snap.docs.map(d=>d.data()); renderMarketsList(); } }
        function renderMarketsList(){ const div=document.getElementById('marketsListAdmin'); div.innerHTML=marketsData.map((m,i)=>`<div class="user-item"><span><b>${m.name}</b><br>Open End: ${m.openBidEnd} | Close End: ${m.closeBidEnd}<br>Result: ${m.result}</span><div><button onclick="editMarket(${i})">Edit</button><button onclick="deleteMarket(${i})">Delete</button></div></div>`).join(''); }
        async function addMarket(){ const name=document.getElementById('marketName').value; const open=document.getElementById('openEnd').value; const close=document.getElementById('closeEnd').value; const res=document.getElementById('marketResult').value||'***-**-***'; if(!name||!open||!close) return; await db.collection('markets').add({name, openBidEnd:open, closeBidEnd:close, result:res}); await loadMarkets(); document.getElementById('marketName').value=''; }
        async function editMarket(i){ const m=marketsData[i]; const newName=prompt('New Name', m.name); const newOpen=prompt('Open Bid End', m.openBidEnd); const newClose=prompt('Close Bid End', m.closeBidEnd); const newRes=prompt('Result', m.result); if(newName) await db.collection('markets').add({name:newName, openBidEnd:newOpen, closeBidEnd:newClose, result:newRes}); await loadMarkets(); }
        async function deleteMarket(i){ if(confirm('Delete?')){ const m=marketsData[i]; const snap=await db.collection('markets').where('name','==',m.name).get(); snap.forEach(d=>d.ref.delete()); await loadMarkets(); } }
        async function loadUsers(){ const users=await db.collection('users').get(); const div=document.getElementById('usersListAdmin'); div.innerHTML=''; for(const doc of users.docs){ const u=doc.data(); const bids=await db.collection('bids').where('userId','==',doc.id).get(); div.innerHTML+=`<div class="user-item"><div><b>${u.name}</b> | ${u.phone}<br>Balance: ₹${u.balance} | Bids: ${bids.size}<br>Bank: ${u.bankDetails?.bankName||'N/A'}</div><div><button onclick="addBalance('${doc.id}')">Add ₹</button><button onclick="viewUserBids('${doc.id}')">Bids</button><button onclick="blockUser('${doc.id}')">Block</button></div></div>`; } }
        async function addBalance(uid){ const amt=prompt('Add Amount'); if(amt){ const u=await db.collection('users').doc(uid).get(); const newBal=(u.data().balance||0)+parseInt(amt); await db.collection('users').doc(uid).update({balance:newBal}); await loadUsers(); } }
        async function viewUserBids(uid){ const bids=await db.collection('bids').where('userId','==',uid).get(); alert(bids.docs.map(d=>`${d.data().gameType}: ${d.data().value} (${d.data().points})`).join('\n')); }
        async function blockUser(uid){ await db.collection('users').doc(uid).update({blocked:true}); alert('User Blocked'); await loadUsers(); }
        async function loadDeposits(){ const reqs=await db.collection('transactions').where('type','==','credit').where('status','==','Pending').get(); const div=document.getElementById('depositsList'); if(reqs.empty){ div.innerHTML='<p>No pending deposits</p>'; return; } div.innerHTML='<div class="data-table"><table><tr><th>User</th><th>Amount</th><th>Action</th></tr>'+reqs.docs.map(d=>`<tr><td>${d.data().userId}</td><td>₹${d.data().amount}</td><td><button onclick="approveDeposit('${d.id}')">Approve</button></td></tr>`).join('')+'</table></div>'; }
        async function approveDeposit(id){ const req=await db.collection('transactions').doc(id).get(); const uid=req.data().userId; const user=await db.collection('users').doc(uid).get(); const newBal=(user.data().balance||0)+req.data().amount; await db.collection('users').doc(uid).update({balance:newBal}); await db.collection('transactions').doc(id).update({status:'Completed'}); await loadDeposits(); await loadUsers(); }
        async function loadWithdrawals(){ const reqs=await db.collection('withdrawRequests').where('status','==','Pending').get(); const div=document.getElementById('withdrawalsList'); if(reqs.empty){ div.innerHTML='<p>No pending withdrawals</p>'; return; } div.innerHTML='<div class="data-table"><table><tr><th>User</th><th>Amount</th><th>Bank</th><th>Action</th></tr>'+reqs.docs.map(d=>`<tr><td>${d.data().userId}</td><td>₹${d.data().amount}</td><td>${d.data().bankDetails?.bankName}</td><td><button onclick="approveWithdraw('${d.id}', ${d.data().amount}, '${d.data().userId}')">Approve</button></td></tr>`).join('')+'</table></div>'; }
        async function approveWithdraw(id, amount, uid){ const user=await db.collection('users').doc(uid).get(); if(user.data().balance<amount){ alert('Insufficient balance'); return; } const newBal=user.data().balance-amount; await db.collection('users').doc(uid).update({balance:newBal}); await db.collection('withdrawRequests').doc(id).update({status:'Completed'}); await db.collection('transactions').add({userId:uid, type:'debit', amount:amount, status:'Completed', description:'Withdrawal Approved', date:new Date()}); await loadWithdrawals(); await loadUsers(); }
        function changeAdminPass(){ const old=document.getElementById('oldPass').value; const newP=document.getElementById('newPass').value; if(old===adminPassword){ adminPassword=newP; document.getElementById('passMsg').innerText='Password Changed!'; } else document.getElementById('passMsg').innerText='Wrong Old Password'; }
        function updateUPI(){ alert('UPI ID Updated (Simulated)'); }
        function updateLogo(){ alert('Logo URL Updated (Simulated)'); }
        function showSection(section){ document.getElementById('marketsSection').classList.add('hidden'); document.getElementById('usersSection').classList.add('hidden'); document.getElementById('depositsSection').classList.add('hidden'); document.getElementById('withdrawalsSection').classList.add('hidden'); document.getElementById('settingsSection').classList.add('hidden'); document.getElementById(`${section}Section`).classList.remove('hidden'); }
        function logoutAdmin(){ document.getElementById('adminLogin').style.display='flex'; document.getElementById('adminPanel').style.display='none'; }
    </script>
</body>
</html>
