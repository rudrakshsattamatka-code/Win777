<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WIN777 - Firebase Setup</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .setup-container {
            max-width: 600px;
            width: 100%;
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,152,0,0.2);
        }
        h1 {
            color: #ff9800;
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .status-card {
            background: #0a0a0f;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid #ff9800;
        }
        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #222;
        }
        .status-item:last-child {
            border-bottom: none;
        }
        .status-name {
            color: #ddd;
            font-size: 14px;
        }
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .status-success {
            background: #4caf5020;
            color: #4caf50;
            border: 1px solid #4caf50;
        }
        .status-pending {
            background: #ff980020;
            color: #ff9800;
            border: 1px solid #ff9800;
        }
        .status-error {
            background: #f4433620;
            color: #f44336;
            border: 1px solid #f44336;
        }
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            margin: 20px 0;
            overflow: hidden;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff9800, #ff5722);
            transition: width 0.3s;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff9800, #ff5722);
            border: none;
            border-radius: 16px;
            color: #1a1a2e;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.2s;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .log-area {
            background: #0a0a0f;
            border-radius: 16px;
            padding: 15px;
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            color: #8bc34a;
        }
        .log-entry {
            padding: 4px 0;
            border-bottom: 1px solid #1a1a2e;
        }
        .warning {
            background: #ff980020;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            color: #ff9800;
            font-size: 13px;
            text-align: center;
        }
        .success-message {
            background: #4caf5020;
            padding: 15px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 20px;
            color: #4caf50;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="setup-container">
        <h1>🔧 WIN777 Setup</h1>
        <div class="subtitle">Firebase Collections & Sample Data</div>

        <div class="warning">
            ⚠️ Make sure you are logged in as ADMIN to run this setup.<br>
            First register a user, then manually set role: "admin" in Firestore.
        </div>

        <div id="authStatus" class="status-card">
            <div class="status-item">
                <span class="status-name">🔐 Authentication Status</span>
                <span id="authBadge" class="status-badge status-pending">Checking...</span>
            </div>
            <div id="userInfo" style="color:#aaa; font-size:12px; margin-top:10px;"></div>
        </div>

        <div id="setupStatus" class="status-card">
            <div class="status-item">
                <span class="status-name">📦 Collections Setup</span>
                <span id="setupBadge" class="status-badge status-pending">Pending</span>
            </div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <button class="btn" id="setupBtn" onclick="runSetup()">🚀 Run Setup</button>

        <div class="log-area" id="logArea">
            <div class="log-entry">📋 Ready to run setup...</div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBeGpb7V0i5GN1opY9JECHxQIGvHFDPX38",
            authDomain: "win777-ed482.firebaseapp.com",
            projectId: "win777-ed482",
            storageBucket: "win777-ed482.firebasestorage.app",
            messagingSenderId: "843686112399",
            appId: "1:843686112399:web:9c20a96831e6a94cd814fa"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        let currentUser = null;
        let isAdmin = false;
        
        function addLog(message, type = 'info') {
            const logArea = document.getElementById('logArea');
            const colors = { info: '#8bc34a', error: '#f44336', warning: '#ff9800', success: '#4caf50' };
            const logDiv = document.createElement('div');
            logDiv.className = 'log-entry';
            logDiv.style.color = colors[type] || '#aaa';
            logDiv.innerHTML = `> ${message}`;
            logArea.appendChild(logDiv);
            logArea.scrollTop = logArea.scrollHeight;
        }
        
        function updateProgress(percent) {
            document.getElementById('progressFill').style.width = percent + '%';
        }
        
        async function checkAuth() {
            return new Promise((resolve) => {
                auth.onAuthStateChanged(async (user) => {
                    if (user) {
                        currentUser = user;
                        document.getElementById('authBadge').innerHTML = '✅ Logged In';
                        document.getElementById('authBadge').className = 'status-badge status-success';
                        document.getElementById('userInfo').innerHTML = `👤 User: ${user.email || user.phoneNumber || user.uid}<br>🆔 UID: ${user.uid}`;
                        
                        // Check if user is admin
                        const userDoc = await db.collection('users').doc(user.uid).get();
                        if (userDoc.exists && userDoc.data().role === 'admin') {
                            isAdmin = true;
                            addLog('✅ Admin access confirmed', 'success');
                            document.getElementById('setupBadge').innerHTML = 'Ready';
                            document.getElementById('setupBadge').className = 'status-badge status-success';
                        } else {
                            isAdmin = false;
                            addLog('⚠️ You are not an admin. Please set role: "admin" in your user document first.', 'warning');
                            document.getElementById('setupBadge').innerHTML = 'Need Admin';
                            document.getElementById('setupBadge').className = 'status-badge status-error';
                            document.getElementById('setupBtn').disabled = true;
                        }
                        resolve(isAdmin);
                    } else {
                        document.getElementById('authBadge').innerHTML = '❌ Not Logged In';
                        document.getElementById('authBadge').className = 'status-badge status-error';
                        document.getElementById('userInfo').innerHTML = 'Please login first from index.html';
                        document.getElementById('setupBtn').disabled = true;
                        resolve(false);
                    }
                });
            });
        }
        
        async function createCollection(collectionName, sampleData, options = {}) {
            try {
                addLog(`Creating collection: ${collectionName}...`, 'info');
                const snapshot = await db.collection(collectionName).limit(1).get();
                
                if (!snapshot.empty && !options.force) {
                    addLog(`   📁 ${collectionName} already exists (${snapshot.size} documents)`, 'success');
                    return { success: true, existing: true };
                }
                
                if (sampleData) {
                    if (Array.isArray(sampleData)) {
                        for (let i = 0; i < sampleData.length; i++) {
                            await db.collection(collectionName).add(sampleData[i]);
                        }
                        addLog(`   ✅ Added ${sampleData.length} documents to ${collectionName}`, 'success');
                    } else {
                        await db.collection(collectionName).add(sampleData);
                        addLog(`   ✅ Added sample document to ${collectionName}`, 'success');
                    }
                }
                return { success: true, existing: false };
            } catch (error) {
                addLog(`   ❌ Error creating ${collectionName}: ${error.message}`, 'error');
                return { success: false, error: error.message };
            }
        }
        
        async function runSetup() {
            if (!isAdmin) {
                addLog('❌ Setup cancelled: Admin access required', 'error');
                return;
            }
            
            const btn = document.getElementById('setupBtn');
            btn.disabled = true;
            btn.innerHTML = '⏳ Running Setup...';
            updateProgress(0);
            
            addLog('🚀 Starting Firebase Setup...', 'info');
            addLog('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'info');
            
            // 1. Sample Markets Data
            updateProgress(10);
            const marketsData = [
                { name: 'KALYAN MORNING', openBidEnd: '11:00 AM', closeBidEnd: '11:30 AM', result: '***-**-***', status: 'active' },
                { name: 'MILAN MORNING', openBidEnd: '11:30 AM', closeBidEnd: '12:00 PM', result: '***-**-***', status: 'active' },
                { name: 'SRIDEVI', openBidEnd: '12:35 PM', closeBidEnd: '01:05 PM', result: '***-**-***', status: 'active' },
                { name: 'TIME BAZAR', openBidEnd: '02:00 PM', closeBidEnd: '02:30 PM', result: '***-**-***', status: 'active' },
                { name: 'MILAN DAY', openBidEnd: '05:00 PM', closeBidEnd: '05:30 PM', result: '***-**-***', status: 'active' },
                { name: 'KALYAN', openBidEnd: '05:40 PM', closeBidEnd: '06:10 PM', result: '***-**-***', status: 'active' }
            ];
            await createCollection('markets', marketsData);
            
            // 2. Sample Settings
            updateProgress(25);
            const settingsData = {
                upiId: 'win777@okhdfcbank',
                logoUrl: 'https://i.imgur.com/lPQ7wQD.png',
                minDeposit: 200,
                maxDeposit: 49000,
                minWithdraw: 500,
                maxWithdraw: 50000,
                dailyWithdrawLimit: 5,
                minBet: 10,
                adminPassword: 'Gani99@@',
                siteName: 'WIN777',
                contactWhatsApp: '919876543210',
                contactPhone: '+919876543210'
            };
            await createCollection('settings', settingsData);
            
            // 3. Sample Bids (will be created by users)
            updateProgress(40);
            addLog('📋 Bids collection ready (will be populated by users)', 'info');
            
            // 4. Sample Transactions
            updateProgress(55);
            addLog('📊 Transactions collection ready (will be populated by users)', 'info');
            
            // 5. Withdraw Requests
            updateProgress(70);
            addLog('💸 Withdraw Requests collection ready', 'info');
            
            // 6. Users (already exists from registration)
            updateProgress(85);
            addLog('👥 Users collection ready', 'info');
            
            // 7. Create indexes reminder
            updateProgress(95);
            addLog('📌 Remember to create required indexes in Firebase Console:', 'warning');
            addLog('   - bids: userId (asc) + createdAt (desc)', 'warning');
            addLog('   - transactions: userId (asc) + date (desc)', 'warning');
            addLog('   - withdrawRequests: userId (asc) + createdAt (desc)', 'warning');
            
            updateProgress(100);
            addLog('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'success');
            addLog('✅ SETUP COMPLETED SUCCESSFULLY!', 'success');
            addLog('🎉 You can now use the WIN777 app.', 'success');
            
            document.getElementById('setupBadge').innerHTML = '✅ Completed';
            document.getElementById('setupBadge').className = 'status-badge status-success';
            btn.innerHTML = '✅ Setup Complete';
            
            // Show success message
            const successDiv = document.createElement('div');
            successDiv.className = 'success-message';
            successDiv.innerHTML = '🎉 All collections created successfully! You can now close this page.';
            document.querySelector('.setup-container').insertBefore(successDiv, document.getElementById('logArea'));
        }
        
        // Initialize
        checkAuth();
    </script>
</body>
</html>
