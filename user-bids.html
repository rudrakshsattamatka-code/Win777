<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WIN777 - User Bid Details</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f5f5f5; padding-bottom: 20px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        .header { background: #fff; padding: 20px; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid #eee; }
        .header h1 { color: #333; margin-bottom: 10px; }
        .header p { color: #666; }
        .back-btn { background: #333; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; margin-bottom: 20px; }
        .back-btn:hover { background: #555; }
        
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: #fff; padding: 20px; border-radius: 16px; text-align: center; border: 1px solid #eee; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .stat-card .label { color: #888; font-size: 12px; margin-bottom: 5px; }
        .stat-card .value { color: #333; font-size: 28px; font-weight: bold; }
        .stat-card .value.positive { color: #28a745; }
        .stat-card .value.negative { color: #dc3545; }
        
        .filters { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
        .filter-select { padding: 10px 15px; border: 1px solid #ddd; border-radius: 8px; background: #fff; cursor: pointer; font-size: 14px; }
        .search-input { flex: 1; padding: 10px 15px; border: 1px solid #ddd; border-radius: 8px; min-width: 200px; font-size: 14px; }
        .refresh-btn { background: #17a2b8; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
        
        .bids-table { background: #fff; border-radius: 16px; overflow-x: auto; border: 1px solid #eee; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th { background: #f8f9fa; padding: 15px; text-align: left; font-weight: bold; color: #333; border-bottom: 1px solid #eee; }
        td { padding: 12px 15px; border-bottom: 1px solid #eee; color: #555; }
        tr:hover { background: #f8f9fa; }
        .status-won { color: #28a745; font-weight: bold; }
        .status-lost { color: #dc3545; font-weight: bold; }
        .status-pending { color: #ff9800; font-weight: bold; }
        
        .no-data { text-align: center; padding: 40px; color: #888; }
        
        @media (max-width: 768px) {
            .stats { grid-template-columns: repeat(2, 1fr); }
            th, td { padding: 8px 10px; font-size: 12px; }
            .filters { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>
<div class="container">
    <button class="back-btn" onclick="window.close()">← Close Window</button>
    
    <div class="header">
        <h1 id="userName">Loading...</h1>
        <p id="userPhone">Phone: Loading...</p>
        <p id="userBalance">Balance: ₹0</p>
    </div>
    
    <div class="stats" id="stats">
        <div class="stat-card"><div class="label">Total Bids</div><div class="value" id="totalBids">0</div></div>
        <div class="stat-card"><div class="label">Total Spent</div><div class="value" id="totalSpent">₹0</div></div>
        <div class="stat-card"><div class="label">Total Won</div><div class="value positive" id="totalWon">₹0</div></div>
        <div class="stat-card"><div class="label">Net Profit/Loss</div><div class="value" id="netProfit">₹0</div></div>
    </div>
    
    <div class="filters">
        <select id="statusFilter" class="filter-select" onchange="loadBids()">
            <option value="all">All Status</option>
            <option value="won">Won</option>
            <option value="lost">Lost</option>
            <option value="pending">Pending</option>
        </select>
        <select id="gameTypeFilter" class="filter-select" onchange="loadBids()">
            <option value="all">All Game Types</option>
            <option value="Single Digit">Single Digit</option>
            <option value="Jodi">Jodi</option>
            <option value="Single Pana">Single Pana</option>
            <option value="Double Pana">Double Pana</option>
            <option value="Triple Pana">Triple Pana</option>
            <option value="Half Sangam A">Half Sangam A</option>
            <option value="Half Sangam B">Half Sangam B</option>
            <option value="Full Sangam">Full Sangam</option>
        </select>
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search by market or number..." onkeyup="loadBids()">
        <button class="refresh-btn" onclick="refreshData()">🔄 Refresh</button>
    </div>
    
    <div class="bids-table">
        <table id="bidsTable">
            <thead>
                <tr><th>Date & Time</th><th>Market</th><th>Game Type</th><th>Number</th><th>Points (₹)</th><th>Rate (x)</th><th>Possible Win (₹)</th><th>Status</th></tr>
            </thead>
            <tbody id="bidsList">
                <tr><td colspan="8" class="no-data">Loading bids...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBeGpb7V0i5GN1opY9JECHxQIGvHFDPX38",
        authDomain: "win777-ed482.firebaseapp.com",
        projectId: "win777-ed482",
        storageBucket: "win777-ed482.firebasestorage.app",
        messagingSenderId: "843686112399",
        appId: "1:843686112399:web:9c20a96831e6a94cd814fa"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    
    const gameRates = {
        'Single Digit': 10, 'Jodi': 100, 'Single Pana': 160,
        'Double Pana': 320, 'Triple Pana': 1000,
        'Half Sangam A': 1000, 'Half Sangam B': 1000, 'Full Sangam': 10000
    };
    
    let allBids = [];
    let userId = null;
    let userName = "";
    let userData = null;
    
    // Get URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    userId = urlParams.get('uid');
    userName = urlParams.get('name') || 'User';
    
    document.getElementById('userName').innerHTML = `📋 Bid History: ${escapeHtml(userName)}`;
    
    // Load user info and bids
    async function loadUserData() {
        if (!userId) {
            document.getElementById('userPhone').innerHTML = 'Phone: Unknown';
            document.getElementById('userBalance').innerHTML = 'Balance: ₹0';
            return;
        }
        
        try {
            const userDoc = await db.collection('users').doc(userId).get();
            if (userDoc.exists) {
                userData = userDoc.data();
                document.getElementById('userPhone').innerHTML = `📞 Phone: ${userData.phone || 'Not provided'}`;
                document.getElementById('userBalance').innerHTML = `💰 Balance: ₹${(userData.balance || 0).toLocaleString()}`;
            } else {
                document.getElementById('userPhone').innerHTML = 'Phone: User not found';
            }
        } catch (error) {
            console.error("Error loading user:", error);
            document.getElementById('userPhone').innerHTML = 'Phone: Error loading';
        }
    }
    
    // Load bids from Firestore
    async function loadBids() {
        if (!userId) {
            document.getElementById('bidsList').innerHTML = '<tr><td colspan="8" class="no-data">No user ID provided</td></tr>';
            return;
        }
        
        document.getElementById('bidsList').innerHTML = '<tr><td colspan="8" class="no-data">Loading bids...</td></tr>';
        
        try {
            // Get bids for this user, ordered by date descending (newest first)
            const bidsSnapshot = await db.collection('bids')
                .where('userId', '==', userId)
                .orderBy('timestamp', 'desc')
                .get();
            
            allBids = [];
            bidsSnapshot.forEach(doc => {
                const bid = doc.data();
                allBids.push({
                    id: doc.id,
                    ...bid,
                    timestamp: bid.timestamp?.toDate() || new Date(0)
                });
            });
            
            // Apply filters
            filterAndDisplayBids();
            updateStats();
            
        } catch (error) {
            console.error("Error loading bids:", error);
            document.getElementById('bidsList').innerHTML = '<tr><td colspan="8" class="no-data">Error loading bids. Please try again.</td></tr>';
        }
    }
    
    function filterAndDisplayBids() {
        const statusFilter = document.getElementById('statusFilter').value;
        const gameTypeFilter = document.getElementById('gameTypeFilter').value;
        const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();
        
        let filtered = [...allBids];
        
        // Filter by status
        if (statusFilter !== 'all') {
            filtered = filtered.filter(bid => bid.status === statusFilter);
        }
        
        // Filter by game type
        if (gameTypeFilter !== 'all') {
            filtered = filtered.filter(bid => bid.gameType === gameTypeFilter);
        }
        
        // Filter by market name or number
        if (searchTerm) {
            filtered = filtered.filter(bid => {
                const marketName = (bid.marketName || '').toLowerCase();
                const bidValue = (bid.value || '').toLowerCase();
                return marketName.includes(searchTerm) || bidValue.includes(searchTerm);
            });
        }
        
        displayBidsTable(filtered);
    }
    
    function displayBidsTable(bids) {
        const tbody = document.getElementById('bidsList');
        
        if (bids.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="no-data">No bids found matching criteria</td></tr>';
            return;
        }
        
        let html = '';
        for (const bid of bids) {
            const dateStr = formatDate(bid.timestamp);
            const gameRate = gameRates[bid.gameType] || 10;
            const possibleWin = bid.points * gameRate;
            const statusClass = bid.status === 'won' ? 'status-won' : (bid.status === 'lost' ? 'status-lost' : 'status-pending');
            const statusText = bid.status ? bid.status.toUpperCase() : 'PENDING';
            
            html += `
                <tr>
                    <td>${dateStr}</td>
                    <td>${escapeHtml(bid.marketName || 'Unknown')}</td>
                    <td>${escapeHtml(bid.gameType || '-')}</td>
                    <td>${escapeHtml(bid.value || '-')}</td>
                    <td>₹${bid.points || 0}</td>
                    <td>${gameRate}x</td>
                    <td>₹${possibleWin.toLocaleString()}</td>
                    <td class="${statusClass}">${statusText}</td>
                </tr>
            `;
        }
        tbody.innerHTML = html;
    }
    
    function updateStats() {
        const totalBids = allBids.length;
        let totalSpent = 0;
        let totalWon = 0;
        
        for (const bid of allBids) {
            totalSpent += bid.points || 0;
            if (bid.status === 'won') {
                const gameRate = gameRates[bid.gameType] || 10;
                totalWon += (bid.points || 0) * gameRate;
            }
        }
        
        const netProfit = totalWon - totalSpent;
        
        document.getElementById('totalBids').innerHTML = totalBids;
        document.getElementById('totalSpent').innerHTML = `₹${totalSpent.toLocaleString()}`;
        document.getElementById('totalWon').innerHTML = `₹${totalWon.toLocaleString()}`;
        
        const netElement = document.getElementById('netProfit');
        netElement.innerHTML = `₹${netProfit.toLocaleString()}`;
        if (netProfit > 0) {
            netElement.className = 'value positive';
        } else if (netProfit < 0) {
            netElement.className = 'value negative';
        } else {
            netElement.className = 'value';
        }
    }
    
    function formatDate(date) {
        if (!date || !(date instanceof Date) || isNaN(date)) return 'Unknown';
        return date.toLocaleString('en-IN', {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
        });
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    async function refreshData() {
        await loadUserData();
        await loadBids();
    }
    
    // Listen for real-time updates on user balance
    function listenToUserUpdates() {
        if (!userId) return;
        
        db.collection('users').doc(userId).onSnapshot((doc) => {
            if (doc.exists) {
                const data = doc.data();
                document.getElementById('userBalance').innerHTML = `💰 Balance: ₹${(data.balance || 0).toLocaleString()}`;
            }
        });
    }
    
    // Listen for real-time bid updates
    function listenToBidUpdates() {
        if (!userId) return;
        
        db.collection('bids')
            .where('userId', '==', userId)
            .orderBy('timestamp', 'desc')
            .onSnapshot((snapshot) => {
                allBids = [];
                snapshot.forEach(doc => {
                    const bid = doc.data();
                    allBids.push({
                        id: doc.id,
                        ...bid,
                        timestamp: bid.timestamp?.toDate() || new Date(0)
                    });
                });
                filterAndDisplayBids();
                updateStats();
            }, (error) => {
                console.error("Bid listener error:", error);
            });
    }
    
    // Initialize
    async function init() {
        await loadUserData();
        await loadBids();
        listenToUserUpdates();
        listenToBidUpdates();
    }
    
    init();
    
    // Make functions globally available for inline handlers
    window.loadBids = loadBids;
    window.refreshData = refreshData;
</script>
</body>
</html>
